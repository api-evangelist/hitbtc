components:
  responses:
    wallet_ForbiddenError:
      description: Action is forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_UnauthorizedError:
      description: Authorization is required or has been failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_408:
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_RequestTimeout'
    wallet_429:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_TooManyRequests'
    wallet_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Internal'
    wallet_403:
      description: Forbidden
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/wallet_Forbidden'
            - $ref: '#/components/schemas/wallet_ShouldUpgradePermission'
            - $ref: '#/components/schemas/wallet_NotEnoughPermissions'
    wallet_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/wallet_UnauthorizedBasic'
            - $ref: '#/components/schemas/wallet_UnauthorizedHS256'
            - $ref: '#/components/schemas/wallet_BadFormatHS256'
            - $ref: '#/components/schemas/wallet_AuthInvalid'
            - $ref: '#/components/schemas/wallet_BadFormat'
    wallet_504:
      description: Gateway Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_GatewayTimeout'
  schemas:
    wallet_SubAccountBalanceResponse:
      required:
      - main
      - trading
      type: object
      properties:
        main:
          $ref: '#/components/schemas/wallet_BalanceResponse'
        trading:
          $ref: '#/components/schemas/wallet_BalanceResponse'
    wallet_SubAccACLRequest:
      type: object
      properties:
        isPayoutEnabled:
          type: boolean
          description: Permission to create payout.
        description:
          type: string
          description: Text description for the ACL setting.
    wallet_SubAccountResponse:
      required:
      - id
      - email
      - status
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: User identifier.
        email:
          type: string
          description: User's email address.
        status:
          type: string
          enum:
          - new
          - active
          - disable
          description: "User account status:\n  * *new*—account is created, but not confirmed by email;\n  * *active*—account is fully functioning;\n  * *disable*—account is disabled.\n"
    wallet_BalanceResponse:
      required:
      - currency
      - available
      - reserved
      type: object
      properties:
        currency:
          type: string
          description: Currency code.
        available:
          type: string
          description: Amount available for withdrawals or transfers.
        reserved:
          type: string
          description: Amount reserved for incomplete transactions.
    wallet_SubAccTransfer:
      required:
      - subAccountId
      - currency
      - amount
      - type
      type: object
      properties:
        subAccountId:
          type: integer
          format: uint64
          description: Subaccount identifier.
        currency:
          type: string
          description: Currency code.
        amount:
          type: string
          description: The amount that will be transferred.
        type:
          type: string
          enum:
          - deposit
          - withdraw
          description: Transfer type.
    wallet_Error:
      required:
      - error
      type: object
      properties:
        error:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    wallet_CryptoAddress:
      required:
      - address
      type: object
      properties:
        address:
          type: string
          description: Wallet address.
        paymentId:
          type: string
          description: Payment identifier.
        publicKey:
          type: string
          description: Public key.
    wallet_SubAccACLResponse:
      allOf:
      - properties:
          subAccountId:
            type: integer
            format: uint64
            description: Subaccount identifier.
      - $ref: '#/components/schemas/wallet_SubAccACLRequest'
      - required:
        - subAccountId
        - isPayoutEnabled
        - description
    wallet_PaymentID:
      title: Payment ID
      type: object
      properties:
        payment_id:
          type: string
          pattern: ^[\w@\-.:<>]+$
          description: An additional recipient identifier (for example, "Memo") required for specific currencies.
    wallet_NotEnoughPermissions:
      title: Not enough permissions
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1007
          message: Not enough permissions
    wallet_TransactionNotFound:
      title: Transaction not found
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Any of:\n  * a transaction has failed to create;\n  * the requested transaction is not found.\n"
      example:
        error:
          code: 20004
          message: Transaction not found
          description: ''
    wallet_CurrencyNotFound:
      title: Currency not found
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Currency is not found.\n\nAny of:\n  * requested network is not found;\n  * requested currency is not found;\n  * no currency provided while the network is specified;\n  * requested network is disabled;\n  * operations relating to the request are disabled for the currency;\n  * currencies featured in an operation are not found.\n"
      example:
        error:
          code: 2002
          message: Currency not found
    wallet_SubToSubTransferRequest:
      title: Subaccount to subaccount transfer request
      allOf:
      - $ref: '#/components/schemas/wallet_SubaccountID'
      - $ref: '#/components/schemas/wallet_Currency'
      - $ref: '#/components/schemas/wallet_Amount'
      - required:
        - sub_account_id
        - currency
        - amount
    wallet_ShouldUpgradePermission:
      title: Should upgrade permission
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1006
          message: Action unavailable, please upgrade scopes
    wallet_SubaccountsIds:
      title: Subaccount IDs
      type: object
      required:
      - sub_account_ids
      properties:
        sub_account_ids:
          type: array
          items:
            $ref: '#/components/schemas/wallet_SubaccountIdCommon'
          description: A list of subaccounts external identifiers.
    wallet_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Any of:\n  * missing required parameters;\n  * the maximum of the time window is exceeded.\n"
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    wallet_SubAccountEmailNotConfirmed:
      title: Subaccount has not confirmed its email
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: 'At least one subaccount of the request has not confirmed its email address yet, therefore the whole request is rejected.


        The `description` field of the error lists the external identifiers of the subaccounts to drop from the request.

        '
      example:
        error:
          code: 21009
          message: Sub-account has not confirmed its email
          description: 'The subaccounts have not confirmed their email: 5RTGF43K, 8HJKL21M'
    wallet_SubaccountACLBase:
      title: Subaccount ACL
      type: object
      required:
      - sub_account_id
      - deposit_address_generation_enabled
      - withdraw_enabled
      properties:
        deposit_address_generation_enabled:
          type: boolean
          description: Flag indicating whether deposits are enabled.
        withdraw_enabled:
          type: boolean
          description: Flag indicating whether withdrawals are enabled.
        description:
          type: string
          description: Text description.
    wallet_SubToSuperTransferRequest:
      title: Subaccount to super account transfer request
      allOf:
      - $ref: '#/components/schemas/wallet_Currency'
      - $ref: '#/components/schemas/wallet_Amount'
      - required:
        - currency
        - amount
    wallet_TransactionID:
      title: Transaction ID
      type: string
      format: uuid
      description: Transaction UUID.
      example: 27fa7f14-ca49-42fd-834a-4ce630d069d2
    wallet_AuthInvalid:
      title: Invalid authorization
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Invalid JWT.
      example:
        error:
          code: 1005
          message: Invalid authorization
    wallet_Address:
      title: Deposit address
      type: object
      properties:
        address:
          $ref: '#/components/schemas/wallet_AddressCommon'
    wallet_TooManyRequests:
      title: Too Many Requests
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Rate limits are exceeded.
      example:
        error:
          code: 429
          message: Too many requests
    wallet_Balance:
      title: Wallet balance
      allOf:
      - $ref: '#/components/schemas/wallet_Currency'
      - type: object
        required:
        - available
        - currency
        - reserved
        properties:
          available:
            type: string
            description: Amount available for withdrawals and transfers to the exchange account.
            example: '14.08'
          reserved:
            type: string
            description: Total amount reserved for withdrawals, withdrawal fees, and transfers to the exchange account.
            example: '2.37'
    wallet_LowAmount:
      title: Low amount
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Operation amount is too low.\n\nAny of:\n  * provided amount is lesser than the currency precision (bit depth);\n  * fees are included in the final amount, and the amount is lesser than fees.\n"
      example:
        error:
          code: 10001
          message: Validation error
          description: Amount too low
    wallet_AmountCommon:
      title: Amount
      type: string
      description: 'The amount of the operation.


        Format: currency precision


        Values: > 0


        ℹ️ Call `GET /public/currency/{currency}` to get the currency precision.

        '
      example: '2.37'
    wallet_SubAccountTwoFactorRequired:
      title: Two-factor authentication is required
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: The super account has no two-factor authentication enabled.
      example:
        error:
          code: 21008
          message: Two-factor authentication is required
    wallet_Result:
      title: Result
      type: object
      required:
      - result
      properties:
        result:
          type: boolean
    wallet_NetworkCommon:
      title: Network
      type: string
      description: Network code.
      example: ETH
    wallet_SubaccountID:
      title: Subaccount ID
      type: object
      properties:
        sub_account_id:
          type: string
          description: Subaccount external identifier.
          example: A1408C
    wallet_SubaccountIdCommon:
      title: Subaccount ID
      type: string
      description: Subaccount external identifier.
      example: A1408C
    wallet_UpdatedAt:
      title: Updated at
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
          description: Date and time of the last update.
          example: 2024-03-22 15:04:05Z07:00
    wallet_AmountLocked:
      title: Amount locked
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Funds needed for execution of the operation are locked.
      example:
        error:
          code: 500
          message: Internal Server Error
    wallet_AddressCommon:
      title: Deposit address
      type: string
      pattern: ^([\w@\-.:<>]+|[0-9A-Z]{4}( ?[0-9A-Z]{4}){8}|(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?)$
      description: Deposit crypto address.
      example: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_PayoutCommitted:
      title: Payout committed
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Transaction associated with the operation was complete before being committed or rolled back.
      example:
        error:
          code: 20006
          message: Payout already committed
    wallet_Validation:
      title: Validation
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Any of:\n  * invalid JSON payload;\n  * invalid form payload;\n  * invalid payload format;\n  * invalid parameter value;\n  * invalid parameter format;\n  * specified parameters are mutually exclusive;\n  * a required parameter is missing;\n  * the value of a parameter is invalid;\n  * provided value is not unique;\n  * in an update request, no parameters provided.\n"
      example:
        error:
          code: 10001
          message: Validation error
    wallet_SubaccountTransferRequest:
      title: Subaccount transfer request
      allOf:
      - $ref: '#/components/schemas/wallet_SubaccountID'
      - $ref: '#/components/schemas/wallet_Currency'
      - $ref: '#/components/schemas/wallet_Amount'
      - type: object
        required:
        - sub_account_id
        - currency
        - amount
        - type
        properties:
          type:
            type: string
            enum:
            - to_sub_account
            - from_sub_account
            description: "Transfer type.\n\nValues:\n  * `to_sub_account`—from the user wallet to a subaccount wallet;\n  * `from_sub_account`—from a subaccount wallet to the user wallet.\n\n⚠️ Only a subaccount with `active` status may receive funds from the user (super account).\n"
    wallet_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Any of:\n  * invalid API key;\n  * user is not allowed to perform the requested operation.\n"
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    wallet_Amount:
      title: Amount
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/wallet_AmountCommon'
    wallet_UserDisabled:
      title: User disabled
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: A subaccount has not confirmed the registration or is disabled which is required for execution of the operation.
      example:
        error:
          code: 10021
          message: User disabled
    wallet_GatewayTimeout:
      title: Gateway Timeout
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: Gateway timeout.
      example:
        error:
          code: 22008
          message: Gateway timeout. Please, try again later.
    wallet_Currency:
      title: Currency
      properties:
        currency:
          $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_SubaccountACL:
      title: Subaccount ACL
      allOf:
      - $ref: '#/components/schemas/wallet_SubaccountID'
      - $ref: '#/components/schemas/wallet_SubaccountACLBase'
      - $ref: '#/components/schemas/wallet_CreatedAt'
      - $ref: '#/components/schemas/wallet_UpdatedAt'
    wallet_VerificationLevelTooLow:
      title: Verification level is too low
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: The verification level of the user is insufficient for the operation.
      example:
        error:
          code: 22011
          message: Verification level is too low
    wallet_RequestTimeout:
      title: Request Timeout
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: The request has been canceled.
      example:
        error:
          code: 408
          message: Request timeout
    wallet_SubAccountAlreadyFrozenOrDisabled:
      title: Subaccount already frozen or disabled
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: A subaccount has already been frozen or disabled regardless of super account actions.
      example:
        error:
          code: 21003
          message: Subaccount already frozen
    wallet_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/wallet_Error_2'
      type: object
      description: "Internal error.\n\nAny of:\n  * unclassified internal error;\n  * user bank account is blocked;\n  * transaction(s) for the requested operation have not been created;\n  * transaction(s) for the requested operation have been rolled back.\n"
      example:
        error:
          code: 500
          message: Internal Server Error
    wallet_Subaccount:
      title: Subaccount
