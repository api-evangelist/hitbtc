openapi: 3.2.0
info:
  title: Hitbtc Subaccounts API
  version: ''
  description: 'Operations tagged Subaccounts across 4 of this provider''s published API definitions: hitbtc-api-v2-spec.yaml, hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml, hitbtc-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/2
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
- url: https://api.hitbtc.com/api/2
  description: Production; the served spec declares the relative server /api/2 and the docs at api.hitbtc.com name this host
tags:
- name: Subaccounts
paths:
  /sub-acc:
    get:
      tags:
      - Subaccounts
      summary: Get subaccounts
      description: '**Permission:** *SubAccReadWrite*


        Returns a list of user''s subaccounts.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccountResponse'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: getSubAcc
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/freeze:
    post:
      tags:
      - Subaccounts
      summary: Freeze subaccounts
      description: '**Permission:** *SubAccReadWrite*'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: uint64
                  description: A comma-separated list of subaccounts to freeze.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: boolean
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccFreeze
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/activate:
    post:
      tags:
      - Subaccounts
      summary: Activate subaccounts
      description: '**Permission:** *SubAccReadWrite*'
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: uint64
                  description: A comma-separated list of subaccounts to activate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: boolean
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccActivate
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/transfer:
    post:
      tags:
      - Subaccounts
      summary: Transfer funds between a super account and a subaccount
      description: '**Permission:** *BankWithdraw*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubAccTransfer'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: string
                    example: f4fa539f-627d-4ab9-b1aa-5f69c5ee197b
                    description: Transaction unique identifier as assigned by the exchange.
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccTransfer
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/acl:
    get:
      tags:
      - Subaccounts
      summary: Get subaccounts' ACL
      description: '**Permission:** *BankAccess*'
      parameters:
      - name: subAccountIds
        in: query
        style: form
        explode: false
        schema:
          type: integer
          format: uint64
        description: A comma-separated list of subaccounts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccACLResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: getSubAccAcl
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/acl/{userId}:
    put:
      tags:
      - Subaccounts
      summary: Set an ACL for the subaccount
      description: '**Permission:** *BankAccess*'
      parameters:
      - $ref: '#/components/parameters/wallet_userIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubAccACLRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccACLResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: putSubAccAclByUserId
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/balance/{userId}:
    get:
      tags:
      - Subaccounts
      summary: Get subaccount balance
      description: '**Permission:** *BankAccess*'
      parameters:
      - $ref: '#/components/parameters/wallet_userIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_SubAccountBalanceResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: getSubAccBalanceByUserId
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-acc/deposit-address/{userId}/{currency}:
    get:
      tags:
      - Subaccounts
      summary: Get subaccount deposit address
      description: '**Permission:** *SubAccReadWrite*


        Creates a deposit address if no existing address is found.'
      parameters:
      - $ref: '#/components/parameters/wallet_userIdPath'
      - $ref: '#/components/parameters/wallet_currencyPath'
      - $ref: '#/components/parameters/wallet_networkCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_CryptoAddress'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: getSubAccDepositAddressByUserIdByCurrency
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /sub-account:
    get:
      tags:
      - Subaccounts
      summary: Get subaccounts
      description: 'Returns subaccounts tied to the user (a super account).


        **Permission**: None


        **Account limit**: 20/30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/wallet_Subaccount'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Validation'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: getSubAccount
      x-operation-id-source: derived
    post:
      tags:
      - Subaccounts
      summary: Create a subaccount
      description: 'Creates a subaccount tied to the user (a super account) taken from the session.


        ⚠️ The method is available under a user session only. A call authenticated with an API key is rejected with code `1003` regardless of the key permissions.


        ⚠️ The method is enabled per broker. While subaccount creation is switched off for the broker, every call is rejected with code `21010`.


        The request is rejected when:

        * subaccount creation is switched off for the broker—`21010`;

        * the caller is a subaccount itself—`21007`;

        * the caller has no two-factor authentication enabled—`21008`;

        * the verification level of the caller is insufficient—`22011`;

        * the email address is already registered, the address of the super account included—`21005`;

        * the password does not meet the requirements—`21006`.


        A created subaccount has the `"new"` status and the `"invited"` subaccount status: signing in is not possible until the email address is confirmed with the code from the invitation letter. Until the confirmation, the bank and the trading accounts of the subaccount are temporary, real ones are issued on the confirmation.


        **Permission**: None'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_SubaccountCreated'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_SubAccountEmailExists'
                - $ref: '#/components/schemas/wallet_SubAccountWeakPassword'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Forbidden'
                - $ref: '#/components/schemas/wallet_ShouldUpgradePermission'
                - $ref: '#/components/schemas/wallet_NotEnoughPermissions'
                - $ref: '#/components/schemas/wallet_SubAccountCallerNotSuper'
                - $ref: '#/components/schemas/wallet_SubAccountTwoFactorRequired'
                - $ref: '#/components/schemas/wallet_SubAccountCreationDisabled'
                - $ref: '#/components/schemas/wallet_VerificationLevelTooLow'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccount
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /sub-account/freeze:
    post:
      tags:
      - Subaccounts
      summary: Freeze subaccounts
      description: '⚠️ A subaccount cannot be frozen being in the `"disable"` status.


        **Permission**: None


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountsIds'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountsIds'
            encoding:
              sub_account_ids:
                style: form
                explode: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_SubAccountAlreadyFrozenOrDisabled'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_NotFound'
                - $ref: '#/components/schemas/wallet_SubAccountNotFound'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccountFreeze
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /sub-account/activate:
    post:
      tags:
      - Subaccounts
      summary: Activate subaccounts
      description: '⚠️ Activation is applicable if the only reason a subaccount has `"disable"` status is it was frozen. If there are other reasons underlying the status change, rolling back it is beyond control of the super account.


        ⚠️ A subaccount that has not confirmed its email address yet (the `"invited"` subaccount status while its holder is still in the `"new"` status) cannot be activated. If the request contains at least one such subaccount, the whole request is rejected with code `21009`, and the `description` field of the error lists the identifiers of the subaccounts to drop from the request. Unfreezing a frozen subaccount stays available regardless of the confirmation.


        **Permission**: None


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountsIds'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountsIds'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Validation'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Forbidden'
                - $ref: '#/components/schemas/wallet_ShouldUpgradePermission'
                - $ref: '#/components/schemas/wallet_NotEnoughPermissions'
                - $ref: '#/components/schemas/wallet_SubAccountEmailNotConfirmed'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_NotFound'
                - $ref: '#/components/schemas/wallet_SubAccountNotFound'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccountActivate
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /sub-account/transfer:
    post:
      tags:
      - Subaccounts
      summary: Commit a transfer to a subaccount
      description: 'Creates and commits a transfer between the user (super account) and a subaccount.


        ⚠️ Call is being sent by a super account.


        ⚠️ Created but not committed transfer will reserve pending amount on the sender wallet affecting their ability to withdraw or transfer crypto to a subaccount. Incomplete withdrawals affect subaccount transfers the same way.


        **Permission**: Withdraw cryptocurrencies


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountTransferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_SubaccountTransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_TransactionID'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_InsufficientFunds'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutCommitted'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_NotFound'
                - $ref: '#/components/schemas/wallet_UserDisabled'
                - $ref: '#/components/schemas/wallet_UserNotFound'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Internal'
                - $ref: '#/components/schemas/wallet_AmountLocked'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccountTransfer
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /sub-account/transfer/sub-to-super:
    post:
      tags:
      - Subaccounts
      summary: Commit a transfer to the super account
      description: 'Creates and commits a transfer from a subaccount to its super account.


        ⚠️ Call is being sent by a subaccount.


        ⚠️ Created but not committed transfer will reserve pending amount on the

        sender wallet affecting their ability to withdraw or transfer crypto to

        a subaccount. Incomplete withdrawals affect subaccount transfers the

        same way.


        **Permission**: Withdraw cryptocurrencies


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubToSuperTransferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_SubToSuperTransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_TransactionID'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_InsufficientFunds'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutCommitted'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_NotFound'
                - $ref: '#/components/schemas/wallet_UserDisabled'
                - $ref: '#/components/schemas/wallet_UserNotFound'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Internal'
                - $ref: '#/components/schemas/wallet_AmountLocked'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postSubAccountTransferSubToSuper
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /sub-account/transfer/sub-to-sub:
    post:
      tags:
      - Subaccounts
      summary: Commit a transfer across subaccounts
      description: 'Creates and commits a transfer between the user (subaccount) and

        another subaccount.


        ⚠️ Call is being sent by a subaccount.


        ⚠️ Created but not committed transfer will reserve pending amount on the

        sender wallet affecting their ability to withdraw or transfer crypto to

        a subaccount. Incomplete withdrawals affect subaccount transfers the

        same way.


        **Permission**: Withdraw cryptocurrencies


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubToSubTransferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_SubToSubTransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_TransactionID'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_InsufficientFunds'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutCommitted'
