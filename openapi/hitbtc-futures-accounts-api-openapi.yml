openapi: 3.2.0
info:
  title: Hitbtc Futures Accounts API
  version: ''
  description: 'Operations tagged Futures Accounts across 2 of this provider''s published API definitions: hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
tags:
- name: Futures Accounts
paths:
  /futures/account:
    get:
      tags:
      - Futures Accounts
      summary: Get futures margin accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/trading_FuturesAccountIsolated'
                  - $ref: '#/components/schemas/trading_Contract'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_SymbolExpired'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Orderbook, History, Trading balance


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getFuturesAccount
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /futures/account/isolated/{symbol}:
    get:
      tags:
      - Futures Accounts
      summary: Get a futures margin account
      parameters:
      - $ref: '#/components/parameters/trading_SymbolPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/trading_FuturesAccountCross'
                  - $ref: '#/components/schemas/trading_Contract'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_UnknownMarginAccount'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Orderbook, History, Trading balance


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getFuturesAccountIsolatedBySymbol
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /futures/account/cross/{currency}:
    get:
      tags:
      - Futures Accounts
      summary: Get a futures cross-margin account
      parameters:
      - $ref: '#/components/parameters/trading_CurrencyPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/trading_FuturesAccountCross'
                  - $ref: '#/components/schemas/trading_Contract'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_CurrencyNotFound'
                - $ref: '#/components/schemas/trading_UnknownMarginMode'
                - $ref: '#/components/schemas/trading_UnknownMarginAccount'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Orderbook, History, Trading balance


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getFuturesAccountCrossByCurrency
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /futures/account/{margin_mode}/{instrument}:
    put:
      tags:
      - Futures Accounts
      summary: Update a futures margin account
      description: 'Creates, updates, or closes a margin account.


        ℹ️ To retrieve all funds from a margin account, set `margin_balance` to `0`.


        ℹ️ The request is not required if AMM (auto margin management) is

        enabled: margin is reserved and released automatically. It still can be

        used to reserve additional margin for the account.


        **Permission**: Place/cancel orders


        **IP limit**: 300/450'
      parameters:
      - $ref: '#/components/parameters/trading_MarginModePath'
      - name: instrument
        in: path
        required: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/trading_SymbolCommon'
          - $ref: '#/components/schemas/trading_CurrencyCommon'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/trading_MarginBalanceRequest'
              - $ref: '#/components/schemas/trading_LeverageRequest'
              - $ref: '#/components/schemas/trading_Contract'
          application/x-www-form-urlencoded:
            schema:
              allOf:
              - $ref: '#/components/schemas/trading_MarginBalanceRequest'
              - $ref: '#/components/schemas/trading_LeverageRequest'
              - $ref: '#/components/schemas/trading_Contract'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/trading_FuturesAccountReport'
                - $ref: '#/components/schemas/trading_Contract'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_CurrencyNotFound'
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
                - $ref: '#/components/schemas/trading_MarginTradingForbidden'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_UnknownMarginMode'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
        '500':
          description: Interval Server Error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_Internal'
                - $ref: '#/components/schemas/trading_ResponseFormatter'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: putFuturesAccountByMarginModeByInstrument
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /futures/margin-settings/amr:
    put:
      tags:
      - Futures Accounts
      summary: Set AMR
      description: 'Changes the AMR (auto margin replenishment) flag of a futures margin

        account: an isolated one addressed by `symbol` or a cross-margin one

        addressed by `currency`.


        ℹ️ For a cross-margin account, the flag is applied to all the positions

        of the account at once.


        ℹ️ The request is rejected with the `403` status code if

        `user_can_change_amr_isolated`/`user_can_change_amr_cross` is `false`

        for the requested margin mode.


        ℹ️ Setting the value the account already has is not an error: the

        current state is returned, but no report is sent.


        **Permission**: Place/cancel orders


        **IP limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_SetAmrRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/trading_SetAmrRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_SetAmr'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
                - $ref: '#/components/schemas/trading_CurrencyNotFound'
                - $ref: '#/components/schemas/trading_UnknownMarginMode'
                - $ref: '#/components/schemas/trading_UnknownMarginAccount'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_AmmDisabled'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: putFuturesMarginSettingsAmr
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  schemas:
    trading_ResponseFormatter:
      title: Formatter error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * the position symbol is not found when returning the response;

        * a margin balance currency is not found when returning the response.

        '
      example:
        error:
          code: 500
          message: Internal error
          description: response formatter error
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * missing required parameters;

        * the maximum time window is exceeded.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_MarginModeCommon:
      title: Margin mode
      type: string
      enum:
      - cross
      - Cross
      - isolated
      - Isolated
      description: Margin mode.
    trading_AmmDisabled:
      title: AMM feature is disabled
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'AMM (auto margin management) is disabled on the platform.

        '
      example:
        error:
          code: 65
          message: AMM feature is disabled
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Trading on the requested market is not available.

        '
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_PositionBase:
      title: Margin position
      type: object
      required:
      - id
      - symbol
      - margin_mode
      - quantity
      - price_entry
      - price_margin_call
      - price_liquidation
      - pnl
      - created_at
      - updated_at
      - status
      - required_margin
      - orders_margin
      - margin_auto
      - amr
      properties:
        id:
          type: integer
          format: uint64
          description: Position identifier.
          example: 1408
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        quantity:
          type: string
          description: Position quantity.
          example: '0.00007'
        price_entry:
          type: string
          description: Average weighted price of position open orders.
          example: '33304.11'
        price_margin_call:
          type: string
          description: Margin call price.
          example: '25395.20'
        price_liquidation:
          type: string
          description: Liquidation price.
          example: '24884.62'
        pnl:
          type: string
          description: Unrealized profit and loss.
          example: '0.014772687500'
        fee_cumulative:
          type: string
          description: "Total amount of fees paid throughout the position lifetime until it\n is closed.\n\nFormat: Decimal\n\nValues: `0` if a new position created\n\n⚠️ This value does zero out after the position closes  and does not\n when it flips.\n"
          example: '0.14'
        created_at:
          type: string
          format: date-time
          description: Position creation date and time.
          example: '2024-03-22T17:26:10.758Z'
        updated_at:
          type: string
          format: date-time
          description: Position last update date and time.
          example: '2024-03-22T21:20:03.64Z'
        status:
          type: string
          enum:
          - normal
          - blocked
          - closeOnly
          description: "Position status.\n\nValues:\n* `normal`—the client can place and cancel orders, amend and change\n  the margin;\n* `blocked`—the client cannot place orders on either side;\n* `closeOnly`—the client may only place orders to close the\n  position.\n"
        required_margin:
          type: string
          description: 'Amount of currency reserved for close orders.

            '
          example: '1.126441946273'
        orders_margin:
          type: string
          description: 'Amount of currency reserved for open orders.

            '
          example: '0'
        margin_call:
          type: boolean
          description: 'Flag indicating whether additional margin is required to maintain the position.

            '
        margin_auto:
          type: boolean
          description: "Flag indicating whether AMM (auto margin management) is enabled for\n the position.\n"
        amr:
          type: boolean
          description: "Current value of the AMR (auto margin replenishment) flag of the\n position.\n"
    trading_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_CurrencyNotFound:
      title: Currency not found
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided currency has not been found.


        Any of:

        * the currency is disabled;

        * the currency is unavailable for a given market.

        '
      example:
        error:
          code: 2002
          message: Currency not found
    trading_StrictValidateRequest:
      title: Strict validate
      type: object
      properties:
        strict_validate:
          type: boolean
          description: Price and quantity will be checked for incrementation within the symbol tick size and quantity step (see the symbol `tick_size` and `quantity_increment`).
          default: false
    trading_UnknownMarginMode:
      title: Unknown margin mode
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid margin mode.

        '
      example:
        error:
          code: 2025
          message: Unknown margin mode
    trading_UnknownMarginAccount:
      title: Unknown margin account
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'No margin account for a given instrument is found.

        '
      example:
        error:
          code: 10025
          message: Unknown margin account
    trading_FuturesAccountIsolated:
      title: Isolated
      allOf:
      - $ref: '#/components/schemas/trading_AccountBase'
      - $ref: '#/components/schemas/trading_Leverage'
      - type: object
        required:
        - positions
        properties:
          positions:
            type: array
            items:
              $ref: '#/components/schemas/trading_FuturesPositionBase'
            description: Open positions of the margin account.
          currencies:
            type: array
            items:
              $ref: '#/components/schemas/trading_IsolatedAccountBalance'
            description: 'Amount of funds on margin account.

              '
    trading_FuturesPosition:
      title: Margin position
      allOf:
      - $ref: '#/components/schemas/trading_Leverage'
      - $ref: '#/components/schemas/trading_FuturesPositionBase'
    trading_SymbolCommon:
      title: Symbol
      type: string
      description: Symbol code.
    trading_AccountBase:
      title: Margin account
      type: object
      required:
      - symbol
      - type
      - created_at
      - updated_at
      - currencies
      - margin_call
      - margin_auto
      - amr
      properties:
        symbol:
          type: string
          description: 'Trading symbol, where base currency is the currency of funds

            reserved on the exchange account for positions and quote currency is

            the currency of funds reserved on a margin account.

            '
          example: BTCUSDT
        type:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        created_at:
          type: string
          format: date-time
          description: 'Account creation date and time.

            '
          example: '2024-03-22T17:26:10.758Z'
        updated_at:
          type: string
          format: date-time
          description: 'Account last update date and time.

            '
          example: '2024-03-22T21:20:03.64Z'
        margin_call:
          type: boolean
          description: 'Flag indicating whether additional margin is required to maintain

            the position.

            '
        margin_auto:
          type: boolean
          description: 'Flag indicating whether AMM (auto margin management) is enabled for

            the margin account.

            '
        amr:
          type: boolean
          description: 'Current value of the AMR (auto margin replenishment) flag of the

            margin account.

            '
    trading_CrossAccountBalance:
      title: Cross account balance
      allOf:
      - $ref: '#/components/schemas/trading_IsolatedAccountBalance'
      - required:
        - margin_call_margin
        - liquidation_margin
        - debt_sum
      - properties:
          margin_call_margin:
            type: string
            description: 'The lower boundary to `margin_balance` minus debt.


              ℹ️ If the margin is equal to this value, a margin call is sent.


              ℹ️ This do not carry information that would be valuable for

              predicting the condition of a position, since those change after an

              adjusted price (mark price) changes.

              '
            example: '0.37'
          liquidation_margin:
            type: string
            description: 'The lower boundary to `margin_balance` minus debt.


              ℹ️ If the margin is equal to this value, it is liquidated.


              ℹ️ This do not carry information that would be valuable for

              predicting the condition of a position, since those change after an

              adjusted price (mark price) changes.

              '
            example: '0.23'
          debt_sum:
            type: string
            description: 'Account debt for interests (fundings), fees, and loss.

              '
            example: '0'
    trading_Contract:
      title: Contract
      example:
        symbol: BTCUSDT_PERP
    trading_MarginBalanceRequest:
      title: Margin balance request
      allOf:
      - $ref: '#/components/schemas/trading_StrictValidateRequest'
      - type: object
        required:
        - margin_balance
        properties:
          margin_balance:
            type: number
            minimum: 0
            description: Amount of currency reserved for margin trading.
            example: 2.37
    trading_SetAmr:
      title: Set AMR
      type: object
      required:
      - margin_mode
      - amr
      properties:
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        symbol:
          type: string
          description: 'Symbol code of the isolated margin account.


            Conditions: `margin_mode` is `isolated`

            '
          example: BTCUSDT
        currency:
          type: string
          description: 'Currency code of the cross-margin account.


            Conditions: `margin_mode` is `cross`

            '
          example: USDT
        amr:
          type: boolean
          description: "Current value of the AMR (auto margin replenishment) flag of the\n margin account.\n"
      example:
        margin_mode: isolated
        symbol: BTCUSDT
        amr: true
    trading_ExchangeClosed:
      title: Exchange closed
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Exchange is temporary closed.

        '
      example:
        error:
          code: 20010
          message: Exchange temporary closed
    trading_FuturesAccountReport:
      title: Margin account report
      oneOf:
      - $ref: '#/components/schemas/trading_AccountIsolated'
      - $ref: '#/components/schemas/trading_AccountCrossReport'
    trading_Error:
      title: Error
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_UnauthorizedJWT:
      title: Unauthorized (Bearer)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid JWT.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: Unclassified internal error.
      example:
        error:
          code: 500
          message: Internal Server Error
    trading_Leverage:
      title: Leverage
      type: object
      required:
      - leverage
      properties:
        leverage:
          type: string
          description: 'Leverage—the ratio of the user own funds to funds borrowed from the

            platform.

            '
          example: '12.00'
    trading_SymbolNotFound:
      title: Symbol not found
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'The symbol featured in the request has not been found.

        '
      example:
        error:
          code: 2001
          message: Symbol not found
    trading_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation;

        * invalid time window value;

        * invalid HMAC signature format;

        * invalid HMAC signature value.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_Forbidden:
      title: Forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: "Any of:\n* insufficient API key permissions;\n* provided IP address is not in the white list;\n* the user is not eligible for the given liquidity pool due to the\n  configuration.\n"
      example:
        error:
          code: 1003
          message: Action is forbidden for this API key
    trading_MarginTradingForbidden:
      title: Margin trading forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Margin trading is forbidden for the user.


        Any of:

        * the user is not found;

        * user verification level does not allow margin trading;

        * the user is suspected of fraudulent activity.

        '
      example:
        error:
          code: 20052
          message: Margin trading forbidden
    trading_AccountIsolated:
      title: Isolated
      allOf:
      - $ref: '#/components/schemas/trading_AccountBase'
      - $ref: '#/components/schemas/trading_Leverage'
      - type: object
        required:
        - positions
        properties:
          positions:
            type: array
            items:
              $ref: '#/components/schemas/trading_PositionBase'
            description: Open positions of the margin account.
          currencies:
