  /public/futures/candles/open_interest:
    get:
      tags:
        - Open Interest Candles
      summary: Get open interest candles
      parameters:
        - $ref: '#/components/parameters/marketData_Symbols'
        - $ref: '#/components/parameters/marketData_SortDesc'
        - $ref: '#/components/parameters/marketData_Period'
        - $ref: '#/components/parameters/marketData_From'
        - $ref: '#/components/parameters/marketData_Till'
        - $ref: '#/components/parameters/marketData_Limit10'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  x-additionalPropertiesName: symbol
                  $ref: '#/components/schemas/marketData_CandleBase'
                example:
                  BTCUSDT_PERP:
                    - timestamp: '2024-06-26T12:32:01.636Z'
                      open: '2.1365'
                      close: '2.1365'
                      min: '2.1365'
                      max: '2.1365'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/marketData_InstrumentNotFound'
                  - $ref: '#/components/schemas/marketData_Validation'
        '404':
          $ref: '#/components/responses/marketData_404'
      security: []
      description: |

        **Permission**: None

        **IP limit**: 30/50
  /public/futures/candles/open_interest/{symbol}:
    get:
      tags:
        - Open Interest Candles
      summary: Get contract open interest candles
      parameters:
        - $ref: '#/components/parameters/marketData_SymbolPath'
        - $ref: '#/components/parameters/marketData_SortDesc'
        - $ref: '#/components/parameters/marketData_Period'
        - $ref: '#/components/parameters/marketData_From'
        - $ref: '#/components/parameters/marketData_Till'
        - $ref: '#/components/parameters/marketData_Limit100'
        - $ref: '#/components/parameters/marketData_Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
