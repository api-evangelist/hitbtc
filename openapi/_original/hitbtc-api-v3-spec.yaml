        **IP limit**: 30/50
  /public/orderbook/{symbol}:
    get:
      tags:
        - Order Books
      summary: Get an order book
      parameters:
        - $ref: '#/components/parameters/marketData_SymbolPath'
        - name: depth
          in: query
          schema:
            type: integer
            default: 100
          description: |
            The number of price levels.

            ℹ️ Set to `0` to view the full order book.
        - name: volume
          in: query
          schema:
            type: number
          description: |
            The minimum total volume among the levels.

            Format: decimal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_OrderBook'
        '400':
