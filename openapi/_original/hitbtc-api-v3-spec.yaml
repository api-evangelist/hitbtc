        - wallet_BasicAuth: []
  /sub-account/activate:
    post:
      tags:
        - Subaccounts
      summary: Activate subaccounts
      description: >
        ⚠️ Activation is applicable if the only reason a subaccount has
        `"disable"` status is it was frozen. If there are other reasons
        underlying the status change, rolling back it is beyond control of the
        super account.


        ⚠️ A subaccount that has not confirmed its email address yet (the
        `"invited"` subaccount status while its holder is still in the `"new"`
        status) cannot be activated. If the request contains at least one such
        subaccount, the whole request is rejected with code `21009`, and the
        `description` field of the error lists the identifiers of the
        subaccounts to drop from the request. Unfreezing a frozen subaccount
        stays available regardless of the confirmation.


        **Permission**: None


        **Account limit**: 20/30
      requestBody:
        required: true
        content:
          application/json:
            schema:
