          type: boolean
          description: |
            Flag requesting AMM (auto margin management) for the margin account
             or position the order belongs to.

            If AMM is enabled, the margin required for the order and for the
             position is reserved from the trading balance automatically, and no
             margin account has to be created in advance.

            ℹ️ The value is applied only if the margin account is idle, meaning
             that it has no open positions and no active orders. Otherwise, the
             value of the account is kept and the value of the order is ignored.

            Conditions: applicable to margin orders only

            Default: `false`

            ℹ️ The exchange web interface sends the value of `current_amm`
             returned by `GET /margin-settings`. An API client that follows the
             user setting has to pass the flag explicitly.
