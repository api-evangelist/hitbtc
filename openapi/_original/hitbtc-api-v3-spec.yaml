        ⚠️ Apart from available balance, the amount of a withdrawal must exceed
        the sum of:
          * fees;
          * the total amount reserved on all wallets;
          * the total amount reserved on all exchange accounts;
          * pending amounts of concurrent withdrawals.

        ⚠️ An operation may fail due to the following reasons:
          * the user cannot perform this type of operation based on:
            * temporary account limitations;
            * no active 2FA.
          * it does not pass pre-AML checks.

        ⚠️ Created but not committed withdrawal will reserve pending amount on
        the sender wallet affecting the balance remaining for other withdrawals.


        ⚠️ Successful response to the request does not necessarily mean the
        resulting transaction got executed immediately. It has to be processed
        first and may eventually be rolled back or fail.


        ℹ️ Call `GET /public/currency/{currency}` and check `payout_enabled` to
        determine if withdrawals are allowed for the currency.


        ℹ️ Call `GET /wallet/transactions/{id}` to check out the status of
        resulting transaction.


