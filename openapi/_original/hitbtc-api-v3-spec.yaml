components:
  parameters:
    marketData_CurrencyPath:
      name: currency
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/marketData_CurrencyCommon'
    marketData_Currencies:
      name: currencies
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/marketData_CurrencyCommon'
      description: A comma-separated list of currency codes.
    marketData_SymbolPath:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/marketData_SymbolCommon'
    marketData_Symbols:
      name: symbols
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/marketData_SymbolCommon'
      description: A comma-separated list of symbol codes.
    marketData_SortDesc:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - DESC
          - ASC
        default: DESC
      description: |
        Sort order.

        Values:
          * `ASC`—ascending;
          * `DESC`—descending.
    marketData_From:
      name: from
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/marketData_TimestampCommon'
          - default: 1
      description: Interval start value.
    marketData_Till:
      name: till
      in: query
      schema:
        allOf:
          - $ref: '#/components/schemas/marketData_TimestampCommon'
          - default: 1000
      description: Interval end value.
    marketData_Period:
      name: period
      in: query
      schema:
        type: string
        enum:
          - M1
          - M3
          - M5
          - M15
          - M30
          - H1
          - H4
          - D1
          - D7
          - 1M
        default: M30
      description: |
        History time period.

        Values:
          * `M*`—minutes;
          * `H*`—hours;
          * `D*`—days;
          * `1M`—one month.
    marketData_Limit10:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
      description: The number of items to return.
    marketData_Limit100:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: The number of items to return.
    marketData_Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
      description: The number of items to skip before starting to collect the result set.
    marketData_ByTimestamp:
      name: by
      in: query
      schema:
        type: string
        enum:
          - timestamp
          - id
        default: timestamp
      description: The name of the field to order the results by.
    marketData_Pool:
      name: exclude_pool
      in: query
      schema:
        type: boolean
      description: Flag indicating whether to return trades for a single broker.
    marketData_TargetCurrency:
      name: target_currency
      in: query
      required: true
      schema:
        allOf:
          - $ref: '#/components/schemas/marketData_CurrencyCommon'
          - description: Target currency for conversion.
    wallet_CurrencyPath:
      name: currency
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_SubaccountIdPath:
      name: sub_account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/wallet_SubaccountIdCommon'
    wallet_CurrencyReq:
      name: currency
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_Currency:
      name: currency
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_AmountReq:
      name: amount
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/wallet_AmountCommon'
    wallet_LabelIdReq:
      name: label_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: |
        Fee label UUID.
      example: 81cee4a1-0eb4-433b-b205-888e232c9f40
    wallet_TransactionIdPathReq:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/wallet_TransactionID'
    wallet_Network:
      name: network_code
      in: query
      schema:
        $ref: '#/components/schemas/wallet_NetworkCommon'
    wallet_Sort:
      name: sort
      in: query
      schema:
        type: string
        default: desc
        enum:
          - desc
          - asc
          - DESC
          - ASC
      description: |
        Sort order.

        Values:
          * `asc`—ascending (from A to Z);
          * `desc`—descending (from Z to A).
    wallet_Limit:
      name: limit
      in: query
      schema:
        maximum: 1000
        minimum: 1
        type: integer
        format: int
        default: 100
      description: The number of items to return.
    wallet_Offset:
      name: offset
      in: query
      schema:
        maximum: 100000
        minimum: 0
        type: integer
        format: int
        default: 0
      description: The number of items to skip before starting to collect the result set.
    wallet_IdFrom:
      name: id_from
      in: query
      schema:
        type: integer
        format: uint64
        example: 221163
      description: |
        Transaction `id` start value (inclusive).
    wallet_IdTill:
      name: id_till
      in: query
      schema:
        type: integer
        format: uint64
        example: 332274
      description: |
        Transaction `id` end value (inclusive).
    wallet_From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
        description: |
          Interval start value.

          Format: RFC 3339 in nanoseconds
        example: 2024-03-22 15:04:05Z07:00
      description: |
        Interval start value (inclusive).

        ℹ️ `order_by` defines the value type.
    wallet_Till:
      name: till
      in: query
      schema:
        type: string
        format: date-time
        description: |
          Interval end value.

          Format: RFC 3339 in nanoseconds
        example: 2024-03-22 15:04:05Z07:00
      description: |
        Interval end value (inclusive).

        ℹ️ `order_by` defines the value type.
    wallet_qryLabels:
      name: labels
      in: query
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/wallet_schLabels'
    trading_ClOrderIdPath:
      name: client_order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 32
        pattern: ^[a-zA-Z0-9_\-]{8,32}$
      description: Client-provided or system-generated identifier of the order.
      example: d8574207d9e3b16a4a5511753eeef175
    trading_CurrencyPath:
      name: currency
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/trading_CurrencyCommon'
    trading_Currency:
      name: currency
      in: query
      schema:
        $ref: '#/components/schemas/trading_CurrencyCommon'
    trading_SymbolPath:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/trading_SymbolCommon'
    trading_Symbol:
      name: symbol
      in: query
      schema:
        $ref: '#/components/schemas/trading_SymbolCommon'
    trading_Symbols:
      name: symbol
      in: query
      schema:
        type: array
        nullable: true
        items:
          $ref: '#/components/schemas/trading_SymbolCommon'
        minItems: 1
      style: form
      explode: false
      description: Comma-separated symbol codes.
    trading_ClOrderId:
      name: client_order_id
      in: query
      schema:
        type: string
        minLength: 8
        maxLength: 32
        pattern: ^[a-zA-Z0-9_\-]{8,32}$
      description: Client-provided or system-generated identifier of the order.
    trading_OrderId:
      name: order_id
      in: query
      schema:
        type: integer
        format: uint64
        minimum: 0
      description: Order identifier as assigned by the exchange.
      example: 816088377
    trading_PositionId:
      name: position_id
      in: query
      schema:
        type: integer
        format: uint64
        minimum: 0
      description: Position identifier.
      example: 972
    trading_MarginModePath:
      name: margin_mode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/trading_MarginModeCommon'
    trading_By:
      name: by
      in: query
      schema:
        type: string
        default: id
        enum:
          - timestamp
          - ts
          - id
      description: |
        The type of field the entries sorted by.

        Values:
          * `timestamp`, `ts`—date and time of entry creation;
          * `id`—identifier of the entry.
    trading_ByTs:
      name: by
      in: query
      required: true
      schema:
        type: string
        enum:
          - timestamp
          - ts
      description: |
        The type of field entries sorted by.

        Values:
          * `timestamp`, `ts`—date and time of entry creation.
    trading_From:
      name: from
      in: query
      schema:
        oneOf:
          - type: integer
            format: uint64
            description: Interval start value.
          - type: string
            format: date-time
            description: |
              Interval start value.

              Format: RFC 3339 in nanoseconds
            example: '2024-03-22T15:04:05.999999999'
    trading_Till:
      name: till
      in: query
      schema:
        oneOf:
          - type: integer
            format: uint64
            description: Interval end value.
          - type: string
            format: date-time
            description: |
              Interval end value.

              Format: RFC 3339 in nanoseconds
            example: '2024-03-22T15:04:05.999999999'
    trading_TsFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
        description: |
          Interval start value.

          Format: RFC 3339 in nanoseconds
        example: '2024-03-22T15:04:05.999999999'
      description: Entry identifier or timestamp.
    trading_TsTill:
      name: till
      in: query
      schema:
        type: string
        format: date-time
        description: |
          Interval end value.

          Format: RFC 3339 in nanoseconds
        example: '2024-03-22T15:04:05.999999999'
      description: Entry identifier or timestamp.
    trading_Sort:
      name: sort
      in: query
      schema:
        type: string
        default: desc
        enum:
          - desc
          - asc
      description: |
        Sort order.

        Values:
          * `asc`—ascending (from A to Z);
          * `desc`—descending (from Z to A).
    trading_Limit:
      name: limit
      in: query
      description: The number of items to return.
      schema:
        maximum: 1000
        minimum: 1
        type: integer
        format: int
        default: 100
    trading_Offset:
      name: offset
      in: query
      schema:
        maximum: 100000
        minimum: 0
        type: integer
        format: int
        default: 0
      description: The number of items to skip before starting to collect the result set.
  schemas:
    marketData_TimestampCommon:
      title: Timestamp
      oneOf:
        - title: ISO 8601
          type: string
          format: date-time
          description: |
            Format: ISO 8601
          example: '2024-03-22T15:04:05.590Z'
        - title: UNIX seconds
          type: integer
          description: |
            Format: UNIX timestamp in seconds
          example: 1687778487
        - title: UNIX milliseconds
          type: integer
          description: |
            Format: UNIX timestamp in milliseconds
          example: 1687778556151
    marketData_CurrencyCommon:
      title: Currency
      type: string
      description: Currency code.
      example: USDT
    marketData_CurrencyNetworkBase:
      title: Network
      type: object
      properties:
        payin_enabled:
          type: boolean
          description: >-
            Flag indicating whether generating deposit addresses is allowed for
            the currency.
        payout_enabled:
          type: boolean
          description: Flag indicating whether withdrawals are allowed for the currency.
        crypto_payment_id_name:
          type: string
          description: The name of an additional account identifier for the protocol used.
          example: ''
        crypto_explorer:
          type: string
          description: >-
            The link to the currency explorer with `{tx}` placeholder instead of
            a hash.
          example: https://blockchair.com/bitcoin/transaction/{tx}
    marketData_CurrencyBase:
      title: Currency
      allOf:
        - $ref: '#/components/schemas/marketData_CurrencyNetworkBase'
        - type: object
          properties:
            full_name:
              type: string
              description: Currency full name.
              example: Tether Omni
            crypto:
              type: boolean
              description: Flag indicating whether the currency is a cryptocurrency.
            transfer_enabled:
              type: boolean
              description: >-
                Flag indicating whether transfers between the bank and the
                exchange accounts are allowed for the currency (may be disabled
                on maintenance).
            sign:
              type: string
              description: Currency sign.
              example: ₮
            account_top_order:
              type: integer
              minimum: 1
              description: The absolute position of the currency in the currency list.
              example: 3
            qr_prefix:
              type: string
              description: >-
                The QR prefix used for indication of the currency in a deposit
                address.
            precision_transfer:
              type: string
              description: The minimum amount of a transfer.
              example: '0.00000001'
            delisted:
              type: boolean
              description: Flag indicating whether the currency has been delisted.
    marketData_NetworkBase:
      title: Network
      type: object
      properties:
        payout_fee:
          type: string
          description: >
            The minimal possible fee value constituted of the network fee
            charged by a blockchain and the maintenance fee charged by the
            exchange.


            ⚠️ This fee is valid only if both network and maintenance fees fell
            below its minimal absolute values given the withdrawal amount.


            ℹ️ Call `GET /wallet/crypto/fee/estimate` to see the exact value of
            fees based on the amount.


            Format: decimal
          example: '0.001050000000'
        precision_payout:
          type: string
          description: The minimum amount of a withdrawal.
          example: '0.00000001'
        payout_is_payment_id:
          type: boolean
          description: >-
            Flag indicating whether providing additional information for
            withdrawals is needed.
        payin_payment_id:
          type: boolean
          description: >-
            Flag indicating whether providing additional information for
            deposits is needed.
        payin_confirmations:
          type: integer
          description: >-
            The number of confirmation required for a transaction to be accepted
            in the network.
          example: 1
        low_processing_time:
          type: string
          description: The lowest processing time in seconds for a withdrawal.
          example: '11.443'
        high_processing_time:
          type: string
          description: The highest processing time in seconds for a withdrawal.
          example: '54.165'
        avg_processing_time:
          type: string
          description: The average processing time in seconds for a withdrawal.
          example: '30.355375'
    marketData_Currency:
      allOf:
        - $ref: '#/components/schemas/marketData_CurrencyBase'
        - type: object
          required:
            - full_name
            - crypto
            - payin_enabled
            - payout_enabled
            - transfer_enabled
            - transfer_to_wallet_enabled
            - transfer_to_exchange_enabled
            - precision_transfer
            - delisted
            - networks
          properties:
            networks:
              type: array
              items:
                $ref: '#/components/schemas/marketData_Network'
              description: Networks that may host operations on the currency.
            transfer_to_wallet_enabled:
              type: boolean
              description: |
                Flag indicating whether transfers to the bank account are
                allowed for the currency (may be disabled on maintenance).
            transfer_to_exchange_enabled:
              type: boolean
              description: |
                Flag indicating whether transfers to the exchange account are
                allowed for the currency (may be disabled on maintenance).
    marketData_Network:
      allOf:
        - $ref: '#/components/schemas/marketData_CurrencyNetworkBase'
        - $ref: '#/components/schemas/marketData_NetworkBase'
        - type: object
          required:
            - code
            - network_name
            - network
            - is_ens_available
            - default
            - payin_enabled
            - payout_enabled
            - precision_payout
            - payout_is_payment_id
            - payin_payment_id
            - payin_confirmations
            - is_multichain
          properties:
            code:
              type: string
              description: Currency code.
              example: BTC
            network_name:
              type: string
              description: Network full name.
              example: BTC
            network:
              type: string
              description: Code of the currency of the hosting network.
              example: BTC
            protocol:
              type: string
              description: |
                The standard or protocol underlying network operations or smart
                 contracts.

                ℹ️ If equals `code`, the currency is the network native
                 currency.

                ℹ️ If `TOKEN`, the currency is a token build on top of this
                 layer-2 network.
              example: BTC
            default:
              type: boolean
              description: |
                Flag indicating whether the network is the default for the
                 currency.
            is_ens_available:
              type: boolean
              description: |
                Flag indicating whether the network supports ENS (Ethereum Name
                 Service).
            address_regex:
              type: string
              description: Regular expression for a deposit address.
            payment_id_regex:
              type: string
              description: Regular expression for the payment identifier string.
            contract_address:
              type: string
              description: Token contract address.
              example: '0xdac17f958d2ee523a2206206994597c13d831ec7'
            is_multichain:
              type: boolean
              description: |
                Flag indicating whether multichain is active for the network.
            asset_id:
              type: object
              nullable: true
              description: |
                A unique arbitrary object that identifies a coin.

                ℹ️ Each network has own set of properties returned inside an
                 object.
    marketData_CurrencyMap:
      title: Currencies
      type: object
      additionalProperties:
        x-additionalPropertiesName: currency
        $ref: '#/components/schemas/marketData_Currency'
      example:
        USDT:
          full_name: Tether Omni
          crypto: true
          payin_enabled: true
          payout_enabled: true
          transfer_enabled: true
          transfer_to_wallet_enabled: true
          transfer_to_exchange_enabled: true
          sign: ₮
          account_top_order: 3
          crypto_payment_id_name: ''
          crypto_explorer: http://omniexplorer.info/lookuptx.aspx?txid={tx}
          precision_transfer: '0.01'
          delisted: false
          networks:
            - code: BTC
              network_name: BTC
              network: BTC
              protocol: OMNI
              default: true
              is_ens_available: true
              payin_enabled: true
              payout_enabled: true
              precision_payout: '0.01'
              payout_fee: '50.000000000000'
              payout_is_payment_id: false
              payin_payment_id: false
              payin_confirmations: 2
              low_processing_time: '11.443'
              high_processing_time: '54.165'
              avg_processing_time: '30.355375'
              is_multichain: false
    marketData_InternalCurrency:
      title: Internal currency
      allOf:
        - $ref: '#/components/schemas/marketData_CurrencyBase'
        - $ref: '#/components/schemas/marketData_NetworkBase'
        - type: object
          required:
            - full_name
            - crypto
            - payin_enabled
            - payin_payment_id
            - payin_confirmations
            - payout_enabled
            - payout_is_payment_id
            - transfer_enabled
            - delisted
            - precision_payout
            - precision_transfer
          properties:
            payout_minimal_amount:
              type: string
              description: The size of minimal available withdrawal.
            token_family:
              type: string
              description: Token group.
              example: eth
            crypto_type:
              type: string
              enum:
                - ''
                - btc
                - nxt
                - cryptonote
                - crypto_address
                - payment_id
                - ICO
                - TOKEN
              description: |
                Type of crypto platform.

                Values:
                  * `btc`—BTC-like currencies;
                  * `nxt`—NXT only;
                  * `cryptonote`—currencies that use the cryptonote algorithm (e.g., BCN, XMR);
                  * `payment_id`—currencies that allow to specify a transaction identifier;
                  * `ICO`—futures (currency which has not been released on the market yet);
                  * `TOKEN`—tokens;
                  * `crypto_address`—Ethereum contract address;
                  * empty string—any other currency types.
            category:
              type: string
              description: Currency category.
              example: LMC
            is_instruments_stable:
              type: boolean
              description: >-
                If `true`, the pairs of this currency are displayed on the
                **Stable** tab.
    marketData_SymbolCommon:
      title: Symbol
      type: string
      description: Symbol code.
    marketData_SymbolStatus:
      title: Symbol status
      type: string
      enum:
        - working
        - suspended
      description: Exchange status.
    marketData_FuturesSymbolStatus:
      title: Futures symbol status
      type: string
      enum:
        - clearing
    marketData_SymbolTypeEnum:
      title: Symbol types
      type: string
      enum:
        - spot
    marketData_FuturesSymbolTypeEnum:
      title: Futures symbol types
      type: string
      enum:
        - futures
    marketData_SymbolBase:
      title: Symbol
      allOf:
        - $ref: '#/components/schemas/marketData_SymbolMarginFields'
        - type: object
          required:
            - type
            - quote_currency
            - status
            - quantity_increment
            - tick_size
            - fee_currency
            - make_rate
            - take_rate
          properties:
            type:
              allOf:
                - $ref: '#/components/schemas/marketData_SymbolTypeEnum'
                - $ref: '#/components/schemas/marketData_FuturesSymbolTypeEnum'
              description: Symbol type.
            quote_currency:
              type: string
              description: Quote currency.
              example: USDT
            status:
              allOf:
                - $ref: '#/components/schemas/marketData_SymbolStatus'
                - $ref: '#/components/schemas/marketData_FuturesSymbolStatus'
            quantity_increment:
              type: string
              description: >-
                Symbol quantity should be divided by this value with no
                remainder.
              example: '0.00001'
            tick_size:
              type: string
              description: Symbol price should be divided by this value with no remainder.
              example: '0.01'
            fee_currency:
              type: string
              description: Currency in which fees are denominated.
              example: USDT
            make_rate:
              type: string
              description: Maker fee rate.
              example: '0.001'
            take_rate:
              type: string
              description: Taker fee rate.
              example: '0.002'
    marketData_SymbolMarginFields:
      title: Margin symbol
      type: object
      properties:
        margin_trading:
          type: boolean
          description: Flag indicating whether the margin trading is available.
        max_initial_leverage:
          type: string
          description: |
            The maximum leverage available to the user for margin trading.

            Conditions: `margin_trading` is `true`
          example: '12.00'
    marketData_SpotSymbol:
      title: Spot symbol
      allOf:
        - $ref: '#/components/schemas/marketData_SymbolBase'
        - type: object
          required:
            - base_currency
          properties:
            base_currency:
              type: string
              description: Base currency.
              example: BTC
    marketData_FuturesSymbolBase:
      title: Futures symbol
      allOf:
        - $ref: '#/components/schemas/marketData_SymbolBase'
        - type: object
          required:
            - contract_type
            - underlying
          properties:
            contract_type:
              type: string
              enum:
                - perpetual
                - cash_settled
              description: Contract type.
            underlying:
              type: string
              nullable: true
              description: Futures contract underlying asset.
              example: BTC
        - example:
            max_initial_leverage: '100.00'
    marketData_PerpetualFuturesSymbol:
      title: Perpetual
      allOf:
        - $ref: '#/components/schemas/marketData_FuturesSymbolBase'
        - type: object
          required:
            - expiry
          properties:
            expiry:
              type: string
              format: date-time
              nullable: true
              enum:
                - null
              description: Futures expiration date.
    marketData_CashSettledFuturesSymbol:
      title: Cash settled
      allOf:
        - $ref: '#/components/schemas/marketData_FuturesSymbolBase'
        - type: object
          required:
            - expiry
          properties:
            expiry:
              type: string
              format: date-time
              nullable: true
              description: Futures expiration date.
              example: '2024-03-22T14:00:00.000Z'
    marketData_FuturesSymbol:
      allOf:
        - type: object
        - title: Futures symbol
          discriminator:
            propertyName: contract_type
            mapping:
              perpetual: '#/components/schemas/marketData_PerpetualFuturesSymbol'
              cash_settled: '#/components/schemas/marketData_CashSettledFuturesSymbol'
          oneOf:
            - $ref: '#/components/schemas/marketData_PerpetualFuturesSymbol'
            - $ref: '#/components/schemas/marketData_CashSettledFuturesSymbol'
    marketData_SpotSymbolMap:
      title: Spot symbols
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_SpotSymbol'
      example:
        BTCUSDT:
          type: spot
          base_currency: BTC
          quote_currency: USDT
          status: working
          quantity_increment: '0.00001'
          tick_size: '0.01'
          take_rate: '0.0025'
          make_rate: '0.001'
          fee_currency: USDT
    marketData_FuturesSymbolMap:
      title: Futures symbols
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_FuturesSymbol'
      example:
        BTCUSDT_PERP:
          type: futures
          contract_type: perpetual
          expiry: null
          underlying: BTC
          base_currency: null
          quote_currency: USDT
          status: working
          quantity_increment: '0.00001'
          tick_size: '0.01'
          take_rate: '0.002'
          make_rate: '0.001'
          fee_currency: USDT
          margin_trading: true
          max_initial_leverage: '100.00'
    marketData_Quote:
      type: object
      additionalProperties:
        x-additionalPropertiesName: currency
        $ref: '#/components/schemas/marketData_Price'
      example:
        BTC:
          currency: USDT
          price: '30250.48'
          timestamp: '2024-03-22T15:04:05.590Z'
    marketData_Price:
      type: object
      required:
        - currency
        - price
        - timestamp
      properties:
        currency:
          type: string
          description: Quote currency code.
          example: USDT
        price:
          type: string
          description: Quotation price.
          example: '30250.48'
        timestamp:
          type: string
          format: date-time
          description: Last update or refresh price timestamp.
          example: '2024-03-22T15:04:05.590Z'
    marketData_LastPrice:
      title: Last price
      type: object
      required:
        - price
        - timestamp
      properties:
        price:
          type: string
          nullable: true
          description: The last trade price.
          example: '30271.04'
        timestamp:
          type: string
          format: date-time
          description: Date and time of the trade.
          example: '2024-03-22T15:04:05.590Z'
    marketData_LastPriceMap:
      title: Last prices
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_LastPrice'
      example:
        BTCUSDT:
          price: '30271.04'
          timestamp: '2024-03-22T15:04:05.590Z'
    marketData_CandleBase:
      title: Candle
      type: object
      required:
        - timestamp
        - open
        - close
        - min
        - max
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2024-03-22T15:04:05.590Z'
          description: Candle timestamp.
        open:
          type: string
          example: '0.063420'
          description: Open value.
        close:
          type: string
          example: '0.063767'
          description: Closing value.
        min:
          type: string
          example: '0.063403'
          description: The lowest value for the period.
        max:
          type: string
          example: '0.063782'
          description: The highest value for the period.
    marketData_VolumeBase:
      title: Volume
      type: object
      required:
        - volume
        - volume_quote
      properties:
        volume:
          type: string
          description: Total trading volume in base currency.
          example: '1706.80119'
        volume_quote:
          type: string
          description: >
            Total trading volume in quote currency.


            ℹ️ Volume of each trade is the trade quantity multiplied by its
            price.
          example: '51792032.6885613'
    marketData_LastPriceHistory:
      title: Price history
      required:
        - currency
        - history
      type: object
      properties:
        currency:
          type: string
          example: BTC
          description: Quote currency code.
        history:
          type: array
          items:
            $ref: '#/components/schemas/marketData_CandleBase'
    marketData_LastPriceHistoryMap:
      title: Prices history
      type: object
      additionalProperties:
        x-additionalPropertiesName: currency
        $ref: '#/components/schemas/marketData_LastPriceHistory'
      example:
        BTC:
          currency: USDT
          history:
            - timestamp: '2024-03-22T15:04:05.590Z'
              open: '30320.16'
              close: '30289.45'
              min: '30269.59'
              max: '30370.84'
    marketData_Ticker:
      allOf:
        - $ref: '#/components/schemas/marketData_VolumeBase'
        - type: object
          required:
            - ask
            - bid
            - high
            - last
            - low
            - open
            - timestamp
          properties:
            ask:
              type: string
              nullable: true
              description: Best ask price.
              example: 30278.72'
            bid:
              type: string
              nullable: true
              description: Best bid price.
              example: '30271.50'
            last:
              type: string
              nullable: true
              description: Last trade price.
              example: '30280.70'
            low:
              type: string
              description: The lowest trade price for the past 24 hours.
              example: '29969.85'
            high:
              type: string
              description: The highest trade price for the past 24 hours.
              example: '30732.71'
            open:
              type: string
              nullable: true
              description: Last trade price 24 hours ago.
              example: '30685.37'
            timestamp:
              type: string
              format: date-time
              description: Last update or refresh ticker timestamp.
              example: '2024-03-22T15:04:05.590Z'
    marketData_TickerMap:
      title: Tickers
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_Ticker'
      example:
        BTCUSDT:
          ask: '30278.72'
          bid: '30271.50'
          last: '30280.70'
          low: '29969.85'
          high: '30732.71'
          open: '30685.37'
          volume: '1706.80119'
          volume_quote: '51792032.6885613'
          timestamp: '2024-06-26T12:32:01.636Z'
    marketData_Candle:
      allOf:
        - $ref: '#/components/schemas/marketData_VolumeBase'
        - $ref: '#/components/schemas/marketData_CandleBase'
    marketData_CandleMap:
      title: Candles
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        type: array
        items:
          $ref: '#/components/schemas/marketData_Candle'
      example:
        BTCUSDT:
          - timestamp: '2024-06-26T12:32:01.636Z'
            open: '30320.16'
            close: '30289.45'
            min: '30269.59'
            max: '30370.84'
            volume: '1706.80119'
            volume_quote: '51792032.6885613'
    marketData_ConvertedCandle:
      title: Converted candle
      type: object
      required:
        - target_currency
        - data
      properties:
        target_currency:
          allOf:
            - $ref: '#/components/schemas/marketData_CurrencyCommon'
            - description: Target currency for conversion.
        data:
          type: array
          items:
            $ref: '#/components/schemas/marketData_Candle'
    marketData_ConvertedCandles:
      title: Converted candle
      type: object
      required:
        - target_currency
        - data
      properties:
        target_currency:
          allOf:
            - $ref: '#/components/schemas/marketData_CurrencyCommon'
            - description: Target currency for conversion.
        data:
          $ref: '#/components/schemas/marketData_CandleMap'
    marketData_OrderBook:
      title: Order book
      type: object
      required:
        - timestamp
        - ask
        - bid
      properties:
        timestamp:
          type: string
          format: date-time
          description: Publication timestamp.
          example: '2024-06-26T12:32:01.636Z'
        ask:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
          description: Ask levels (price and volume).
          example:
            - '30607.36'
            - '7.63670'
        bid:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
          description: Bid levels (price and volume).
          example:
            - '30362.40'
            - '6.20293'
    marketData_OrderBookMap:
      title: Order books
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_OrderBook'
      example:
        BTCUSDT:
          timestamp: '2024-06-26T12:32:01.636Z'
          ask:
            - - '30607.36'
              - '7.63670'
          bid:
            - - '30362.40'
              - '6.20293'
    marketData_Trade:
      type: object
      required:
        - id
        - price
        - qty
        - side
        - timestamp
      properties:
        id:
          type: integer
          description: Trade identifier.
          example: 1098303
        price:
          type: string
          description: Trade price.
          example: '30930.12'
        qty:
          type: string
          description: Trade quantity.
          example: '0.24689'
        side:
          type: string
          enum:
            - sell
            - buy
          description: Aggressor order side.
        timestamp:
          type: string
          format: date-time
          description: Trade timestamp.
          example: '2024-06-26T12:32:01.636Z'
    marketData_TradeMap:
      title: Trades
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        type: array
        items:
          $ref: '#/components/schemas/marketData_Trade'
      example:
        BTCUSDT:
          - id: 1098303
            price: '30930.12'
            qty: '0.24689'
            side: sell
            timestamp: '2024-06-26T12:32:01.636Z'
    marketData_FuturesCandleMap:
      title: Futures candles
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        type: array
        items:
          $ref: '#/components/schemas/marketData_CandleBase'
      example:
        BTCUSDT_PERP:
          - timestamp: '2024-06-26T12:32:01.636Z'
            open: '30422.07'
            close: '30591.34'
            min: '30399.64'
            max: '30594.43'
    marketData_FundingHistory:
      title: Funding history
      type: object
      required:
        - timestamp
        - funding_rate
        - avg_premium_index
        - next_funding_time
        - interest_rate
      properties:
        timestamp:
          type: string
          format: date-time
          description: Date and time of the clearing.
          example: '2024-06-26T12:32:01.636Z'
        funding_rate:
          type: string
          description: >-
            Percentage of the contract mark value paid after the end of the
            current funding interval.
          example: '0.00025'
        avg_premium_index:
          type: string
          description: >-
            Time-weighted average over premium indexes for *previous* funding
            period. Used during calculation of `funding_rate` for adjusting it
            to the deviation of contract market price from the mark price.
          example: '-0.000016478878555706'
        next_funding_time:
          type: string
          description: Date and time of the next clearing.
          example: '2024-06-26T20:32:01.636Z'
        interest_rate:
          type: string
          description: Contract interest rate for one funding period.
          example: '0.001'
    marketData_FundingHistoryMap:
      title: Fundings history
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        type: array
        items:
          $ref: '#/components/schemas/marketData_FundingHistory'
      example:
        BTCUSDT_PERP:
          - timestamp: '2024-06-26T12:32:01.636Z'
            funding_rate: '0.00025'
            avg_premium_index: '-0.000016478878555706'
            next_funding_time: '2024-06-26T20:32:01.636Z'
            interest_rate: '0.001'
    marketData_FuturesInfoBase:
      title: Futures info
      type: object
      required:
        - contract_type
        - mark_price
        - index_price
        - open_interest
        - timestamp
      properties:
        contract_type:
          type: string
          enum:
            - perpetual
            - cash_settled
          description: Contract type.
        mark_price:
          type: string
          default: '0'
          description: Recent asset price adjusted by the value of fair basis.
          example: '30505.48'
        index_price:
          type: string
          default: '0'
          description: Average underlying asset price.
          example: '30503.94'
        open_interest:
          type: string
          default: '0'
          description: Total quantity of traded futures contracts.
          example: '3.93843'
        timestamp:
          type: string
          format: date-time
          description: Request timestamp.
          example: '2024-06-26T14:22:57.304Z'
    marketData_PerpetualFuturesInfo:
      title: Perpetual
      allOf:
        - $ref: '#/components/schemas/marketData_FuturesInfoBase'
        - type: object
          required:
            - funding_rate
            - next_funding_time
            - indicative_funding_rate
            - premium_index
            - avg_premium_index
            - interest_rate
          properties:
            funding_rate:
              type: string
              default: '0'
              description: >-
                Percentage of contract mark value paid after the end of the
                current funding interval.
              example: '0.00025'
            next_funding_time:
              type: string
              format: date-time
              description: Timestamp of the next funding.
              example: '2024-06-26T20:32:01.636Z'
            indicative_funding_rate:
              type: string
              default: '0'
              description: >-
                Estimated value of `funding_rate` in the next funding period
                calculated at the moment.
              example: '0.00025'
            premium_index:
              type: string
              default: '0'
              description: >
                Time-weighted average over premium indexes from the previous
                funding to the current moment.


                ℹ️ Used during calculation of `indicative_funding_rate`.
              example: '0'
            avg_premium_index:
              type: string
              default: '0'
              description: >
                Time-weighted average over premium indexes for **previous**
                funding period.


                ℹ️ Used during calculation of `funding_rate` for adjusting it to
                the deviation of contract market price from the mark price.
              example: '0'
            interest_rate:
              type: string
              default: '0'
              description: Contract interest rate for one funding period.
              example: '0.001'
    marketData_CashSettledFuturesInfo:
      title: Cash settled
      allOf:
        - $ref: '#/components/schemas/marketData_FuturesInfoBase'
        - type: object
          required:
            - indicative_settlement_price
            - expiry
          properties:
            indicative_settlement_price:
              type: string
              default: '0'
              description: >
                Expected price of closing position on a cash settled contract.


                ℹ️ Calculated during the last 30 minutes prior to contract
                expiration—until that, equals to `index_price`.
              example: '31503.94'
            expiry:
              type: string
              description: Contract expiration date.
              example: '2024-07-26T14:22:57.304Z'
    marketData_FuturesInfo:
      allOf:
        - type: object
        - title: Futures info
          discriminator:
            propertyName: contract_type
            mapping:
              perpetual: '#/components/schemas/marketData_PerpetualFuturesInfo'
              cash_settled: '#/components/schemas/marketData_CashSettledFuturesInfo'
          oneOf:
            - $ref: '#/components/schemas/marketData_PerpetualFuturesInfo'
            - $ref: '#/components/schemas/marketData_CashSettledFuturesInfo'
    marketData_FuturesInfoMap:
      title: Futures info
      type: object
      additionalProperties:
        x-additionalPropertiesName: symbol
        $ref: '#/components/schemas/marketData_FuturesInfo'
      example:
        BTCUSDT_PERP:
          contract_type: perpetual
          mark_price: '30505.48'
          index_price: '30503.94'
          funding_rate: '0.00025'
          open_interest: '3.93843'
          next_funding_time: '2024-06-26T20:32:01.636Z'
          indicative_funding_rate: '0.00025'
          premium_index: '0'
          avg_premium_index: '-0.000016478878555706'
          interest_rate: '0.001'
          timestamp: '2024-06-26T14:22:57.304Z'
    marketData_Error:
      type: object
      required:
        - timestamp
        - error
        - path
        - requestId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Request timestamp.
        error:
          type: object
          required:
            - description
            - code
            - message
          properties:
            description:
              type: string
              description: Error description.
            code:
              type: integer
              format: int
              description: Error code.
            message:
              type: string
              description: Error description.
        path:
          type: string
          description: Request path.
        requestId:
          type: string
          description: Request identifier.
    marketData_InstrumentNotFound:
      title: Instrument not found
      $ref: '#/components/schemas/marketData_Error'
      type: object
      description: Provided currency or symbol not found.
      example:
        timestamp: '2024-03-22T15:04:05.590Z'
        error:
          description: Try get /public/INSTRUMENT, to get list of all available INSTRUMENT.
          code: 2002
          message: 'No such INSTRUMENT: PARAMETER'
        path: /api/3/public/PATH
        requestId: 0cdf39b4-28499640
    marketData_Validation:
      $ref: '#/components/schemas/marketData_Error'
      type: object
      description: |
        Any of:
          * missing required parameter;
          * invalid value of a numeric parameter.
      example:
        timestamp: '2024-03-22T15:04:05.590Z'
        error:
          description: Validation error. Please, check request parameters and try again.
          code: 10001
          message: Bad request parameter [PARAMETER] ISSUE
        path: /api/3/public/PATH
        requestId: 0cdf39b4-28499640
    wallet_Result:
      title: Result
      type: object
      required:
        - result
      properties:
        result:
          type: boolean
    wallet_CurrencyCommon:
      title: Cryptocurrency
      type: string
      description: Cryptocurrency code.
      example: USDT
    wallet_FiatCurrencyCommon:
      title: Fiat currency
      type: string
      description: Fiat currency code.
      example: USD
    wallet_Currency:
      title: Currency
      properties:
        currency:
          $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_Network:
      title: Network
      type: object
      properties:
        network_code:
          $ref: '#/components/schemas/wallet_NetworkCommon'
    wallet_NetworkCommon:
      title: Network
      type: string
      description: Network code.
      example: ETH
    wallet_AmountCommon:
      title: Amount
      type: string
      description: |
        The amount of the operation.

        Format: currency precision

        Values: > 0

        ℹ️ Call `GET /public/currency/{currency}` to get the currency precision.
      example: '2.37'
    wallet_Amount:
      title: Amount
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/wallet_AmountCommon'
    wallet_PublicComment:
      title: Public comment
      type: object
      properties:
        public_comment:
          type: string
          maxLength: 255
          pattern: ^[\w@\-\.:<>]+( [\w@\-\.:<>]+)*$
          description: >
            Custom text comment for external use.


            ℹ️ The specified value will be displayed in the transaction history
            and may help in identification of the transaction.


            ℹ️ Avoid the following characters: `&`, `'`, `<`, `>`, `"`.
          example: Lorem ipsum dolor sit amet consectetur adipiscing elit...
    wallet_AddressCommon:
      title: Deposit address
      type: string
      pattern: >-
        ^([\w@\-.:<>]+|[0-9A-Z]{4}(
        ?[0-9A-Z]{4}){8}|(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?)$
      description: Deposit crypto address.
      example: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_Address:
      title: Deposit address
      type: object
      properties:
        address:
          $ref: '#/components/schemas/wallet_AddressCommon'
    wallet_PaymentID:
      title: Payment ID
      type: object
      properties:
        payment_id:
          type: string
          pattern: ^[\w@\-.:<>]+$
          description: >-
            An additional recipient identifier (for example, "Memo") required
            for specific currencies.
    wallet_Fee:
      title: Withdrawal fee
      type: object
      properties:
        fee:
          type: string
          description: |
            Fee amount.

            Format: currency precision
          example: '0'
    wallet_HashCommon:
      title: Transaction hash
      type: string
      nullable: true
      description: Transaction blockchain hash.
      example: |
        0xfb0ba568213d11230cd34d62fddd1cc1fe11fdc173l4f2007b0e47a06ad73d20
    wallet_Hash:
      title: Transaction hash
      type: object
      required:
        - tx_hash
      properties:
        tx_hash:
          $ref: '#/components/schemas/wallet_HashCommon'
    wallet_CreatedAt:
      title: Created at
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: Date and time of the creation.
          example: 2024-03-22 15:04:05Z07:00
    wallet_UpdatedAt:
      title: Updated at
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
          description: Date and time of the last update.
          example: 2024-03-22 15:04:05Z07:00
    wallet_DeletedAt:
      title: Deleted at
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          example: 2024-03-22 15:04:05Z07:00
          description: Date and time of the deletion.
    wallet_OperationID:
      title: Operation ID
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
          description: Operation UUID.
          example: 7388421c-06af-11ee-be56-0242ac120002
    wallet_IPAddressCommon:
      title: IP address
      oneOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
      description: >-
        IP address of the request sender provided by the client or detected
        automatically.
      example: 127.0.0.1
    wallet_ApiKey:
      title: API key
      type: object
      required:
        - api_key_first_six
        - key_name
        - exchange_read
        - exchange_trade
        - bank_read
        - bank_withdraw
        - is_active
        - created_at
        - updated_at
      properties:
        api_key_first_six:
          type: string
          description: |
            First 6 symbols of the public key.
          example: va5-9V
        key_name:
          type: string
          description: |
            Name of the key.
          example: User Key 1
        exchange_read:
          type: boolean
          description: |
            "Orderbook, History, Trading balance" API key access right.
        exchange_trade:
          type: boolean
          description: |
            "Place/cancel orders" API key access right.
        bank_read:
          type: boolean
          description: |
            "Payment information" API key access right.
        bank_withdraw:
          type: boolean
          description: |
            "Withdraw cryptocurrencies" API key access right.
        allowed_ips:
          type: array
          items:
            $ref: '#/components/schemas/wallet_IPAddressCommon'
          description: |
            A list of whitelisted IPs.
        is_active:
          type: boolean
          description: |
            Flag indicating the API key is active.
        created_at:
          type: string
          description: |
            The date and time the key was created.
          example: '2024-03-22T15:04:05'
        updated_at:
          type: string
          description: |
            The date and time the key was updated.
          example: '2024-03-22T15:04:05'
    wallet_Balance:
      title: Wallet balance
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - type: object
          required:
            - available
            - currency
            - reserved
          properties:
            available:
              type: string
              description: >-
                Amount available for withdrawals and transfers to the exchange
                account.
              example: '14.08'
            reserved:
              type: string
              description: >-
                Total amount reserved for withdrawals, withdrawal fees, and
                transfers to the exchange account.
              example: '2.37'
    wallet_DepositAddressBase:
      title: Deposit address
      allOf:
        - $ref: '#/components/schemas/wallet_Address'
        - $ref: '#/components/schemas/wallet_PaymentID'
        - type: object
          required:
            - currency
            - address
          properties:
            public_key:
              type: string
              description: Public key.
          example:
            address: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_DepositAddress:
      title: Deposit address
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - $ref: '#/components/schemas/wallet_DepositAddressBase'
        - example:
            currency: USDT
            network_code: ETH
            address: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_RecentDepositAddress:
      title: Deposit address
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - type: object
          properties:
            network_name:
              type: string
              description: Network full name.
          example:
            currency: USDT
            network_code: ETH
            network_name: Ethereum
            address: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_DepositAddressRequest:
      title: Deposit address request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - type: object
          required:
            - currency
    wallet_TransferEnum:
      title: Transfer types
      type: string
      enum:
        - wallet
    wallet_SpotTransferEnum:
      title: Transfer types
      type: string
      enum:
        - spot
    wallet_DerivativesTransferEnum:
      title: Derivatives transfer types
      type: string
      enum:
        - derivatives
    wallet_TransferRequest:
      title: Transfer request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - type: object
          required:
            - amount
            - currency
            - destination
            - source
          properties:
            source:
              allOf:
                - $ref: '#/components/schemas/wallet_DerivativesTransferEnum'
                - $ref: '#/components/schemas/wallet_SpotTransferEnum'
                - $ref: '#/components/schemas/wallet_TransferEnum'
                - description: Transfer source account type.
            destination:
              allOf:
                - $ref: '#/components/schemas/wallet_TransferEnum'
                - $ref: '#/components/schemas/wallet_SpotTransferEnum'
                - $ref: '#/components/schemas/wallet_DerivativesTransferEnum'
                - description: Transfer destination account type.
    wallet_WhitelistedAddress:
      title: Whitelisted address
      description: >
        A whitelist entry. `currency` and `network` are optional independently
        of each other, and at least one of them is always present:

          * both present—the entry covers that currency in that network only;
          * `currency` omitted—the entry covers every currency of its network;
          * `network` omitted—the entry is not bound to a network.

        `payment_id` is present only for the currencies that require an
        additional recipient identifier.
      allOf:
        - $ref: '#/components/schemas/wallet_Address'
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_PaymentID'
        - required:
            - name
            - address
        - properties:
            name:
              type: string
              description: |
                Name of the whitelist item.
              example: ETH withdrawal
            network:
              $ref: '#/components/schemas/wallet_NetworkCommon'
    wallet_TransactionID:
      title: Transaction ID
      type: string
      format: uuid
      description: Transaction UUID.
      example: 27fa7f14-ca49-42fd-834a-4ce630d069d2
    wallet_SingleTransfer:
      title: Wallet ↔ Exchange
      type: array
      items:
        $ref: '#/components/schemas/wallet_TransactionID'
      minItems: 1
      maxItems: 1
      description: Transfer between a wallet and an exchange account.
      example:
        - 27fa7f14-ca49-42fd-834a-4ce630d069d2
    wallet_DoubleTransfer:
      title: Exchange ↔ Exchange
      type: array
      items:
        $ref: '#/components/schemas/wallet_TransactionID'
      minItems: 2
      maxItems: 2
      description: |
        Operation made by 2 transactions: via an intermediate account.
      example:
        - b79ecc5d-0081-47e9-bdc0-69a7e941e7c6
        - 7a04e62c-563c-4797-8eeb-ea8e3fa354d3
    wallet_ConvertConfig:
      title: Conversion config
      type: object
      required:
        - currencyFrom
        - currencyTo
        - customTypeTo
        - customTypeFrom
        - comment
      properties:
        currencyFrom:
          $ref: '#/components/schemas/wallet_CurrencyCommon'
          description: Source currency code.
        currencyTo:
          type: string
          description: Target currency code.
          example: USDT20
        customTypeTo:
          type: string
          enum:
            - conversion_output
          description: Transfer custom type for source.
        customTypeFrom:
          type: string
          enum:
            - conversion_input
          description: Transfer custom type for target.
        comment:
          type: string
          description: Text description of conversion source and target currencies.
          example: USDT to USDT20
    wallet_ConvertRequest:
      title: Conversion request
      allOf:
        - $ref: '#/components/schemas/wallet_Amount'
        - type: object
          required:
            - amount
            - from_currency
            - to_currency
          properties:
            from_currency:
              $ref: '#/components/schemas/wallet_CurrencyCommon'
              description: Source currency code.
            to_currency:
              type: string
              description: Target currency code.
              example: USDT20
    wallet_InternalWithdrawalRequestByEnum:
      title: Withdrawal targets
      type: string
      enum:
        - email
        - username
        - external_id
    wallet_InternalWithdrawalRequestBase:
      title: Withdrawal request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - $ref: '#/components/schemas/wallet_PublicComment'
        - type: object
          required:
            - currency
            - by
            - amount
          properties:
            by:
              allOf:
                - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestByEnum'
              description: Type of the target user identifier.
    wallet_InternalWithdrawalRequestEmail:
      title: Email
      allOf:
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
        - type: object
          required:
            - identifier
          properties:
            identifier:
              type: string
              format: email
              description: Target user email.
              example: johndoe@example.com
    wallet_InternalWithdrawalRequestUsername:
      title: Username
      allOf:
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
        - type: object
          required:
            - identifier
          properties:
            identifier:
              type: string
              minLength: 3
              maxLength: 16
              pattern: ^[a-zA-Z0-9@_+.-]+$
              description: Target user username.
              example: john.doe
    wallet_InternalWithdrawalRequestExternalID:
      title: External ID
      allOf:
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
        - type: object
          required:
            - identifier
          properties:
            identifier:
              type: string
              description: Target user external identifier.
              example: C1408A
    wallet_InternalWithdrawalRequestWalletID:
      title: Wallet ID
      allOf:
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
        - type: object
          required:
            - identifier
          properties:
            identifier:
              type: string
              minLength: 5
              maxLength: 60
              pattern: ^[a-z0-9].$
              description: Target user wallet ID (without a domain).
              example: johndoe
    wallet_InternalWithdrawalRequest:
      allOf:
        - type: object
        - title: Internal withdrawal request
          discriminator:
            propertyName: by
            mapping:
              email: '#/components/schemas/wallet_InternalWithdrawalRequestEmail'
              username: '#/components/schemas/wallet_InternalWithdrawalRequestUsername'
              external_id: '#/components/schemas/wallet_InternalWithdrawalRequestExternalID'
              wallet_id: '#/components/schemas/wallet_InternalWithdrawalRequestWalletID'
          oneOf:
            - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestEmail'
            - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestUsername'
            - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestExternalID'
            - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestWalletID'
    wallet_WithdrawalRequest:
      title: Withdrawal request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - $ref: '#/components/schemas/wallet_PublicComment'
        - $ref: '#/components/schemas/wallet_Address'
        - type: object
          required:
            - currency
            - amount
            - address
          properties:
            network_code:
              type: string
              description: |
                Network code.

                Conditions: if omitted, the currency default network will be
                used
              example: ETH
            payment_id:
              type: string
              pattern: ^[\w@\-.:<>]+$
              description: >
                An additional recipient identifier (for example, "Memo")
                required for specific currencies.


                ℹ️ Call `GET /public/currency/{currency}` and check
                `payout_is_payment_id` value to determine if a payment ID is
                needed.
              example: ''
            include_fee:
              type: boolean
              nullable: true
              default: false
              description: >
                Flag indicating whether fees will be included in the final
                amount of the resulting transaction.


                Values:
                  * `true`—fees will reduce the amount sent to the receiver. The amount written-off from the sender will be exactly equal to `amount`;
                  * `false`—fees will increase the amount written-off from the sender. The amount sent to the receiver will be exactly equal to `amount`.

                ⚠️ If set to `true`, make sure that the amount exceeds fees.


                ℹ️ Call `GET /wallet/crypto/fee/estimate` to get an estimated
                fee amount before creating a transaction.
            auto_commit:
              type: boolean
              nullable: true
              default: false
              description: >
                Flag indicating whether the sender should commit the transaction
                within 1 hour after it is created—the transaction will be rolled
                back otherwise.


                Values:
                  * `true`—one-phase scheme, the transaction will be committed automatically shortly after its creation;
                  * `false`—two-phase scheme, the transaction must be committed or rolled back.
            use_offchain:
              type: string
              enum:
                - never
                - optionally
                - required
              default: never
              description: >
                The instruction specifying whether it is allowed, needed, or
                forbidden to process the transaction off chain.


                Values:
                  * `never`—a transaction must be committed to the blockchain;
                  * `optionally`—the resulting transaction will be processed off chain if it is a viable option for the given address and the current configuration state;
                  * `required`—the request will be rejected if a withdrawal cannot be processed off chain.

                ℹ️ Call `GET /wallet/crypto/check-offchain-available` to check
                if the given operation may be processed off chain.
            wallet_id:
              type: string
              pattern: ^*\..*$
              description: Wallet ID in an external network.
              example: johndoe.dba.id
          example:
            currency: USDT
            amount: 2.37
            public_comment: Lorem ipsum dolor sit amet consectetur adipiscing elit...
            address: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
            network_code: ETH
    wallet_OffChainRequest:
      title: Off-chain request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_PaymentID'
        - $ref: '#/components/schemas/wallet_Address'
        - type: object
          required:
            - currency
            - address
    wallet_FeesEstimateRequest:
      title: Fee estimate request
      type: array
      items:
        allOf:
          - $ref: '#/components/schemas/wallet_Amount'
          - $ref: '#/components/schemas/wallet_Currency'
          - $ref: '#/components/schemas/wallet_Network'
          - type: object
            required:
              - amount
              - currency
    wallet_EstimatedFee:
      title: Estimated fee
      type: array
      items:
        allOf:
          - $ref: '#/components/schemas/wallet_Fee'
          - $ref: '#/components/schemas/wallet_Amount'
          - $ref: '#/components/schemas/wallet_Currency'
          - type: object
            required:
              - fee
              - networkFee
              - amount
              - currency
            properties:
              networkFee:
                type: string
                description: Network fee.
              networkCode:
                $ref: '#/components/schemas/wallet_NetworkCommon'
            example:
              fee: '0.02'
              networkFee: '0'
              networkCode: ETH
    wallet_EstimatedFeeBulk:
      title: Estimated fee
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - $ref: '#/components/schemas/wallet_Amount'
        - $ref: '#/components/schemas/wallet_Fee'
        - required:
            - currency
            - amount
            - fee
    wallet_reqBulkEstimateFeeByLabel:
      title: Bulk estimate fee by label
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - $ref: '#/components/schemas/wallet_Amount'
        - required:
            - currency
            - amount
    wallet_schFees:
      title: Fees
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - properties:
            levels:
              type: array
              items:
                $ref: '#/components/schemas/wallet_schLevels'
    wallet_ptyHash-Fees:
      title: Hash
      properties:
        hash:
          type: string
          description: |
            Fee hash.
          example: '3982183395978'
    wallet_ptyDefaultLevelId:
      title: Default level ID
      type: object
      properties:
        default_level_id:
          $ref: '#/components/schemas/wallet_FeeLevelIDCommon'
          description: |
            Default fee level.
    wallet_ptyFees:
      title: Fees
      type: object
      properties:
        fees:
          type: array
          items:
            $ref: '#/components/schemas/wallet_schFees'
    wallet_resGetFeeList:
      title: Get fee list response
      allOf:
        - $ref: '#/components/schemas/wallet_ptyHash-Fees'
        - $ref: '#/components/schemas/wallet_ptyDefaultLevelId'
        - $ref: '#/components/schemas/wallet_ptyFees'
        - required:
            - hash
            - default_level_id
            - fees
    wallet_resGetFeeHash:
      title: Get fee hash response
      allOf:
        - $ref: '#/components/schemas/wallet_ptyHash-Fees'
        - required:
            - hash
    wallet_TransactionStatuses:
      title: Transaction statuses
      type: string
      enum:
        - CREATED
        - PENDING
        - FAILED
        - SUCCESS
        - ROLLED_BACK
      description: |
        Transaction status.

        Values:
          * `CREATED`—the transaction has been created and needs to be approved. For withdrawals, the status means that the transaction has been created but not committed. It remains in this status until manually validated or moved to a blockchain;
          * `PENDING`—the transaction has been created and is queued until the fees are paid, and it can be processed further. Also, for withdrawals and deposits, the status means that blockchain confirmations have not yet been gathered;
          * `FAILED`—the transaction could not be committed;
          * `ROLLED_BACK`—the transaction has been canceled;
          * `SUCCESS`—the transaction has been approved and fully processed.
    wallet_TransactionTypes:
      title: Transaction types
      allOf:
        - $ref: '#/components/schemas/wallet_OTCTransactionTypes'
        - $ref: '#/components/schemas/wallet_TransactionTypesBase'
        - description: Transaction type.
    wallet_TransactionTypesBase:
      title: Native transaction types
      type: string
      enum:
        - DEPOSIT
        - WITHDRAW
        - TRANSFER
    wallet_OTCTransactionTypes:
      title: OTC transaction types
      type: string
      enum:
        - OTC
    wallet_TransactionSubtypes:
      title: Transaction subtypes
      allOf:
        - $ref: '#/components/schemas/wallet_TransactionSubtypesBase'
        - $ref: '#/components/schemas/wallet_FuturesTransactionSubtypes'
        - $ref: '#/components/schemas/wallet_AirdropTransactionSubtypes'
        - $ref: '#/components/schemas/wallet_SubaccountsTransactionSubtypes'
        - description: Transaction subtype.
    wallet_TransactionSubtypesBase:
      title: Native transaction subtypes
      type: string
      enum:
        - UNCLASSIFIED
        - BLOCKCHAIN
        - OFFCHAIN
        - FIAT
        - WALLET_TO_SPOT
        - SPOT_TO_WALLET
        - CHAIN_SWITCH_FROM
        - CHAIN_SWITCH_TO
    wallet_FuturesTransactionSubtypes:
      title: Derivatives transaction subtypes
      type: string
      enum:
        - WALLET_TO_DERIVATIVES
        - DERIVATIVES_TO_WALLET
    wallet_SubaccountsTransactionSubtypes:
      title: Subaccounts transaction subtypes
      type: string
      enum:
        - SUB_ACCOUNT
    wallet_AirdropTransactionSubtypes:
      title: Airdrop transaction subtypes
      type: string
      enum:
        - AIRDROP
    wallet_SwapOperationType:
      title: Swap operation types
      type: string
      enum:
        - SWAP
    wallet_OTCOperationType:
      title: OTC operation types
      type: string
      enum:
        - OTC
    wallet_TransactionBase:
      title: Transaction
      allOf:
        - type: object
          required:
            - id
            - type
            - status
            - created_at
            - updated_at
            - last_activity_at
          properties:
            id:
              type: integer
              format: int64
              description: Transaction identifier.
              example: 221163
            created_at:
              type: string
              format: date-time
              description: Date and time of the creation.
              example: 2024-03-22 15:04:05Z07:00
            updated_at:
              type: string
              format: date-time
              description: |
                Transaction updated.
              example: 2024-03-22 15:04:05Z07:00
            last_activity_at:
              type: string
              format: date-time
              description: |
                Transaction info updated.

                ⚠️ `last_activity_at` indicates the timestamp of a history
                 record, whereas `updated_at` is the time of the latest actual
                 change of transaction info. So `updated_at` may precede
                 `last_activity_at` but never updates prior to entire record.
              example: 2024-03-22 15:04:05Z07:00
            status:
              $ref: '#/components/schemas/wallet_TransactionStatuses'
            type:
              $ref: '#/components/schemas/wallet_TransactionTypes'
            subtype:
              $ref: '#/components/schemas/wallet_TransactionSubtypes'
            operation_id:
              type: string
              format: uuid
              description: UUID of the operation embracing the transaction.
              example: 99e78bf4-a708-43a3-ab18-e8e7618cd891
    wallet_NativeBase:
      title: Native
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Network'
        - type: object
          required:
            - tx_id
            - index
            - currency
            - amount
          properties:
            amount:
              type: string
              description: Transaction amount.
              example: '2.37'
            tx_id:
              $ref: '#/components/schemas/wallet_TransactionID'
            index:
              type: integer
              format: uint64
              description: Last update sequence number.
              example: 1408237221
            protocol_code:
              type: string
              description: The protocol or the standard powering the network.
              example: ETH
    wallet_AttemptHashes:
      title: Attempt hashes
      type: string
      description: |
        Hash of the attempt to send a transaction to the blockchain.
      example: 0xfb0ba568213d11230cd34d62fddd1cc1fe11fdc173l4f2007b0e47a06ad73d20
    wallet_NativeWithdrawalFields:
      title: Native withdrawal
      allOf:
        - $ref: '#/components/schemas/wallet_Fee'
        - $ref: '#/components/schemas/wallet_PublicComment'
        - $ref: '#/components/schemas/wallet_PaymentID'
        - type: object
          required:
            - fee
          properties:
            wallet_id:
              type: string
              pattern: ^*\..*$
              description: Wallet ID.
              example: johndoe.dba.id
            offchain_id:
              type: string
              nullable: true
              description: Identifier of an off-chain withdrawal.
            error_code:
              type: string
              nullable: true
              enum:
                - INVALID_ADDRESS
                - INVALID_PAYMENT_ID
                - BAD_PRECISION
              description: Withdrawal rejection reason.
            attempt_hashes:
              type: array
              items:
                $ref: '#/components/schemas/wallet_AttemptHashes'
    wallet_NativeBlockchainFields:
      title: Native blockchain
      allOf:
        - $ref: '#/components/schemas/wallet_Address'
        - type: object
          required:
            - hash
            - confirmations
          properties:
            hash:
              $ref: '#/components/schemas/wallet_HashCommon'
            confirmations:
              type: integer
              format: uint64
              minimum: 1
              nullable: true
              description: Current count of transaction confirmations.
              example: 2
            senders:
              type: array
              items:
                $ref: '#/components/schemas/wallet_AddressCommon'
              description: Crypto addresses of the transaction senders.
    wallet_CommitRisk:
      title: Commit risk
      type: object
      required:
        - score
        - rbf
        - low_fee
      properties:
        score:
          type: integer
          format: uint64
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Risk score that decreases non-linearly when the transaction gains
            confirmations.


            ℹ️ Scores from 0 to 50 imply the transaction may be considered
            committed (but it is not guaranteed) or it may take at least half an
            hour otherwise.
        rbf:
          type: boolean
          nullable: true
          description: >
            Flag indicating whether the transaction did not gain a sufficient
            number of confirmations and may be replaced by another one for
            different fees.


            ⚠️ This value indicates the transaction is complete and do not
            affect the score.


            ℹ️ `false` value along with a score above 50 gives a good chance
            that the transaction is irreversible.
        low_fee:
          type: boolean
          nullable: true
          description: >
            Flag indicating whether the actual network fee is lower than the
            estimated one.


            ⚠️ This value indicates the difference between the estimated fee and
            the actual paid fee and does not affect the score.
    wallet_Deposit:
      title: Deposit
      allOf:
        - $ref: '#/components/schemas/wallet_TransactionBase'
        - type: object
          required:
            - native
          properties:
            native:
              allOf:
                - $ref: '#/components/schemas/wallet_NativeBase'
                - $ref: '#/components/schemas/wallet_NativeBlockchainFields'
        - type: object
          properties:
            commit_risk:
              $ref: '#/components/schemas/wallet_CommitRisk'
    wallet_Withdrawal:
      title: Withdrawal
      allOf:
        - $ref: '#/components/schemas/wallet_TransactionBase'
        - type: object
          required:
            - native
          properties:
            native:
              allOf:
                - $ref: '#/components/schemas/wallet_NativeBase'
                - $ref: '#/components/schemas/wallet_NativeWithdrawalFields'
                - $ref: '#/components/schemas/wallet_NativeBlockchainFields'
    wallet_Transfer:
      title: Transfer
      allOf:
        - $ref: '#/components/schemas/wallet_TransactionBase'
        - type: object
          required:
            - native
          properties:
            native:
              $ref: '#/components/schemas/wallet_NativeBase'
    wallet_Transaction:
      allOf:
        - type: object
        - title: Transaction
          discriminator:
            propertyName: type
            mapping:
              DEPOSIT: '#/components/schemas/wallet_Deposit'
              WITHDRAW: '#/components/schemas/wallet_Withdrawal'
              TRANSFER: '#/components/schemas/wallet_Transfer'
          oneOf:
            - $ref: '#/components/schemas/wallet_Deposit'
            - $ref: '#/components/schemas/wallet_Withdrawal'
            - $ref: '#/components/schemas/wallet_Transfer'
    wallet_SubaccountIdCommon:
      title: Subaccount ID
      type: string
      description: Subaccount external identifier.
      example: A1408C
    wallet_SubaccountID:
      title: Subaccount ID
      type: object
      properties:
        sub_account_id:
          type: string
          description: Subaccount external identifier.
          example: A1408C
    wallet_Subaccount:
      title: Subaccount
      type: object
      required:
        - email
        - sub_account_id
        - status
      properties:
        sub_account_id:
          type: string
          description: Subaccount external identifier.
          example: A1408C
        email:
          type: string
          format: email
          description: User email address.
          example: johndoe@example.com
        status:
          type: string
          enum:
            - new
            - active
            - disable
          description: |
            Account status.

            Values:
              * `new`—account is created, but not confirmed by email;
              * `active`—account is fully functioning (it is normally accomplished after email confirmation);
              * `disable`—account is disabled (the user cannot initiate account deactivation — it can only be done by the CRM operator).
    wallet_SubaccountCreateRequest:
      title: Subaccount create request
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Email address of the subaccount, it is also its login.


            The address is unique within the broker and cannot be the same as
            the address of the super account.
          example: sub.account@example.com
        password:
          type: string
          description: >
            Password of the subaccount, set by the super account.


            At least 6 non-whitespaced characters and at most 255 characters in
            total, including a number and a non-numeric letter or symbol.
          example: Str0ngPassw0rd
    wallet_SubaccountCreated:
      title: Subaccount created
      description: >
        The result of the subaccount creation. Every field is known at the
        creation time, therefore all of them are always present.
      required:
        - sub_account_id
        - email
        - status
        - sub_account_status
        - created_at
      type: object
      properties:
        sub_account_id:
          type: string
          description: Subaccount external identifier.
          example: 6358A25B
        email:
          type: string
          format: email
          description: User email address.
          example: sub.account@example.com
        status:
          type: string
          enum:
            - new
            - active
            - disable
          description: |
            Account status. After the creation it is always `"new"`.

            Values:
              * `new`—account is created, but not confirmed by email;
              * `active`—account is fully functioning (it is normally accomplished after email confirmation);
              * `disable`—account is disabled (the user cannot initiate account deactivation — it can only be done by the CRM operator).
          example: new
        sub_account_status:
          type: string
          enum:
            - invited
            - active
            - frozen
            - frozen_invited
          description: >
            The lifecycle status of the subaccount itself, not of its holder.
            After the creation it is always `"invited"`.


            Values:
              * `invited`—the subaccount is created, the invitation has not been accepted yet;
              * `active`—the subaccount is active, the transition happens on its first sign-in;
              * `frozen`—the subaccount is frozen by the super account;
              * `frozen_invited`—the subaccount is frozen before the invitation was accepted.
          example: invited
        created_at:
          type: string
          description: Date and time of the creation.
          example: '2026-08-18T12:00:00Z'
    wallet_SubaccountsIds:
      title: Subaccount IDs
      type: object
      required:
        - sub_account_ids
      properties:
        sub_account_ids:
          type: array
          items:
            $ref: '#/components/schemas/wallet_SubaccountIdCommon'
          description: A list of subaccounts external identifiers.
    wallet_SubaccountTransferRequest:
      title: Subaccount transfer request
      allOf:
        - $ref: '#/components/schemas/wallet_SubaccountID'
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - type: object
          required:
            - sub_account_id
            - currency
            - amount
            - type
          properties:
            type:
              type: string
              enum:
                - to_sub_account
                - from_sub_account
              description: >
                Transfer type.


                Values:
                  * `to_sub_account`—from the user wallet to a subaccount wallet;
                  * `from_sub_account`—from a subaccount wallet to the user wallet.

                ⚠️ Only a subaccount with `active` status may receive funds from
                the user (super account).
    wallet_SubToSubTransferRequest:
      title: Subaccount to subaccount transfer request
      allOf:
        - $ref: '#/components/schemas/wallet_SubaccountID'
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - required:
            - sub_account_id
            - currency
            - amount
    wallet_SubToSuperTransferRequest:
      title: Subaccount to super account transfer request
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - required:
            - currency
            - amount
    wallet_SubaccountACLBase:
      title: Subaccount ACL
      type: object
      required:
        - sub_account_id
        - deposit_address_generation_enabled
        - withdraw_enabled
      properties:
        deposit_address_generation_enabled:
          type: boolean
          description: Flag indicating whether deposits are enabled.
        withdraw_enabled:
          type: boolean
          description: Flag indicating whether withdrawals are enabled.
        description:
          type: string
          description: Text description.
    wallet_SubaccountACL:
      title: Subaccount ACL
      allOf:
        - $ref: '#/components/schemas/wallet_SubaccountID'
        - $ref: '#/components/schemas/wallet_SubaccountACLBase'
        - $ref: '#/components/schemas/wallet_CreatedAt'
        - $ref: '#/components/schemas/wallet_UpdatedAt'
    wallet_SubaccountACLRequest:
      title: Subaccount ACL request
      allOf:
        - $ref: '#/components/schemas/wallet_SubaccountsIds'
        - $ref: '#/components/schemas/wallet_SubaccountACLBase'
    wallet_ExchangeBalance:
      title: Exchange balance
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_SpotBalance'
        - $ref: '#/components/schemas/wallet_MarginBalanceFields'
    wallet_SpotBalance:
      title: Spot balance
      required:
        - available
        - reserved
      type: object
      properties:
        available:
          type: string
          description: Amount available for trading or transferring to a wallet.
          example: '2.27'
        reserved:
          type: string
          description: >-
            Total amount reserved for active orders and incomplete transfers to
            a wallet.
          example: '0.237'
    wallet_MarginBalanceFields:
      title: Margin balance
      required:
        - reserved_margin
      type: object
      properties:
        reserved_margin:
          type: string
          description: Amount reserved for margin trading.
          example: '0'
    wallet_SubaccountBalance:
      title: Subaccount balance
      allOf:
        - type: object
          required:
            - wallet
          properties:
            wallet:
              $ref: '#/components/schemas/wallet_Balance'
        - type: object
          required:
            - spot
          properties:
            spot:
              $ref: '#/components/schemas/wallet_ExchangeBalance'
        - type: object
          required:
            - derivatives
          properties:
            derivatives:
              $ref: '#/components/schemas/wallet_ExchangeBalance'
    wallet_AirdropStatuses:
      title: Airdrop status
      type: string
      enum:
        - available
        - claimed
        - pending
        - committed
      description: |
        Airdrop status.

        Values:
          * `available`—the user can claim an airdrop;
          * `claimed`—an airdrop request is confirmed;
          * `pending`—the user claimed airdrop. An airdrop request was sent;
          * `committed`—an airdrop transaction was successfully committed.
    wallet_Airdrop:
      title: Airdrop
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_Amount'
        - $ref: '#/components/schemas/wallet_CreatedAt'
        - $ref: '#/components/schemas/wallet_UpdatedAt'
        - type: object
          required:
            - id
            - created_at
            - updated_at
            - currency
            - base_currency
            - description
            - start_time
            - end_time
            - amount
            - status
          properties:
            id:
              type: integer
              format: uint64
              description: Airdrop identifier.
              example: 221163
            base_currency:
              type: string
              description: Base currency for dropped currency amount calculation.
              example: BTC
            description:
              type: string
              description: Text description.
              example: Lorem ipsum dolor sit amet consectetur adipiscing elit...
            start_time:
              type: string
              format: date-time
              description: The beginning of the period when the user can claim the airdrop.
              example: 2024-03-22 15:04:05Z07:00
            end_time:
              type: string
              format: date-time
              description: The end of the period when the user can claim the airdrop.
              example: 2024-03-22 15:04:05Z07:00
            status:
              $ref: '#/components/schemas/wallet_AirdropStatuses'
            transaction_id:
              $ref: '#/components/schemas/wallet_TransactionID'
    wallet_IdempotencyKey:
      title: Idempotency key
      type: object
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: |
            Idempotency key.

            ⚠️ Expires after 48 hours.
          example: 232e855b-cc72-4204-85c1-c9b6e3bb7e8b
    wallet_AmountLock:
      title: Amount lock
      allOf:
        - $ref: '#/components/schemas/wallet_Currency'
        - $ref: '#/components/schemas/wallet_CreatedAt'
        - type: object
          required:
            - id
            - currency
            - amount
            - date_end
            - description
            - canceled
            - canceled_at
            - cancel_description
            - created_at
          properties:
            id:
              type: integer
              format: uint64
              description: Amount lock identifier.
              example: 1
            amount:
              type: string
              description: Locked amount in USD.
              example: '2.37'
            date_end:
              type: string
              description: The date and time of the lock expiration.
              example: ''
            description:
              type: string
              description: Text description.
              example: Lorem ipsum dolor sit amet consectetur adipiscing elit...
            canceled:
              type: boolean
              description: Flag indicating whether the amount lock was canceled.
              example: false
            canceled_at:
              type: string
              nullable: true
              format: date-time
              description: Date and time of the lock cancellation.
              example: null
            cancel_description:
              type: string
              nullable: true
              description: Text description on cancellation.
              example: null
    wallet_PrimeTrustMethod:
      allOf:
        - type: object
    wallet_Error:
      title: Error
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              format: int
              description: Custom error code.
            message:
              type: string
              description: Error message.
            description:
              type: string
              description: Error description.
    wallet_NotFound:
      title: Not Found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * a subaccount is not found;
          * the user is not a super account.
      example:
        error:
          code: 404
          message: Not Found
    wallet_RequestTimeout:
      title: Request Timeout
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: The request has been canceled.
      example:
        error:
          code: 408
          message: Request timeout
    wallet_TooManyRequests:
      title: Too Many Requests
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Rate limits are exceeded.
      example:
        error:
          code: 429
          message: Too many requests
    wallet_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Internal error.

        Any of:
          * unclassified internal error;
          * user bank account is blocked;
          * transaction(s) for the requested operation have not been created;
          * transaction(s) for the requested operation have been rolled back.
      example:
        error:
          code: 500
          message: Internal Server Error
    wallet_AmountLocked:
      title: Amount locked
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Funds needed for execution of the operation are locked.
      example:
        error:
          code: 500
          message: Internal Server Error
    wallet_BadGateway:
      title: Bad Gateway
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Unclassified error while connecting the authentication service.
      example:
        error:
          code: 502
          message: Bad gateway
    wallet_ServiceUnavailable:
      title: Service Unavailable
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * withdrawals are disabled;
          * unclassified internal error.
      example:
        error:
          code: 503
          message: Service unavailable
    wallet_NotAllowed:
      title: Not allowed
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Operations on the requested currency are not allowed.

        Any of:
          * currency is disabled;
          * operations of the given type are disabled for the currency;
          * operations on the needed account types are disabled for the currency;
          * conversion is not allowed for the provided currencies.
      example:
        error:
          code: 600
          message: Action not allowed
    wallet_PayoutBlacklisted:
      title: Payouts blacklisted
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: User is in the blacklist and can no longer make withdrawals.
      example:
        error:
          code: 602
          message: Payout blacklisted
    wallet_PayoutAmountLocked:
      title: Payout amount locked
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Operation amount in total with locked amount exceeds available balance.
      example:
        error:
          code: 604
          message: Payout amount bigger than locked amount
    wallet_ResourceNotFound:
      title: Resource not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Resource not found due to an internal error.
      example:
        error:
          code: 800
          message: Resource Not Found
    wallet_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * invalid API key;
          * user is not allowed to perform the requested operation.
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    wallet_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * invalid API key;
          * invalid time window value;
          * invalid HMAC signature format.
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    wallet_Forbidden:
      title: Forbidden
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * currency settings forbid the requested operation;
          * the user has insufficient permissions for the operation;
          * requested operation is forbidden for the user;
          * insufficient API key permissions;
          * provided IP address is not in the white list;
          * the user is not eligible for the given currency by the configuration;
          * provided operation parameters are forbidden by the configuration;
          * a withdrawal operation failed to pass pre-AML checks.
      example:
        error:
          code: 1003
          message: Action is forbidden for this API key
    wallet_BadFormat:
      title: Bad Format
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Provided parameters do not meet any supported authentication scheme.
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    wallet_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * missing required parameters;
          * the maximum of the time window is exceeded.
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    wallet_AuthInvalid:
      title: Invalid authorization
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Invalid JWT.
      example:
        error:
          code: 1005
          message: Invalid authorization
    wallet_ShouldUpgradePermission:
      title: Should upgrade permission
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1006
          message: Action unavailable, please upgrade scopes
    wallet_NotEnoughPermissions:
      title: Not enough permissions
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1007
          message: Not enough permissions
    wallet_CurrencyNotFound:
      title: Currency not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Currency is not found.

        Any of:
          * requested network is not found;
          * requested currency is not found;
          * no currency provided while the network is specified;
          * requested network is disabled;
          * operations relating to the request are disabled for the currency;
          * currencies featured in an operation are not found.
      example:
        error:
          code: 2002
          message: Currency not found
    wallet_Validation:
      title: Validation
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * invalid JSON payload;
          * invalid form payload;
          * invalid payload format;
          * invalid parameter value;
          * invalid parameter format;
          * specified parameters are mutually exclusive;
          * a required parameter is missing;
          * the value of a parameter is invalid;
          * provided value is not unique;
          * in an update request, no parameters provided.
      example:
        error:
          code: 10001
          message: Validation error
    wallet_LowAmount:
      title: Low amount
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Operation amount is too low.

        Any of:
          * provided amount is lesser than the currency precision (bit depth);
          * fees are included in the final amount, and the amount is lesser than fees.
      example:
        error:
          code: 10001
          message: Validation error
          description: Amount too low
    wallet_OTCHighVolatility:
      title: High volatility
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: OTC trade will be unlikely executed due to high market volatility.
      example:
        error:
          code: 10001
          message: Validation error
          description: Exchange high volatility
    wallet_UserDisabled:
      title: User disabled
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >-
        A subaccount has not confirmed the registration or is disabled which is
        required for execution of the operation.
      example:
        error:
          code: 10021
          message: User disabled
    wallet_InsufficientFunds:
      title: Insufficient funds
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Available balance is insufficient for execution of the operation.
      example:
        error:
          code: 20001
          message: Insufficient funds
          description: Check that the funds are sufficient, given commissions
    wallet_TransactionNotFound:
      title: Transaction not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * a transaction has failed to create;
          * the requested transaction is not found.
      example:
        error:
          code: 20004
          message: Transaction not found
          description: ''
    wallet_PayoutNotFound:
      title: Payout not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: The requested withdrawal is not found.
      example:
        error:
          code: 20005
          message: Payout not found
    wallet_PayoutCommitted:
      title: Payout committed
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >-
        Transaction associated with the operation was complete before being
        committed or rolled back.
      example:
        error:
          code: 20006
          message: Payout already committed
    wallet_PayoutInvalidAddress:
      title: Invalid payout address
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Receiver deposit address has an invalid format.
      example:
        error:
          code: 20011
          message: Payout address is invalid
    wallet_PayoutInvalidPaymentID:
      title: Invalid payment ID
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * an internal transfer recipient did not complete the registration;
          * recipient payment identifier is of an invalid format.
      example:
        error:
          code: 20012
          message: Payout payment address is invalid
    wallet_PayoutOffchainUnavailable:
      title: Offchain unavailable
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        The internal transfer is directed to the sender of the request.

        Any of:
          * off-chain operations are disabled;
          * the receiver is not a valid target for an off-chain operation.
      example:
        error:
          code: 20014
          message: Payout offchain unavailable
    wallet_PayoutDisabled:
      title: Offchain unavailable
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Withdrawals are unavailable due to the current configuration.

        Any of:
          * internal withdrawals are disabled;
          * in-chain withdrawals are disabled.
      example:
        error:
          code: 20018
          message: Payout disabled
    wallet_SubAccountNotFound:
      title: Subaccount not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: |
        Any of:
          * a subaccount does not exist;
          * a subaccount does not belong to the super account.
      example:
        error:
          code: 21001
          message: Subaccount not found
    wallet_SubAccountAlreadyFrozenOrDisabled:
      title: Subaccount already frozen or disabled
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >-
        A subaccount has already been frozen or disabled regardless of super
        account actions.
      example:
        error:
          code: 21003
          message: Subaccount already frozen
    wallet_SubAccountEmailExists:
      title: Subaccount email already registered
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >
        The email address provided for a subaccount is already registered within
        the broker, the address of the super account included.


        Relates to the `email` field of the request.
      example:
        error:
          code: 21005
          message: Email already registered
    wallet_SubAccountWeakPassword:
      title: Subaccount password does not meet requirements
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >
        The password provided for a subaccount does not meet the requirements:
        at least 6 non-whitespaced characters and at most 255 characters in
        total, including a number and a non-numeric letter or symbol.


        Relates to the `password` field of the request.
      example:
        error:
          code: 21006
          message: Password does not meet requirements
    wallet_SubAccountCallerNotSuper:
      title: Caller is not a super account
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: A subaccount cannot create subaccounts of its own.
      example:
        error:
          code: 21007
          message: User is not a super account
    wallet_SubAccountTwoFactorRequired:
      title: Two-factor authentication is required
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: The super account has no two-factor authentication enabled.
      example:
        error:
          code: 21008
          message: Two-factor authentication is required
    wallet_SubAccountEmailNotConfirmed:
      title: Subaccount has not confirmed its email
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: >
        At least one subaccount of the request has not confirmed its email
        address yet, therefore the whole request is rejected.


        The `description` field of the error lists the external identifiers of
        the subaccounts to drop from the request.
      example:
        error:
          code: 21009
          message: Sub-account has not confirmed its email
          description: 'The subaccounts have not confirmed their email: 5RTGF43K, 8HJKL21M'
    wallet_SubAccountCreationDisabled:
      title: Subaccount creation is disabled
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Creation of subaccounts is switched off for the broker.
      example:
        error:
          code: 21010
          message: Sub-account creation is disabled for the broker
    wallet_VerificationLevelTooLow:
      title: Verification level is too low
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: The verification level of the user is insufficient for the operation.
      example:
        error:
          code: 22011
          message: Verification level is too low
    wallet_UserNotFound:
      title: User not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: User not found.
      example:
        error:
          code: 22004
          message: User not found
    wallet_GatewayTimeout:
      title: Gateway Timeout
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Gateway timeout.
      example:
        error:
          code: 22008
          message: Gateway timeout. Please, try again later.
    wallet_VerificationRequired:
      title: Verification required
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Verification level is insufficient for the given operation.
      example:
        error:
          code: 20090
          message: KYC required
    trading_CurrencyCommon:
      title: Currency
      type: string
      description: Currency code.
      example: USDT
    trading_SymbolCommon:
      title: Symbol
      type: string
      description: Symbol code.
    trading_MarginModeCommon:
      title: Margin mode
      type: string
      enum:
        - cross
        - Cross
        - isolated
        - Isolated
      description: Margin mode.
    trading_StrictValidateCommon:
      title: Strict validate
      type: boolean
      default: false
      description: >-
        Price and quantity will be checked for incrementation within the symbol
        tick size and quantity step (see the symbol `tick_size` and
        `quantity_increment`).
    trading_Currency:
      title: Currency
      type: object
      required:
        - currency
      properties:
        currency:
          $ref: '#/components/schemas/trading_CurrencyCommon'
    trading_Symbol:
      title: Symbol
      type: object
      required:
        - symbol
      properties:
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
    trading_Contract:
      title: Contract
      example:
        symbol: BTCUSDT_PERP
    trading_ExchangeBalance:
      title: Exchange balance
      allOf:
        - $ref: '#/components/schemas/trading_SpotBalance'
        - $ref: '#/components/schemas/trading_MarginBalanceFields'
    trading_SpotBalance:
      title: Spot Balance
      required:
        - available
        - reserved
      type: object
      properties:
        available:
          type: string
          description: Amount available for trading or transferring to a wallet.
          example: '23.7'
        reserved:
          type: string
          description: >-
            Total amount reserved for active orders and incomplete transfers to
            a wallet.
          example: '2.37'
    trading_MarginBalanceFields:
      title: Margin balance
      required:
        - reserved_margin
        - cross_margin_reserved
      type: object
      properties:
        reserved_margin:
          type: string
          description: >-
            Amount reserved for margin trading with funds backed by an isolated
            margin account.
          example: '0'
        cross_margin_reserved:
          type: string
          description: >-
            Amount reserved for margin trading with funds backed by a
            cross-margin account.
          example: '0'
    trading_Fee:
      title: Trading fees
      type: object
      required:
        - make_rate
        - take_rate
      properties:
        take_rate:
          type: string
          description: Liquidity taker fee rate applied to the order value.
          example: '0.001'
        make_rate:
          type: string
          description: Liquidity provider fee rate applied to the order value.
          example: '-0.0001'
    trading_OrderCommon:
      title: Order
      type: object
      required:
        - id
        - client_order_id
        - symbol
        - quantity
        - quantity_cumulative
        - time_in_force
        - side
        - status
        - type
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: uint64
          example: 828680665
          description: Unique order identifier as assigned by the exchange.
        client_order_id:
          type: string
          description: Client-provided or system-generated identifier of an order.
          example: d8574207d9e3b16a4a5511753eeef175
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        side:
          type: string
          enum:
            - sell
            - buy
          description: Order side.
        status:
          type: string
          enum:
            - new
            - suspended
            - partiallyFilled
            - filled
            - canceled
            - expired
            - rejected
          description: >
            Order status.


            Values:

            * `new`—an order is placed in the order book;

            * `suspended`—a `stopLimit`, `stopMarket`, `takeProfitLimit` or
            `takeProfitMarket` order is parked until it meets the conditions for
            placement in the order book;

            * `partiallyFilled`—an order is executed, but a part of its quantity
            is not filled yet;

            * `filled`—order quantity filled completely;

            * `canceled`—an order is canceled. It can either be done by a user
            through a cancel/replace request or by the system under specific
            circumstances;

            * `expired`—an order is deactivated after it no longer satisfies
            Time in Force (IOC, FOK) or Post Only requirements;

            * `rejected`—an order has been rejected.
        type:
          type: string
          enum:
            - limit
            - market
            - stopLimit
            - stopMarket
            - takeProfitLimit
            - takeProfitMarket
          description: >
            Order type.


            Values:

            * `limit`—an order that will be executed at or better than the
            specified price. The remainder, if any, is added to the order book
            or expired by terms of its Time-In-Force instruction;

            * `market`—an order that will be executed at the "best" available
            market price. If the order depletes its price level, then leaves
            quantity is placed to the order book at this limit price;

            * `stopLimit`—a limit order that remains inactive until the market
            crosses a specified stop price (for sell orders—falls below, for buy
            orders—rises above);

            * `stopMarket`—a market order that remains inactive until the market
            crosses a specified stop price (for sell orders—falls below, for buy
            orders—rises above);

            * `takeProfitLimit`—a limit order that remains inactive until the
            market crosses a specified stop price (for sell orders—rises above,
            for buy orders—falls below);

            * `takeProfitMarket`—a market order that remains inactive until the
            market crosses a specified stop price (for sell orders—rises above,
            for buy orders—falls below).
        time_in_force:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
            - Day
            - GTD
          description: >
            Order expiration mode.


            Values:

            * `GTC` ("Good-Till-Canceled")—order will not be closed until it is
            filled;

            * `IOC` ("Immediate-Or-Cancel")—order must be executed immediately.
            Any part of an IOC order that cannot be filled immediately will be
            canceled;

            * `FOK` ("Fill-Or-Kill")—order must be executed immediately and
            completely or not executed at all;

            * `Day`—keeps the order active until the end of the trading day
            (23:59 UTC+0);

            * `GTD` ("Good-Till-Date")—order will be canceled on the specified
            date.
        quantity:
          type: string
          description: Order quantity.
          example: '13.942'
        quantity_cumulative:
          type: string
          description: Executed order quantity.
          example: '5.240'
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: |
            Date of order expiration.

            Conditions: `time_in_force` is `"GTD"`
          example: null
        created_at:
          type: string
          format: date-time
          description: Date of order creation.
          example: '2024-03-22T14:18:47.321Z'
        updated_at:
          type: string
          format: date-time
          description: Date of order last update.
          example: '2024-03-22T15:23:56.876Z'
        price_average:
          type: string
          description: |
            Average price of executed order quantity.
          example: '27001.99'
    trading_OrderTrades:
      title: Order trades
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/trading_OrderTradesBase'
    trading_MarginOrderTrades:
      title: Margin order trades
      type: object
      properties:
        trades:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/trading_OrderTradesBase'
              - $ref: '#/components/schemas/trading_PositionId'
    trading_OrderBase:
      title: Order
      allOf:
        - $ref: '#/components/schemas/trading_OrderCommon'
        - type: object
          required:
            - post_only
          properties:
            post_only:
              type: boolean
              description: |
                A post-only order is an order that does not remove liquidity.

                ⚠️ If the post-only order would cause a match with a
                pre-existing order as a taker, then the order will be canceled.
    trading_OrderTradesBase:
      title: Order trades
      type: object
      required:
        - id
        - quantity
        - price
        - fee
        - timestamp
        - taker
      description: The list of trades the order participated in.
      properties:
        id:
          type: integer
          format: uint64
          description: Trade identifier.
          example: 112263
        quantity:
          type: string
          description: Quantity of the trade.
          example: '5.457'
        price:
          type: string
          description: Trade price.
          example: '27001.99'
        fee:
          type: string
          description: Fee paid for trade.
          example: '0.000097776600'
        timestamp:
          type: string
          description: Date and time of the trade.
          example: '2024-03-22T17:01:05.092Z'
        taker:
          type: boolean
          description: Liquidity indicator.
    trading_Price:
      title: Price
      type: object
      required:
        - price
      properties:
        price:
          type: string
          pattern: ^\d+\.?\d*$
          description: Order price.
          example: '27001.99'
    trading_StopPrice:
      title: Stop price
      type: object
      properties:
        stop_price:
          type: string
          description: The price level that triggers order activation.
          example: '27003.99'
    trading_MarketOrder:
      title: Market order
      allOf:
        - $ref: '#/components/schemas/trading_OrderBase'
        - $ref: '#/components/schemas/trading_OrderTrades'
        - $ref: '#/components/schemas/trading_OrderListFields'
    trading_LimitOrder:
      title: Limit order
      allOf:
        - $ref: '#/components/schemas/trading_MarketOrder'
        - $ref: '#/components/schemas/trading_Price'
    trading_StopLimitOrder:
      title: Stop limit order
      allOf:
        - $ref: '#/components/schemas/trading_LimitOrder'
        - $ref: '#/components/schemas/trading_HiddenOrderFields'
        - $ref: '#/components/schemas/trading_StopPrice'
        - required:
            - stop_price
    trading_StopMarketOrder:
      title: Stop market order
      allOf:
        - $ref: '#/components/schemas/trading_MarketOrder'
        - $ref: '#/components/schemas/trading_StopPrice'
        - required:
            - stop_price
    trading_Order:
      allOf:
        - type: object
        - title: Order
          discriminator:
            propertyName: type
            mapping:
              limit: '#/components/schemas/trading_LimitOrder'
              market: '#/components/schemas/trading_MarketOrder'
              stopLimit: '#/components/schemas/trading_StopLimitOrder'
              stopMarket: '#/components/schemas/trading_StopMarketOrder'
              takeProfitLimit: '#/components/schemas/trading_StopLimitOrder'
              takeProfitMarket: '#/components/schemas/trading_StopMarketOrder'
          oneOf:
