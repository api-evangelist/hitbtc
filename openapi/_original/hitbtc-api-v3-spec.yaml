      description: |
        Changes the AMR (auto margin replenishment) flag of a margin margin
         account: an isolated one addressed by `symbol` or a cross-margin one
         addressed by `currency`.

        ℹ️ For a cross-margin account, the flag is applied to all the positions
         of the account at once.

        ℹ️ The request is rejected with the `403` status code if
         `user_can_change_amr_isolated`/`user_can_change_amr_cross` is `false`
         for the requested margin mode.

        ℹ️ Setting the value the account already has is not an error: the
         current state is returned, but no report is sent.

        **Permission**: Place/cancel orders

        **IP limit**: 20/30
      requestBody:
        required: true
