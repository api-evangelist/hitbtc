    trading_ClosePositionFieldRequest:
      title: Close position
      type: object
      properties:
        close_position:
          type: boolean
          default: false
          description: |
            Flag indicating a stop market order must close a margin position
             when executed or be canceled otherwise.

            Conditions: `quantity` is omitted.
    trading_ReduceOnlyRequest:
      title: Reduce-only
      type: object
      properties:
        reduce_only:
          type: boolean
          default: false
          description: >
            Flag indicating whether the order, being filled, guarantees not to
            put the position quantity to the point when the position flips.


            Conditions:
              * if there is at least 1 reduce-only order, the maximum number of close orders must not exceed 20;
              * the maximum number of reduce-only orders must not exceed 3.
    trading_MarginModeRequest:
      title: Margin mode
      type: object
      properties:
