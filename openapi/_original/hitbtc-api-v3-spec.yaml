            - $ref: '#/components/schemas/trading_FuturesStopLimitOrderRequest'
            - $ref: '#/components/schemas/trading_FuturesStopMarketOrderRequest'
    trading_NewOrderClientId:
      title: Order client ID
      type: object
      properties:
        new_client_order_id:
          type: string
          minLength: 8
          maxLength: 32
          pattern: ^[a-zA-Z0-9_\-]{8,32}$
          description: >
            Client-provided identifier of a new order placed or parked instead
            of the canceled one.


            ⚠️ Uniqueness must be guaranteed until the last order with the same
            `client_order_id` becomes inactive (canceled, expired, or fully
            executed) and some time after that.


            ℹ️ If omitted, will be generated by the system.
          example: d8574207d9e3b16a4a5511753eeef175
    trading_ReplaceOrderRequestBase:
      title: Replace order request
      allOf:
        - $ref: '#/components/schemas/trading_StrictValidateRequest'
        - $ref: '#/components/schemas/trading_NewOrderClientId'
        - $ref: '#/components/schemas/trading_QuantityRequest'
    trading_LimitReplaceOrderRequest:
      title: Limit order
      allOf:
