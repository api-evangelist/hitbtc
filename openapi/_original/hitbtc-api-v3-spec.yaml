      security: []
  /public/converted/candles:
    get:
      tags:
        - Candles
      summary: Get a rate candle
      description: >
        Returns OHLCV data regarding the last price converted to the target
        currency for all symbols.


        ⚠️ This call produces the same output as `GET /public/converted/candles`
        except all values in quote currency are converted to the target
        currency.


        ℹ️ Conversion from the symbol quote currency to the target currency is
        the mean of "best" bid price and "best" ask price in the order book. If
        there is no "best" bid of ask price, the last price is returned.


        **Permission**: None


        **IP limit**: 30/50
      parameters:
        - $ref: '#/components/parameters/marketData_TargetCurrency'
        - $ref: '#/components/parameters/marketData_Symbols'
        - $ref: '#/components/parameters/marketData_SortDesc'
        - $ref: '#/components/parameters/marketData_Period'
        - $ref: '#/components/parameters/marketData_From'
        - $ref: '#/components/parameters/marketData_Till'
        - $ref: '#/components/parameters/marketData_Limit10'
        - $ref: '#/components/parameters/marketData_Pool'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_ConvertedCandles'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
