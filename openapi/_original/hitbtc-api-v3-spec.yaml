      title: Take-profit market order
      allOf:
        - $ref: '#/components/schemas/trading_ReplaceOrderRequestBase'
        - $ref: '#/components/schemas/trading_StopPriceRequest'
    trading_ReplaceOrderRequest:
      title: Replace order request
      oneOf:
        - $ref: '#/components/schemas/trading_LimitReplaceOrderRequest'
        - $ref: '#/components/schemas/trading_MarketReplaceOrderRequest'
        - $ref: '#/components/schemas/trading_StopLimitReplaceOrderRequest'
        - $ref: '#/components/schemas/trading_StopMarketReplaceOrderRequest'
        - $ref: '#/components/schemas/trading_TakeProfitLimitReplaceOrderRequest'
        - $ref: '#/components/schemas/trading_TakeProfitMarketReplaceOrderRequest'
    trading_OrderListId:
      title: Order list ID
      type: object
      properties:
        order_list_id:
          type: string
          minLength: 8
          maxLength: 32
          pattern: ^[a-zA-Z0-9_\-]{8,32}$
          description: >
            Client-provided identifier of the order list.


            Conditions:
              * if omitted, will be generated by the system;
              * equal to `client_order_id` of the first order in the list.

            ⚠️ Uniqueness must be guaranteed until the last order with the same
            `client_order_id` becomes inactive (canceled, expired, or fully
            executed) and some time after that.
          example: d8574207d9e3b16a4a5511753eeef175
    trading_OrderListRequest:
      title: Order list request
      allOf:
        - $ref: '#/components/schemas/trading_OrderListId'
        - type: object
          required:
            - contingency_type
            - orders
          properties:
            contingency_type:
              type: string
              enum:
                - allOrNone
                - oneCancelOther
                - oneTriggerOther
                - oneTriggerOneCancelOther
              description: |
                Order list type.

                Values:
                  * `allOrNone` (AON)—all orders in the set should be executed within a single transaction or become expired otherwise;
                  * `oneCancelOther` (OCO)—all orders in the set should be canceled if one of them was executed;
                  * `oneTriggerOther` (OTO)—execution of the first (primary) order on the list activates other (secondary) orders as independent of each other;
                  * `oneTriggerOneCancelOther` (OTOCO)—the execution of the first (primary) order on the list activates the other (secondary) orders as an OCO order list.
            orders:
              type: array
              items:
                $ref: '#/components/schemas/trading_OrderRequest'
                minItems: 2
                maxItems: 3
              description: >
                Orders in the order list.


                ⚠️ There must be 2 or 3 orders for
                `allOrNone`/`oneCancelOther`/`oneTriggerOther` and 3—for
                `oneTriggerOneCancelOther`. Placing any other number of orders
                will result in an error.
    trading_MarginOrderListRequest:
      title: Margin order list request
      allOf:
        - $ref: '#/components/schemas/trading_OrderListId'
        - type: object
          required:
            - contingency_type
            - orders
          properties:
            contingency_type:
              type: string
              enum:
                - oneCancelOther
                - oneTriggerOther
                - oneTriggerOneCancelOther
              description: |
                Order list type.

                Values:
                  * `oneCancelOther` (OCO)—all orders in the set should be canceled if one of them was executed;
                  * `oneTriggerOther` (OTO)—execution of the first (primary) order on the list activates other (secondary) orders as independent of each other;
                  * `oneTriggerOneCancelOther` (OTOCO)—the execution of the first (primary) order on the list activates the other (secondary) orders as an OCO order list.
            orders:
              type: array
              items:
                $ref: '#/components/schemas/trading_MarginOrderRequest'
                minItems: 2
                maxItems: 3
              description: >
                Orders in the order list.


                There must be 2 or 3 orders for
                `oneCancelOther`/`oneTriggerOther` and 3—for
                `oneTriggerOneCancelOther`. Placing any other number of orders
                will result in an error.
    trading_AccountBase:
      title: Margin account
      type: object
      required:
        - symbol
        - type
        - created_at
        - updated_at
        - currencies
        - margin_call
        - margin_auto
        - amr
      properties:
        symbol:
          type: string
          description: |
            Trading symbol, where base currency is the currency of funds
            reserved on the exchange account for positions and quote currency is
            the currency of funds reserved on a margin account.
          example: BTCUSDT
        type:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        created_at:
          type: string
          format: date-time
          description: |
            Account creation date and time.
          example: '2024-03-22T17:26:10.758Z'
        updated_at:
          type: string
          format: date-time
          description: |
            Account last update date and time.
          example: '2024-03-22T21:20:03.64Z'
        margin_call:
          type: boolean
          description: |
            Flag indicating whether additional margin is required to maintain
            the position.
        margin_auto:
          type: boolean
          description: |
            Flag indicating whether AMM (auto margin management) is enabled for
            the margin account.
        amr:
          type: boolean
          description: |
            Current value of the AMR (auto margin replenishment) flag of the
            margin account.
    trading_Leverage:
      title: Leverage
      type: object
      required:
        - leverage
      properties:
        leverage:
          type: string
          description: |
            Leverage—the ratio of the user own funds to funds borrowed from the
            platform.
          example: '12.00'
    trading_FuturesAccountIsolated:
      title: Isolated
      allOf:
        - $ref: '#/components/schemas/trading_AccountBase'
        - $ref: '#/components/schemas/trading_Leverage'
        - type: object
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/trading_FuturesPositionBase'
              description: Open positions of the margin account.
            currencies:
              type: array
              items:
                $ref: '#/components/schemas/trading_IsolatedAccountBalance'
              description: |
                Amount of funds on margin account.
    trading_FuturesAccountCross:
      title: Cross
      allOf:
        - $ref: '#/components/schemas/trading_AccountBase'
        - $ref: '#/components/schemas/trading_Leverage'
        - type: object
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/trading_FuturesPosition'
              description: Open positions of the margin account.
            currencies:
              type: array
              items:
                $ref: '#/components/schemas/trading_CrossAccountBalance'
              description: |
                Amount of funds on margin account.
    trading_AccountIsolated:
      title: Isolated
      allOf:
        - $ref: '#/components/schemas/trading_AccountBase'
        - $ref: '#/components/schemas/trading_Leverage'
        - type: object
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/trading_PositionBase'
              description: Open positions of the margin account.
            currencies:
              type: array
              items:
                $ref: '#/components/schemas/trading_IsolatedAccountBalance'
              description: |
                Amount of funds on margin account.
    trading_AccountCross:
      title: Cross
      allOf:
        - $ref: '#/components/schemas/trading_AccountBase'
        - $ref: '#/components/schemas/trading_Leverage'
        - type: object
          required:
            - positions
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/trading_Position'
              description: Open positions of the margin account.
            currencies:
              type: array
              items:
                $ref: '#/components/schemas/trading_IsolatedAccountBalance'
              description: |
                Amount of funds on margin account.
    trading_FuturesAccount:
      allOf:
        - type: object
        - title: Margin account
          discriminator:
            propertyName: type
            mapping:
              isolated: '#/components/schemas/trading_FuturesAccountIsolated'
              cross: '#/components/schemas/trading_FuturesAccountCross'
          oneOf:
            - $ref: '#/components/schemas/trading_FuturesAccountIsolated'
            - $ref: '#/components/schemas/trading_FuturesAccountCross'
    trading_Account:
      allOf:
        - type: object
        - title: Margin account
          discriminator:
            propertyName: type
            mapping:
              isolated: '#/components/schemas/trading_AccountIsolated'
              cross: '#/components/schemas/trading_AccountCross'
          oneOf:
            - $ref: '#/components/schemas/trading_AccountIsolated'
            - $ref: '#/components/schemas/trading_AccountCross'
    trading_AccountCrossReport:
      title: Cross-margin account report
      description: |
        ⚠️ Values of `required_margin`, `margin_call_margin`,
        `liquidation_margin` do not carry information that would be valuable for
        predicting the condition of a position, since those change after an
        adjusted price (mark price) changes.
      allOf:
        - $ref: '#/components/schemas/trading_MarginMode'
        - required:
            - account_margin
            - currency
            - margin_mode
            - exec_type
            - margin
            - required_margin
            - debt_sum
            - margin_call
            - margin_auto
            - amr
          properties:
            exec_type:
              type: string
              enum:
                - created
                - marginChanged
                - amrChanged
              description: |
                Margin account report execution type.

                Values:
                * `created`—new position has been created as a result of the
                  first set margin request;
                * `marginChanged`—position margin has been added or withdrawn as
                  a result of any subsequent set margin request;
                * `amrChanged`—the value of the AMR (auto margin replenishment)
                  flag has changed.
            currency:
              type: string
              description: |
                Currency code.
              example: USDT
            account_margin:
              type: string
              description: |
                Amount of margin in natural units of currency.
              example: '100.00'
            margin:
              type: string
              description: |
                Total amount of margin in natural units of currency involved in
                positions, meaning that it is equal to the sum of orders margin
                and account margin.
              example: '100.00'
            required_margin:
              type: string
              description: |
                The lower boundary to `margin` minus debt. If margin is lower
                than this value, placing new orders and margin retrieving are
                not allowed.
              example: '0'
            margin_call_margin:
              type: string
              description: |
                Minimum amount of margin that must be in the account to avoid
                sending a margin call.

                ℹ️ If the `account_margin` minus `debt_sum` not exceeds
                `margin_call_margin`, a margin call will send.
              example: '0'
            liquidation_margin:
              type: string
              description: |
                Minimum amount of margin that must be in the account to avoid
                liquidation.

                ℹ️ If the `account_margin` minus `debt_sum` not exceeds
                `liquidation_margin`, all active orders will be canceled and
                then, if condition still true, account will be liquidated.
              example: '0'
            debt_sum:
              type: string
              description: |
                Account debt for interests (fundings), fees, and loss.
              example: '0'
            margin_call:
              type: boolean
              description: |
                Flag indicating whether additional margin is required to
                maintain the position.
            margin_auto:
              type: boolean
              description: |
                Flag indicating whether AMM (auto margin management) is enabled
                for the margin account.
            amr:
              type: boolean
              description: |
                Current value of the AMR (auto margin replenishment) flag of the
                margin account.
    trading_AccountReport:
      title: Margin account report
      oneOf:
        - $ref: '#/components/schemas/trading_AccountIsolated'
        - $ref: '#/components/schemas/trading_AccountCrossReport'
    trading_FuturesAccountReport:
      title: Margin account report
      oneOf:
        - $ref: '#/components/schemas/trading_AccountIsolated'
        - $ref: '#/components/schemas/trading_AccountCrossReport'
    trading_IsolatedAccountBalance:
      title: Margin account balance
      type: object
      required:
        - code
        - margin_balance
        - reserved_orders
        - reserved_positions
      properties:
        code:
          type: string
          description: Currency code.
          example: USDT
        margin_balance:
          type: string
          description: The total value of funds reserved for the position.
          example: '23.7'
        reserved_orders:
          type: string
          description: The value reserved for active orders in the position.
          example: '0'
        reserved_positions:
          type: string
          description: >-
            The minimum value reserved for position's executed quantity that
            cannot be reduced.
          example: '2.37'
    trading_CrossAccountBalance:
      title: Cross account balance
      allOf:
        - $ref: '#/components/schemas/trading_IsolatedAccountBalance'
        - required:
            - margin_call_margin
            - liquidation_margin
            - debt_sum
        - properties:
            margin_call_margin:
              type: string
              description: >
                The lower boundary to `margin_balance` minus debt.


                ℹ️ If the margin is equal to this value, a margin call is sent.


                ℹ️ This do not carry information that would be valuable for

                predicting the condition of a position, since those change after
                an

                adjusted price (mark price) changes.
              example: '0.37'
            liquidation_margin:
              type: string
              description: >
                The lower boundary to `margin_balance` minus debt.


                ℹ️ If the margin is equal to this value, it is liquidated.


                ℹ️ This do not carry information that would be valuable for

                predicting the condition of a position, since those change after
                an

                adjusted price (mark price) changes.
              example: '0.23'
            debt_sum:
              type: string
              description: |
                Account debt for interests (fundings), fees, and loss.
              example: '0'
    trading_PositionBase:
      title: Margin position
      type: object
      required:
        - id
        - symbol
        - margin_mode
        - quantity
        - price_entry
        - price_margin_call
        - price_liquidation
        - pnl
        - created_at
        - updated_at
        - status
        - required_margin
        - orders_margin
        - margin_auto
        - amr
      properties:
        id:
          type: integer
          format: uint64
          description: Position identifier.
          example: 1408
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        quantity:
          type: string
          description: Position quantity.
          example: '0.00007'
        price_entry:
          type: string
          description: Average weighted price of position open orders.
          example: '33304.11'
        price_margin_call:
          type: string
          description: Margin call price.
          example: '25395.20'
        price_liquidation:
          type: string
          description: Liquidation price.
          example: '24884.62'
        pnl:
          type: string
          description: Unrealized profit and loss.
          example: '0.014772687500'
        fee_cumulative:
          type: string
          description: |
            Total amount of fees paid throughout the position lifetime until it
             is closed.

            Format: Decimal

            Values: `0` if a new position created

            ⚠️ This value does zero out after the position closes  and does not
             when it flips.
          example: '0.14'
        created_at:
          type: string
          format: date-time
          description: Position creation date and time.
          example: '2024-03-22T17:26:10.758Z'
        updated_at:
          type: string
          format: date-time
          description: Position last update date and time.
          example: '2024-03-22T21:20:03.64Z'
        status:
          type: string
          enum:
            - normal
            - blocked
            - closeOnly
          description: |
            Position status.

            Values:
            * `normal`—the client can place and cancel orders, amend and change
              the margin;
            * `blocked`—the client cannot place orders on either side;
            * `closeOnly`—the client may only place orders to close the
              position.
        required_margin:
          type: string
          description: |
            Amount of currency reserved for close orders.
          example: '1.126441946273'
        orders_margin:
          type: string
          description: |
            Amount of currency reserved for open orders.
          example: '0'
        margin_call:
          type: boolean
          description: >
            Flag indicating whether additional margin is required to maintain
            the position.
        margin_auto:
          type: boolean
          description: |
            Flag indicating whether AMM (auto margin management) is enabled for
             the position.
        amr:
          type: boolean
          description: |
            Current value of the AMR (auto margin replenishment) flag of the
             position.
    trading_FuturesPositionBase:
      title: Margin position
      allOf:
        - $ref: '#/components/schemas/trading_PositionBase'
        - properties:
            sum_fundings:
              type: string
              description: |
                Sum of all settled funding to a position.
              example: '0'
            adl_ranking:
              type: string
              description: |
                Rank of a position which defines how appropriate a position is
                to be used for closing bankrupt positions avoided liquidation.

                The rank represents the probability of a position becoming
                deleveraged: a high rank value signifies a high probability,
                and vice versa.

                Values: 0 – 4
              example: '0'
    trading_Position:
      title: Margin position
      allOf:
        - $ref: '#/components/schemas/trading_PositionBase'
        - $ref: '#/components/schemas/trading_Leverage'
    trading_ReportReason:
      title: Report reason
      required:
        - report_reason
      properties:
        report_reason:
          type: string
          enum:
            - created
            - openTrade
            - closeTrade
            - flipTrade
            - updated
            - marginChanged
            - closed
            - status
            - liquidated
            - interestTaken
            - liquidationTrade
            - fundingTaken
            - deleveraged
            - deleverageTrade
            - leverageChanged
            - amrChanged
          description: |
            Position report reason.

            Values:
            * `created`—new position has been created as a result of the first
              set margin request;
            * `openTrade`—opening trade has been executed;
            * `closeTrade`—closing trade has been executed;
            * `flipTrade`—position has been flipped as a result of an opposite
              order execution with quantity exceeding the position quantity;
            * `updated`—position has been changed as a result of either order
              placing, canceling, position status changing, or a "margin call";
            * `marginChanged`—position margin has been added or withdrawn as a
              result of any subsequent set margin request (refer to `created`);
            * `closed`—position quantity has zeroed as a result of a close
              trade;
            * `status`—response to a position request;
            * `liquidated`—position has been closed as a result of a liquidation
              trade (including one during auto-deleveraging);
            * `interestTaken`—interest rate has been paid;
            * `liquidationTrade`—liquidation order has been placed;
            * `fundingTaken`—funding has been paid/taken;
            * `deleveraged`—position has been deleveraged;
            * `deleverageTrade`—a part of position quantity has been
              deleveraged;
            * `leverageChanged`—leverage of a futures position has been changed;
            * `amrChanged`—the value of the AMR (auto margin replenishment) flag
              has changed.
    trading_FuturesPosition:
      title: Margin position
      allOf:
        - $ref: '#/components/schemas/trading_Leverage'
        - $ref: '#/components/schemas/trading_FuturesPositionBase'
    trading_MarginSettings:
      title: Margin settings
      type: object
      required:
        - default_amm
        - user_can_change_amm
        - user_can_change_amr_isolated
        - user_can_change_amr_cross
        - current_amm
        - amm_override_set
      properties:
        default_amm:
          type: boolean
          description: |
            Default value of the AMM (auto margin management) flag on the
             platform.
        user_can_change_amm:
          type: boolean
          description: |
            Flag indicating whether the user is allowed to change the AMM (auto
             margin management) flag.
        user_can_change_amr_isolated:
          type: boolean
          description: |
            Flag indicating whether the user is allowed to change the AMR (auto
             margin replenishment) flag of isolated margin accounts.
        user_can_change_amr_cross:
          type: boolean
          description: |
            Flag indicating whether the user is allowed to change the AMR (auto
             margin replenishment) flag of cross-margin accounts.
        current_amm:
          type: boolean
          description: >
            Effective value of the AMM (auto margin management) flag of the
            user:
             either the value set by the user or the default one.

            ℹ️ This is the value the exchange web interface puts into
             `margin_auto` of every new order.
        amm_override_set:
          type: boolean
          description: |
            Flag indicating whether the user has set an own value of the AMM
             (auto margin management) flag instead of the default one.
      example:
        default_amm: false
        user_can_change_amm: true
        user_can_change_amr_isolated: true
        user_can_change_amr_cross: true
        current_amm: true
        amm_override_set: true
    trading_SetAmmRequest:
      title: Set AMM request
      type: object
      required:
        - amm
      properties:
        amm:
          type: boolean
          description: |
            New value of the AMM (auto margin management) flag of the user.
      example:
        amm: true
    trading_SetAmm:
      title: Set AMM
      type: object
      required:
        - amm
      properties:
        amm:
          type: boolean
          description: |
            Value of the AMM (auto margin management) flag of the user.
      example:
        amm: true
    trading_SetAmrRequest:
      title: Set AMR request
      type: object
      required:
        - margin_mode
        - amr
      properties:
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        symbol:
          type: string
          description: |
            Symbol code of the isolated margin account.

            Conditions: required if `margin_mode` is `isolated`, must be omitted
             otherwise
          example: BTCUSDT
        currency:
          type: string
          description: |
            Currency code of the cross-margin account.

            Conditions: required if `margin_mode` is `cross`, must be omitted
             otherwise
          example: USDT
        amr:
          type: boolean
          description: |
            New value of the AMR (auto margin replenishment) flag of the margin
             account.
      example:
        margin_mode: isolated
        symbol: BTCUSDT
        amr: true
    trading_SetAmr:
      title: Set AMR
      type: object
      required:
        - margin_mode
        - amr
      properties:
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        symbol:
          type: string
          description: |
            Symbol code of the isolated margin account.

            Conditions: `margin_mode` is `isolated`
          example: BTCUSDT
        currency:
          type: string
          description: |
            Currency code of the cross-margin account.

            Conditions: `margin_mode` is `cross`
          example: USDT
        amr:
          type: boolean
          description: |
            Current value of the AMR (auto margin replenishment) flag of the
             margin account.
      example:
        margin_mode: isolated
        symbol: BTCUSDT
        amr: true
    trading_MarginBalanceRequest:
      title: Margin balance request
      allOf:
        - $ref: '#/components/schemas/trading_StrictValidateRequest'
        - type: object
          required:
            - margin_balance
          properties:
            margin_balance:
              type: number
              minimum: 0
              description: Amount of currency reserved for margin trading.
              example: 2.37
    trading_LeverageRequest:
      title: Leverage
      type: object
      properties:
        leverage:
          type: string
          description: >
            User leverage.


            Format: decimal with up to 2 digits after the dot


            Values: > 0


            ⚠️ Leverage can be declined if the resulting position value violates
            risk limit.
    trading_SetLeverageRequest:
      title: Set leverage request
      allOf:
        - $ref: '#/components/schemas/trading_LeverageRequest'
        - $ref: '#/components/schemas/trading_StrictValidateRequest'
        - type: object
          required:
            - symbol
            - margin_mode
            - leverage
          properties:
            symbol:
              type: string
              description: Symbol code.
              example: BTCUSDT_PERP
            margin_mode:
              $ref: '#/components/schemas/trading_MarginModeCommon'
          example: '10.00'
    trading_ClosePositionRequest:
      title: Close position request
      type: object
      properties:
        price:
          type: number
          exclusiveMinimum: 0
          description: Position close price.
          example: 27001.99
        strict_validate:
          $ref: '#/components/schemas/trading_StrictValidateCommon'
    trading_MarginParams:
      title: Margin parameters
      type: object
      required:
        - symbol
        - margin_call_leverage_mul
        - liquidation_leverage_mul
        - max_initial_leverage
        - margin_mode
        - force_close_fee
        - enabled
        - active
      properties:
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        margin_call_leverage_mul:
          type: string
          description: Multiplier for calculating margin call leverage.
          example: '1.50'
        liquidation_leverage_mul:
          type: string
          description: Multiplier for calculating liquidation leverage.
          example: '2.00'
        max_initial_leverage:
          type: string
          description: Maximum leverage that the user can use for margin trading.
          example: '10.00'
        margin_mode:
          type: string
          enum:
            - Isolated
            - Cross
          description: Margin mode.
        force_close_fee:
          type: string
          description: Fee for the force closing of the position.
          example: '0.05'
        enabled:
          type: boolean
          description: Flag indicating whether the margin trading is available.
        active:
          type: boolean
          description: >-
            Flag indicating whether any positions comply with the parameters
            (including not yet opened).
        limit_base:
          type: string
          description: |
            An absolute maximum that a position value can reach.

            Conditions: risk limits exist
          example: '50000.00'
        limit_power:
          type: string
          description: >
            Power which determines the influence of the leverage on the risk
            limit value.


            Conditions: risk limits exist
          example: '2.2'
        unlimited_threshold:
          type: string
          description: |
            Position leverage below which the risk limit is not calculated.

            Conditions: risk limits exist
          example: '10.0'
    trading_Clearing:
      title: Clearing
      type: object
      required:
        - timestamp
        - currency
        - amount
      properties:
        timestamp:
          type: integer
          format: uint64
          description: Transfer timestamp in nanoseconds.
          example: 1646524800267
        position_id:
          type: integer
          format: uint64
          description: |
            Position identifier.

            Conditions: the user holds a position
          example: 1408
        position_quantity:
          type: string
          description: |
            Position quantity.

            Conditions: the user holds a position
          example: '0.00010'
        position_entry_value:
          type: string
          description: |
            Position entry value.

            Conditions: the user holds a position
          example: '5.126379000000'
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        currency:
          type: string
          description: Transfer currency.
          example: USDT
        amount:
          type: string
          description: Transfer amount.
          example: '0.011819526000'
        rate:
          type: string
          description: >
            Interest rate.


            Conditions: `null` if the withdrawal occurred during a close trade
            (debt collection)
          example: '0.0001'
        debt_delta:
          type: string
          description: >
            Debt value.


            Conditions: the user was unable to pay funding during the last
            withdrawal but had a positive UPnL
          example: '0'
    trading_Interest:
      title: Interest
      allOf:
        - $ref: '#/components/schemas/trading_Clearing'
        - type: object
          required:
            - type
          properties:
            trade_id:
              type: integer
              format: uint64
              description: |
                Trade identifier.

                Conditions: the user holds a position
              example: 112263
            type:
              type: string
              enum:
                - interest
              description: Transfer type.
    trading_Funding:
      title: Funding
      allOf:
        - $ref: '#/components/schemas/trading_Clearing'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - funding
              description: Transfer type.
    trading_PositionHistory:
      title: Positions history
      type: object
      required:
        - id
        - entry_value
        - entry_price
        - avg_buy_price
        - avg_sell_price
        - quantity
        - buy_quantity
        - sell_quantity
        - margin_call_price
        - liquidation_price
        - bankruptcy_price
        - margin
        - required_margin
        - orders_margin
        - pnl
        - leverage
        - margin_mode
        - state
        - symbol
        - margin_call
        - margin_auto
        - amr
        - create_timestamp
        - update_timestamp
      properties:
        id:
          type: integer
          format: uint64
          description: Position identifier.
          example: 1408
        entry_value:
          type: string
          description: Position value in currency.
          example: '0'
        entry_price:
          type: string
          description: Weighted average open price.
          example: '0.000'
        avg_buy_price:
          type: string
          description: Weighted average buy price.
          example: '1978.057'
        avg_sell_price:
          type: string
          description: Weighted average sell price.
          example: '3851.001'
        quantity:
          type: string
          description: Position quantity.
          example: '0'
        buy_quantity:
          type: string
          description: Total quantity of buy trades in the position.
          example: '0'
        sell_quantity:
          type: string
          description: Total quantity of sell trades in the position.
          example: '0'
        margin_call_price:
          type: string
          description: >-
            If the market is equal to or worse than this price a margin call
            will be issued.
          example: '0.000'
        liquidation_price:
          type: string
          description: The price at which the platform begins to close the position.
          example: '0.000'
        bankruptcy_price:
          type: string
          description: >-
            The price at which the position can no longer be closed with any
            non-negative PnL.
          example: '0.000'
        margin:
          type: string
          description: Amount of margin expressed in the quote currency.
          example: '100.169018395350'
        required_margin:
          type: string
          description: Margin reserved for close orders.
          example: '0'
        orders_margin:
          type: string
          description: Margin reserved for open orders.
          example: '0.000006557500'
        pnl:
          type: string
          description: Unrealized Profit and Loss.
          example: '0.187294400000'
        leverage:
          type: string
          description: Position leverage.
          example: '10.00'
        margin_mode:
          $ref: '#/components/schemas/trading_MarginModeCommon'
        state:
          type: string
          description: Position state.
          enum:
            - closed
            - active
            - liquidated
        fee_cumulative:
          type: string
          description: |
            Total amount of fees paid throughout the position lifetime until it
             is closed.

            Format: Decimal

            Values: `0` if a new position created

            ⚠️ This value does zero out after the position closes  and does not
             when it flips.
          example: 0.14
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        margin_call:
          type: boolean
          description: >-
            Flag indicating the position is close to the liquidation, and
            increased margin may prevent it from happening.
        margin_auto:
          type: boolean
          description: |
            Flag indicating whether AMM (auto margin management) was enabled for
             the position.
        amr:
          type: boolean
          description: |
            Value of the AMR (auto margin replenishment) flag of the position.
        create_timestamp:
          type: integer
          format: uint64
          description: Timestamp of the position creation in nanoseconds.
          example: 1626881592397
        update_timestamp:
          type: integer
          format: uint64
          description: Timestamp of the position last update in nanoseconds.
          example: 1639570624225
    trading_Error:
      title: Error
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_TotalOrdersCountExceeded:
      title: Total orders count exceeded
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Maximum number of active or suspended on the gateway is exceeded.
      example:
        error:
          code: 61
          message: Exceed total orders count
    trading_SymbolOrdersCountExceeded:
      title: Symbol orders count exceeded
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Maximum number of active or suspended for symbol is exceeded.
      example:
        error:
          code: 62
          message: Exceed symbol orders count
    trading_BadClosePosition:
      title: Bad close position
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid value of the `close_position` flag in a new order request.
      example:
        error:
          code: 63
          message: Bad close position
    trading_AmmDisabled:
      title: AMM feature is disabled
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        AMM (auto margin management) is disabled on the platform.
      example:
        error:
          code: 65
          message: AMM feature is disabled
    trading_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: Unclassified internal error.
      example:
        error:
          code: 500
          message: Internal Server Error
    trading_ResponseFormatter:
      title: Formatter error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * the position symbol is not found when returning the response;
        * a margin balance currency is not found when returning the response.
      example:
        error:
          code: 500
          message: Internal error
          description: response formatter error
    trading_RequestTimeout:
      title: Request Timeout
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Operation was canceled.
      example:
        error:
          code: 504
          message: Request Timeout
    trading_BadTimeInForce:
      title: Bad Time-In-Force
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided Time-In-Force instruction is invalid or the combination of the
        instruction and the order type is not allowed.
      example:
        error:
          code: 20048
          message: Bad time in force
    trading_BadType:
      title: Bad order type
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided order type is invalid.
      example:
        error:
          code: 20049
          message: Bad type
    trading_BadOrderListSize:
      title: Bad order list size
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The number of order in the order list violates the conditions for its
        contingency type.
      example:
        error:
          code: 2017
          message: Bad order list size
    trading_BadPrice:
      title: Bad price
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid price format.
      example:
        error:
          code: 2022
          message: Bad price
    trading_ExchangeClosed:
      title: Exchange closed
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Exchange is temporary closed.
      example:
        error:
          code: 20010
          message: Exchange temporary closed
    trading_BadSymbolsCombination:
      title: Bad symbols combination
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Orders in the order list are on symbols that are unacceptable in
        combination for the given type.

        Any of:
        * for `allOrNone`—all symbols must be different;
        * for `oneTriggerOneCancelOther`—all symbols must be the same.
      example:
        error:
          code: 2016
          message: Bad symbols combination
    trading_FatFingerLimitExceeded:
      title: Fat finger limit exceeded
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Fat finger limit is exceeded.

        If a replace request is rejected, it cancels the original order without
        placing a new one.
      example:
        error:
          code: 20045
          message: Fat finger limit exceeded
          description: Check that the funds are sufficient, given commissions
    trading_DuplicateClientOrderID:
      title: Duplicate client order Id
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided client order identifier is user in an active order or has been
        used lately.
      example:
        error:
          code: 20008
          message: Duplicate clientOrderId
    trading_ExceedsLimit:
      title: Exceeds limit
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Available funds on the exchange balance are not sufficient.
      example:
        error:
          code: 20001
          message: Insufficient funds
          description: Check that the funds are sufficient, given commissions
    trading_OrderNotFound:
      title: Order not found
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Canceled or replaced order has not been found, or the user has no active
        or parked orders.
      example:
        error:
          code: 20002
          message: Order not found
    trading_MarginTradingIsDisabled:
      title: Margin trading is disabled
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Margin trading is forbidden for the user.
      example:
        error:
          code: 20040
          message: Margin trading forbidden
    trading_PositionNotOpened:
      title: Position not opened
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Requested position is not open (has `0` quantity).
      example:
        error:
          code: 20032
          message: Margin account of position not found
    trading_WorseLiquidationNew:
      title: Worse liquidation new
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The value of the order exceeds the margin isolated for the position.
      example:
        error:
          code: 20041
          message: Worse liquidation price
    trading_WorseLiquidationExisted:
      title: Worse liquidation existed
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The value of the existing order exceeds the margin isolated for the
        position.
      example:
        error:
          code: 20042
          message: Worse liquidation price
    trading_InvalidCancelRequestId:
      title: Invalid cancel request Id
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The client order ID provided during an order cancellation is invalid.
      example:
        error:
          code: 10023
          message: Invalid cancel request ID
    trading_InvalidUserLeverage:
      title: Invalid user leverage
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid leverage value.
      example:
        error:
          code: 10024
          message: Invalid user leverage
    trading_SymbolNotFound:
      title: Symbol not found
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The symbol featured in the request has not been found.
      example:
        error:
          code: 2001
          message: Symbol not found
    trading_NoAvailableMargin:
      title: Limit exceeded
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Position does not have enough margin to remove (set margin request),
        place/replace an order, or satisfy the requested leverage.
      example:
        error:
          code: 20003
          message: Limit exceeded
    trading_UnknownMarginAccount:
      title: Unknown margin account
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        No margin account for a given instrument is found.
      example:
        error:
          code: 10025
          message: Unknown margin account
    trading_QuantityBad:
      title: Bad quantity
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid quantity format.
      example:
        error:
          code: 2012
          message: Bad quantity
    trading_NotChanged:
      title: Not changed
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided parameters for a new order are the as of the replaced one.
      example:
        error:
          code: 20009
          message: Price, quantity, or stop price has not been modified
    trading_SymbolExpired:
      title: Symbol expired
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Trades on the given symbol are suspended.
      example:
        error:
          code: 20046
          message: Exchange symbol is expired
    trading_PositionBlocked:
      title: Position blocked
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Position has the `blocked` status.
      example:
        error:
          code: 20051
          message: Margin trading forbidden
    trading_PositionIsCloseOnly:
      title: Position is close-only
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The position price has reached the margin-call mark and open orders are
        no longer allowed.
      example:
        error:
          code: 20034
          message: Position in close only state
    trading_NotSupported:
      title: Not supported
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * hidden orders are not supported for the given symbol;
        * the hidden quantity is not equal to zero.
      example:
        error:
          code: 2015
          message: symbol code not supported
    trading_BadDisplayQuantity:
      title: Bad display quantity
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        `display_quantity` in a hidden order is other than 0.
      example:
        error:
          code: 2013
          message: Bad display quantity
    trading_CcNoMoney:
      title: No funds on CCA
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Order placing exceeds the central counterparty balance limit.
      example:
        error:
          code: 20047
          message: Borrowing pool exhausted for requested currency
    trading_BadFlagsCombination:
      title: Bad flags combination
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * hidden orders are not supported for the given order type;
        * hidden orders are not supported for the given TIF instruction.
      example:
        error:
          code: 2014
          message: Bad flags combination
    trading_TooLateToEnter:
      title: Too late to enter
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        The order met its expiration time before it might be processed.
      example:
        error:
          code: 20080
          message: Internal order execution deadline exceeded
    trading_MarginTradingForbidden:
      title: Margin trading forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Margin trading is forbidden for the user.

        Any of:
        * the user is not found;
        * user verification level does not allow margin trading;
        * the user is suspected of fraudulent activity.
      example:
        error:
          code: 20052
          message: Margin trading forbidden
    trading_InsufficientFunds:
      title: Insufficient funds
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: ''
      example:
        error:
          code: 20004
          message: Insufficient funds
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Trading on the requested market is not available.
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_BadFormat:
      title: Bad format
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided parameters do not meet any supported authentication scheme.
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * missing required parameters;
        * the maximum time window is exceeded.
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_Forbidden:
      title: Forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * insufficient API key permissions;
        * provided IP address is not in the white list;
        * the user is not eligible for the given liquidity pool due to the
          configuration.
      example:
        error:
          code: 1003
          message: Action is forbidden for this API key
    trading_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * invalid API key;
        * user is not allowed to perform the requested operation.
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * invalid API key;
        * user is not allowed to perform the requested operation;
        * invalid time window value;
        * invalid HMAC signature format;
        * invalid HMAC signature value.
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_UnauthorizedJWT:
      title: Unauthorized (Bearer)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid JWT.
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_TradingForbidden:
      title: Trading forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Placing new order is forbidden for this liquidity pool.
      example:
        error:
          code: 1006
          message: Action is forbidden
    trading_CurrencyNotFound:
      title: Currency not found
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Provided currency has not been found.

        Any of:
        * the currency is disabled;
        * the currency is unavailable for a given market.
      example:
        error:
          code: 2002
          message: Currency not found
    trading_UnknownMarginMode:
      title: Unknown margin mode
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid margin mode.
      example:
        error:
          code: 2025
          message: Unknown margin mode
    trading_QuantityNotNumber:
      title: Quantity not number
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid quantity value.

        Any of:
        * quantity is not a decimal with a dot as the separator;
        * maximum bit depth is exceeded.
      example:
        error:
          code: 2010
          message: Quantity not a valid number
    trading_QuantityTooLow:
      title: Quantity too low
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Quantity is less or equal to zero or the quantity increment.
      example:
        error:
          code: 2011
          message: Quantity too low
    trading_InvalidPrice:
      title: Invalid price
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Invalid price value.

        Any of:
        * price is not a decimal with a dot as the separator;
        * maximum bit depth is exceeded;
        * price is less or equal to zero.
      example:
        error:
          code: 2020
          message: Price is not a valid decimal
    trading_Validation:
      title: Validation
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: |
        Any of:
        * invalid JSON payload;
        * invalid form payload;
        * specified parameters are mutually exclusive;
        * a required parameter is missing;
        * the value of a parameter is invalid;
        * pair parameters have different formats;
        * provided value does not match the currency precision while the
          strict-validate mode is enabled.
      example:
        error:
          code: 10001
          message: Validation error
  responses:
    marketData_404:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
              - timestamp
              - path
              - status
              - error
              - message
              - requestId
            properties:
              timestamp:
                type: string
                format: date-time
                description: Request timestamp.
                example: '2024-03-22T15:04:05.590Z'
              path:
                type: string
                description: Request path.
                example: /api/3/public/PATH
              status:
                type: integer
                description: Error status.
                example: 404
              error:
                type: string
                description: Error description.
                example: Not Found
              message:
                type: string
                nullable: true
                enum:
                  - null
                description: Error message.
              requestId:
                type: string
                description: Request identifier.
                example: 0cdf39b4-28499640
    wallet_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/wallet_UnauthorizedBasic'
              - $ref: '#/components/schemas/wallet_UnauthorizedHS256'
              - $ref: '#/components/schemas/wallet_BadFormatHS256'
              - $ref: '#/components/schemas/wallet_AuthInvalid'
              - $ref: '#/components/schemas/wallet_BadFormat'
    wallet_403:
      description: Forbidden
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/wallet_Forbidden'
              - $ref: '#/components/schemas/wallet_ShouldUpgradePermission'
              - $ref: '#/components/schemas/wallet_NotEnoughPermissions'
    wallet_408:
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_RequestTimeout'
    wallet_429:
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_TooManyRequests'
    wallet_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Internal'
    wallet_502:
      description: Bad Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_BadGateway'
    wallet_503:
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_ServiceUnavailable'
    wallet_504:
      description: Gateway Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_GatewayTimeout'
    wallet_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    trading_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/trading_UnauthorizedBasic'
              - $ref: '#/components/schemas/trading_UnauthorizedHS256'
              - $ref: '#/components/schemas/trading_UnauthorizedJWT'
              - $ref: '#/components/schemas/trading_BadFormat'
              - $ref: '#/components/schemas/trading_BadFormatHS256'
    trading_403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Forbidden'
    trading_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Internal'
    trading_504:
      description: Gateway Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_RequestTimeout'
    trading_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Error'
  securitySchemes:
    wallet_BasicAuth:
      type: http
      description: Provide a public key as the username and a secret key as the password.
      scheme: basic
    wallet_BearerAuth:
      type: http
      description: Provide a bearer token obtained from the authentication service.
      scheme: bearer
      bearerFormat: JWT
    trading_BasicAuth:
      type: http
      description: Provide a public key as the username and a secret key as the password.
      scheme: basic
    trading_BearerAuth:
      type: http
      description: Provide a bearer token obtained from the authentication service.
      scheme: bearer
      bearerFormat: JWT
