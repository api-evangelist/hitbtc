openapi: 3.1.1
info:
  title: Public API
  description: ''
  version: ''
servers:
  - url: /api/2
paths:
  /public/candles:
    get:
      tags:
        - Candles
      summary: Get candles.
      description: Returns candles for all or multiple symbols.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolsQuery'
        - $ref: '#/components/parameters/marketData_sortAsc'
        - $ref: '#/components/parameters/marketData_periodQuery'
        - $ref: '#/components/parameters/marketData_from'
        - $ref: '#/components/parameters/marketData_till'
        - $ref: '#/components/parameters/marketData_limit10'
        - $ref: '#/components/parameters/marketData_offset'
        - $ref: '#/components/parameters/marketData_pool'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Candle'
                example:
                  BTCUSDT:
                    - timestamp: '2021-07-01T20:00:00.000Z'
                      open: '33079.93'
                      close: '33236.53'
                      min: '33079.93'
                      max: '33295.73'
                      volume: '146.86223'
                      volumeQuote: '4877838.3025063'
                  ETHBTC:
                    - timestamp: '2021-07-01T20:00:00.000Z'
                      open: '0.063420'
                      close: '0.063767'
                      min: '0.063403'
                      max: '0.063782'
                      volume: '866.6776'
                      volumeQuote: '55.2132903904'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/candles/{symbol}:
    get:
      tags:
        - Candles
      summary: Get candles for a specific symbol.
      description: Returns candles for a specific symbol.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolPath'
        - $ref: '#/components/parameters/marketData_sortAsc'
        - $ref: '#/components/parameters/marketData_periodQuery'
        - $ref: '#/components/parameters/marketData_from'
        - $ref: '#/components/parameters/marketData_till'
        - $ref: '#/components/parameters/marketData_limit100'
        - $ref: '#/components/parameters/marketData_offset'
        - $ref: '#/components/parameters/marketData_pool'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Candle'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/currency:
    get:
      tags:
        - Currency
      summary: Get currencies.
      description: Returns the actual list of available currencies, tokens, etc.
      parameters:
        - name: currencies
          in: query
          style: form
          explode: false
          description: A comma-separated list of currency codes.
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/marketData_extended'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Currency'
      security: []
  /public/currency/{currency}:
    get:
      tags:
        - Currency
      summary: Get currency.
      parameters:
        - $ref: '#/components/parameters/marketData_currencyPath'
        - $ref: '#/components/parameters/marketData_extended'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Currency'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/history:
    get:
      tags:
        - Price History
      summary: Get prices history.
      description: Returns quotation prices history.
      parameters:
        - name: from
          in: query
          description: Source currency code.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Target currency code.
          schema:
            type: string
        - name: since
          in: query
          description: Interval initial value.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Interval end value.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: >
            The number of items to return. The limit can range between *1* and
            *1000*.
          schema:
            maximum: 1000
            minimum: 1
            type: integer
            default: 1
        - $ref: '#/components/parameters/marketData_periodQuery'
        - $ref: '#/components/parameters/marketData_sortDesc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_PriceHistory'
                example:
                  ETH:
                    currency: BTC
                    history:
                      timestamp: '2021-07-01T20:00:00.000Z'
                      open: '0.063420'
                      close: '0.063767'
                      min: '0.063403'
                      max: '0.063782'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/mapping/currency:
    get:
      tags:
        - Mapping
      summary: Get currencies' mappings.
      parameters:
        - name: currencies
          in: query
          style: form
          explode: false
          description: A comma-separated list of currency codes.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_CurrencyMapping'
      security: []
  /public/mapping/symbol:
    get:
      tags:
        - Mapping
      summary: Get symbols' mappings.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolsQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_SymbolMapping'
      security: []
  /public/orderbook/{symbol}:
    get:
      tags:
        - Orderbook
      summary: Get order book by symbol.
      description: The request returns an order book for a specific symbol.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolPath'
        - name: limit
          in: query
          description: The number of items to return.
          schema:
            type: integer
            default: 100
        - name: volume
          in: query
          description: Desired volume for market depth search.
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Orderbook'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/rate:
    get:
      tags:
        - Rate
      summary: Get prices.
      description: Returns currencies quotation prices.
      parameters:
        - name: from
          in: query
          description: Source currency code.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Target currency code.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Price'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/symbol:
    get:
      tags:
        - Symbol
      summary: Get symbols.
      description: >-
        Returns the actual list of symbols (currency pairs) traded on the
        exchange.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolsQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Symbol'
      security: []
  /public/symbol/{symbol}:
    get:
      tags:
        - Symbol
      summary: Get a specific symbol.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Symbol'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/ticker:
    get:
      tags:
        - Ticker
      summary: Get tickers.
      description: Returns ticker information.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolsQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Ticker'
      security: []
  /public/ticker/{symbol}:
    get:
      tags:
        - Ticker
      summary: Get ticker by symbol.
      description: Returns the ticker for a specific symbol.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Ticker'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/trades:
    get:
      tags:
        - Trades
      summary: Get trades.
      description: Returns trades information for all or multiple symbols.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolsQuery'
        - $ref: '#/components/parameters/marketData_byTimestamp'
        - $ref: '#/components/parameters/marketData_sortDesc'
        - $ref: '#/components/parameters/marketData_from'
        - $ref: '#/components/parameters/marketData_till'
        - $ref: '#/components/parameters/marketData_limit10'
        - $ref: '#/components/parameters/marketData_offset'
        - $ref: '#/components/parameters/marketData_pool'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/marketData_Trades'
                example:
                  BTCUSDT:
                    - id: 782135488
                      price: '9793.94'
                      quantity: '0.21469'
                      side: sell
                      timestamp: '2021-06-24T12:54:41.972Z'
                  ETHBTC:
                    - id: 782135414
                      price: '0.027668'
                      quantity: '0.069'
                      side: buy
                      timestamp: '2021-06-24T12:54:32.843Z'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /public/trades/{symbol}:
    get:
      tags:
        - Trades
      summary: Returns trades information for a specific symbol.
      parameters:
        - $ref: '#/components/parameters/marketData_symbolPath'
        - $ref: '#/components/parameters/marketData_sortDesc'
        - $ref: '#/components/parameters/marketData_byTimestamp'
        - $ref: '#/components/parameters/marketData_from'
        - $ref: '#/components/parameters/marketData_till'
        - $ref: '#/components/parameters/marketData_limit100'
        - $ref: '#/components/parameters/marketData_offset'
        - $ref: '#/components/parameters/marketData_pool'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Trades'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
  /sub-acc:
    get:
      tags:
        - Subaccounts
      summary: Get subaccounts.
      description: |
        **Permission:** *SubAccReadWrite*

        Returns a list of user's subaccounts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccountResponse'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/freeze:
    post:
      tags:
        - Subaccounts
      summary: Freeze subaccounts.
      description: |
        **Permission:** *SubAccReadWrite*
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: uint64
                  description: A comma-separated list of subaccounts to freeze.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: boolean
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/activate:
    post:
      tags:
        - Subaccounts
      summary: Activate subaccounts.
      description: |
        **Permission:** *SubAccReadWrite*
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    format: uint64
                  description: A comma-separated list of subaccounts to activate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: boolean
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/transfer:
    post:
      tags:
        - Subaccounts
      summary: Transfer funds between a super account and a subaccount.
      description: |
        **Permission:** *BankWithdraw*
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubAccTransfer'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: string
                    example: f4fa539f-627d-4ab9-b1aa-5f69c5ee197b
                    description: Transaction unique identifier as assigned by the exchange.
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/acl:
    get:
      tags:
        - Subaccounts
      summary: Get subaccounts' ACL.
      description: |
        **Permission:** *BankAccess*
      parameters:
        - name: subAccountIds
          in: query
          style: form
          explode: false
          schema:
            type: integer
            format: uint64
          description: A comma-separated list of subaccounts.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccACLResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/acl/{userId}:
    put:
      tags:
        - Subaccounts
      summary: Set an ACL for the subaccount.
      description: |
        **Permission:** *BankAccess*
      parameters:
        - $ref: '#/components/parameters/wallet_userIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_SubAccACLRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/wallet_SubAccACLResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/balance/{userId}:
    get:
      tags:
        - Subaccounts
      summary: Get subaccount balance.
      description: |
        **Permission:** *BankAccess*
      parameters:
        - $ref: '#/components/parameters/wallet_userIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_SubAccountBalanceResponse'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /sub-acc/deposit-address/{userId}/{currency}:
    get:
      tags:
        - Subaccounts
      summary: Get subaccount deposit address.
      description: |
        **Permission:** *SubAccReadWrite*

        Creates a deposit address if no existing address is found.
      parameters:
        - $ref: '#/components/parameters/wallet_userIdPath'
        - $ref: '#/components/parameters/wallet_currencyPath'
        - $ref: '#/components/parameters/wallet_networkCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_CryptoAddress'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /account/transfer/internal:
    post:
      tags:
        - Account
      summary: Create a new transfer by email or username.
      description: |
        **Permission:** *BankWithdraw*
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_AccountTransferInternalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  result:
                    type: string
                    example: f4fa539f-627d-4ab9-b1aa-5f69c5ee197b
                    description: Transaction unique identifier as assigned by the exchange.
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /account/crypto/addresses/{currency}:
    get:
      tags:
        - Crypto Address
      summary: Get the last 10 deposit crypto addresses.
      description: |
        **Permission:** *BankAccess*

        Returns the last 10 unique addresses used for deposits (by currency).
      parameters:
        - $ref: '#/components/parameters/wallet_currencyPath'
        - $ref: '#/components/parameters/wallet_networkCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/wallet_CryptoAddress'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /account/crypto/used-addresses/{currency}:
    get:
      tags:
        - Crypto Address
      summary: Get last 10 withdrawal crypto addresses.
      description: |
        **Permission:** *BankAccess*

        Returns the last 10 unique addresses used for withdrawals (by currency).
      parameters:
        - $ref: '#/components/parameters/wallet_currencyPath'
        - $ref: '#/components/parameters/wallet_networkCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/wallet_CryptoAddress'
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /account/crypto/estimate-withdraw-levels:
    get:
      tags:
        - Withdraw
      summary: Get estimate levels for withdrawal.
      description: |
        **Permission:** *BankAccess*
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: Currency code.
        - name: amount
          in: query
          required: true
          schema:
            type: string
          description: The amount that will be withdrawn.
        - name: networkCode
          in: query
          schema:
            type: string
          description: Network code.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: >-
                    #/components/schemas/wallet_GetAccountEstimateWithdrawalLevelsResponse
        '400':
          $ref: '#/components/responses/wallet_BadRequestError'
        '401':
          $ref: '#/components/responses/wallet_UnauthorizedError'
        '403':
          $ref: '#/components/responses/wallet_ForbiddenError'
        '404':
          $ref: '#/components/responses/wallet_NotFoundError'
        '500':
          $ref: '#/components/responses/wallet_InternalServerError'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
        - wallet_BearerAuth: []
        - wallet_BasicAuth: []
  /account/features:
    get:
      tags:
        - Account
      summary: Get user's features.
      description: |
        **Permission:** *SubAccReadWrite*
      responses:
        '200':
