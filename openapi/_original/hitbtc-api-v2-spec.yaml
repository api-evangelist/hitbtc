        **Permission:** *BankAccess*
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: |
            Sort order:
             * Ascending, from A to Z.
             * Descending, from Z to A.
        - name: offset
          in: query
          schema:
            type: integer
            format: uint64
          description: >-
            The number of items to skip before starting to collect the result
            set.
        - name: limit
          in: query
          schema:
            type: integer
            format: uint64
            default: 100
          description: The number of items to return.
        - name: showSenders
          in: query
          schema:
            type: boolean
            default: false
            nullable: true
          description: >-
            A flag indicating whether to show a list of senders' blockchain
            addresses. Only for deposits.
        - name: currency
          in: query
          schema:
            type: string
          description: Currency code.
        - name: by
          in: query
          schema:
            type: string
            enum:
              - index
              - timestamp
            default: timestamp
          description: The name of the field to order the results by.
        - name: from
          in: query
          schema:
            type: string
          description: Timestamp of transaction or transaction index to list from.
        - name: till
          in: query
          schema:
            type: string
          description: Timestamp of transaction or transaction index to list till.
