        - trading_BasicAuth: []
        - trading_BearerAuth: []
components:
  parameters:
    marketData_symbolPath:
      name: symbol
      in: path
      required: true
      description: Symbol code.
      schema:
        type: string
    marketData_currencyPath:
      name: currency
      in: path
      required: true
      description: Currency code.
      schema:
        type: string
    marketData_symbolsQuery:
      name: symbols
      in: query
      style: form
      explode: false
      description: A comma-separated list of symbol codes.
      schema:
        type: array
        items:
          type: string
    marketData_sortAsc:
      name: sort
      in: query
      description: |
        Sort order:
         * Ascending, from A to Z.
         * Descending, from Z to A.
      schema:
        type: string
        default: ASC
        enum:
          - DESC
          - ASC
    marketData_sortDesc:
      name: sort
      in: query
      description: |
        Sort order:
         * Ascending, from A to Z.
         * Descending, from Z to A.
      schema:
        type: string
        default: DESC
        enum:
          - DESC
          - ASC
    marketData_from:
      name: from
      in: query
      description: Interval initial value.
      schema:
        type: string
        format: date-time
    marketData_till:
      name: till
      in: query
      description: Interval end value.
      schema:
        type: string
        format: date-time
    marketData_periodQuery:
      name: period
      in: query
      description: |
        History time period:
          * *M\** — minutes;
          * *H\** — hours;
          * *D\** — days;
          * *1M* — one month.
      schema:
        type: string
        default: M30
        enum:
          - M1
          - M3
          - M5
          - M15
          - M30
          - H1
          - H4
          - D1
          - D7
          - 1M
    marketData_limit10:
      name: limit
      in: query
      description: >
        The number of items to return. The limit can range between *1* and
        *1000*.
      schema:
        maximum: 1000
        minimum: 1
        type: integer
        default: 10
    marketData_limit100:
      name: limit
      in: query
      description: >
        The number of items to return. The limit can range between *1* and
        *1000*.
      schema:
        maximum: 1000
        minimum: 1
        type: integer
        default: 100
    marketData_offset:
      name: offset
      in: query
      description: >
        The number of items to skip before starting to collect the result set.
        Offset can range between *0* and *100000*.
      schema:
        maximum: 100000
        minimum: 0
        type: integer
        default: 0
    marketData_pool:
      name: exclude_pool
      in: query
      description: Flag indicating whether to return trades for a single broker.
      schema:
        type: boolean
    marketData_byTimestamp:
      name: by
      in: query
      description: The name of the field to order the results by.
      schema:
        type: string
        default: timestamp
        enum:
          - timestamp
          - id
    marketData_extended:
      name: extended
      in: query
      description: >
        A flag indicating whether to display all fields. If `false`, only the
        following fields will be returned:
            - *id*
            - *fullName*
            - *crypto*
            - *payinEnabled*
            - *payinPaymentId*
            - *payoutEnabled*
            - *payoutIsPaymentId*
            - *transferEnabled*
            - *delisted*
            - *payinConfirmations*
            - *payoutFee*
            - *precisionPayout*
            - *precisionTransfer*
            - *lowProcessingTime*
            - *highProcessingTime*
            - *avgProcessingTime*
      schema:
        type: boolean
        default: false
    wallet_userIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: User identifier.
    wallet_currencyPath:
      name: currency
      in: path
      required: true
      schema:
        type: string
      description: Currency code.
    wallet_networkCode:
      name: network_code
      in: query
      schema:
        type: string
      description: Network code.
    wallet_providerIdPath:
      name: providerId
      in: path
      required: true
      schema:
        type: integer
        format: uint64
      description: Provider identifier.
    trading_symbolQuery:
      name: symbol
      in: query
      schema:
        type: string
      description: Symbol code.
    trading_symbolPath:
      name: symbol
      in: path
      required: true
      schema:
        type: string
      description: Symbol code.
    trading_clOrderIdPath:
      name: clientOrderId
      in: path
      required: true
      schema:
        type: string
      description: Unique order identifier given by a trader or the system.
    trading_clientOrderIdQuery:
      name: clientOrderId
      in: query
      schema:
        type: string
      description: Unique order identifier given by a trader or the system.
    trading_limitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: The number of items to return.
    trading_offsetQuery:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100000
      description: The number of items to skip before starting to collect the result set.
    trading_fromQuery:
      name: from
      in: query
      schema:
        type: integer
        format: uint64
      description: Date and time to start history with.
    trading_tillQuery:
      name: till
      in: query
      schema:
        type: integer
        format: uint64
      description: Date and time to end history with.
    trading_sortQuery:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - ASC
          - DESC
        default: ASC
      description: Sort order.
  responses:
    marketData_BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/marketData_Error'
    marketData_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/marketData_Error'
    wallet_BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/wallet_Error'
    wallet_UnauthorizedError:
      description: Authorization is required or has been failed
