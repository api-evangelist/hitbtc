      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Error'
    trading_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Error'
  schemas:
    marketData_Candle:
      required:
        - close
        - max
        - min
        - open
        - timestamp
        - volume
        - volumeQuote
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2021-07-01T20:00:00.000Z'
          description: Candle timestamp.
        open:
          type: string
          example: '33079.93'
          description: Open price.
        close:
          type: string
          example: '33236.53'
          description: Closing price.
        min:
          type: string
          example: '33079.93'
          description: The lowest price for the period.
        max:
          type: string
          example: '33295.73'
          description: The highest price for the period.
        volume:
          type: string
          example: '146.86223'
          description: Volume in base currency.
        volumeQuote:
          type: string
          example: '4877838.3025063'
          description: Volume in quote currency.
    marketData_Currency:
      required:
        - id
        - fullName
        - crypto
        - payinEnabled
        - payinPaymentId
        - payoutEnabled
        - payoutIsPaymentId
        - transferEnabled
        - delisted
        - payinConfirmations
        - payoutFee
        - precisionPayout
        - precisionTransfer
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Currency identifier.
        fullName:
          type: string
          nullable: true
          description: Full currency name.
        crypto:
          type: boolean
          description: Determines whether the currency belongs to a blockchain.
        payinEnabled:
          type: boolean
          description: >-
            Determines whether it is allowed to generate addresses for a
            deposit.
        payinPaymentId:
          type: boolean
          description: >-
            Determines whether it is required to provide additional information
            other than the address for a deposit.
        payoutEnabled:
          type: boolean
          description: Determines whether the withdrawal is allowed.
        payoutIsPaymentId:
          type: boolean
          description: >-
            Determines whether providing additional information for the
            withdrawal is allowed.
        transferEnabled:
          type: boolean
          description: >-
            Determines whether the transfer between trading account and wallet
            account is allowed (may be disabled on a maintenance).
        delisted:
          type: boolean
          default: false
          description: An indication of whether the currency was delisted.
        payinConfirmations:
          type: number
          description: Count of confirmations for the transaction.
        payoutFee:
          type: string
          nullable: true
          description: Default withdrawal fee.
        precisionPayout:
          type: number
          description: >-
            Currency precision for the payout (accepted number of digits after
            the decimal point).
        precisionTransfer:
          type: number
          description: >-
            Currency precision for transfer (accepted number of digits after the
            decimal point).
        lowProcessingTime:
          type: string
          nullable: true
          description: The lowest processing time in seconds for the payout operation.
        highProcessingTime:
          type: string
          nullable: true
          description: The highest processing time in seconds for the payout operation.
        avgProcessingTime:
          type: string
          nullable: true
          description: The average processing time in seconds for the payout operation.
        tokenFamily:
          type: string
          nullable: true
          description: Token group.
        sign:
          type: string
          nullable: true
          description: Currency sign.
        cryptoPaymentIdName:
          type: string
          nullable: true
          description: >-
            Transaction identifier, e.g., comment, message, memo, attachment,
            etc.
        cryptoType:
          type: string
          nullable: true
          description: Type of crypto platform.
        qrPrefix:
          type: string
          nullable: true
          description: >-
            QR prefix. The prefix is used to indicate the currency in a deposit
            address.
        cryptoExplorer:
          type: string
          nullable: true
          description: >-
            Link to the currency explorer with "{tx}" placeholder instead of
            hash.
        category:
          type: string
          nullable: true
          description: Currency category.
        isInstrumentsStable:
          type: boolean
          description: >-
            If `true`, the pairs of this currency are displayed on the Stable
            tab.
        accountTopOrder:
          type: number
          description: The order in which the user sees the currencies on the Account page.
    marketData_PriceHistory:
      required:
        - currency
        - history
      type: object
      properties:
        currency:
          type: string
          nullable: true
          example: BTC
          description: Quote currency code.
        history:
          required:
            - close
            - max
            - min
            - open
            - timestamp
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
              example: '2021-07-01T20:00:00.000Z'
              description: Last update or refresh price timestamp.
            open:
              type: string
              nullable: true
              example: '0.063420'
              description: Open price.
            close:
              type: string
              nullable: true
              example: '0.063767'
              description: Closing price.
            min:
              type: string
              nullable: true
              example: '0.063403'
              description: The lowest price for the period.
            max:
              type: string
              nullable: true
              example: '0.063782'
              description: The highest price for the period.
    marketData_CurrencyMapping:
      required:
        - id
        - coreId
        - fullName
      properties:
        id:
          type: string
          nullable: true
          description: Currency API code.
        coreId:
          type: string
          nullable: true
          description: Currency exchange code.
        fullName:
          type: string
          nullable: true
          description: Full currency name.
    marketData_SymbolMapping:
      required:
        - id
        - baseCurrency
        - quoteCurrency
        - feeCurrency
        - quantityIncrement
        - tickSize
        - coreId
        - coreBaseCurrency
        - coreQuoteCurrency
        - coreFeeCurrency
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Symbol identifier.
        coreId:
          type: integer
          nullable: true
          description: Symbol identifier in the Matching Engine.
        baseCurrency:
          type: string
          nullable: true
          description: Base currency code.
        coreBaseCurrency:
          type: string
          nullable: true
          description: Base currency code in the Matching Engine.
        quoteCurrency:
          type: string
          nullable: true
          description: Quote currency code.
        coreQuoteCurrency:
          type: string
          nullable: true
          description: Quote currency code in the Matching Engine.
        feeCurrency:
          type: string
          nullable: true
          description: Currency used for charging fees.
        coreFeeCurrency:
          type: string
          nullable: true
          description: Exchange code of currency used for charging fees.
        quantityIncrement:
          type: string
          nullable: true
          description: Quantity should be divided by this value with no remainder.
        tickSize:
          type: string
          nullable: true
          description: Price should be divided by this value with no remainder.
    marketData_Orderbook:
      required:
        - symbol
        - timestamp
        - batchingTime
        - ask
        - bid
      type: object
      properties:
        symbol:
          type: string
          nullable: true
          description: Symbol code.
        timestamp:
          type: string
          format: date-time
          example: '2021-06-11T11:18:03.857366871Z'
          description: Order timestamp.
        batchingTime:
          type: string
          format: date-time
          description: Time the message was transmitted.
        ask:
          type: array
          items:
            type: array
            items:
              type: string
              example: '9777.5'
          description: Ask side array of levels.
        bid:
          type: array
          items:
            type: array
            items:
              type: string
              example: '9777.5'
          description: Bid side array of levels.
    marketData_Price:
      required:
        - currency
        - price
        - timestamp
      type: object
      properties:
        currency:
          type: string
          nullable: true
          example: BTC
          description: Quote currency code.
        price:
          type: string
          nullable: true
          example: '0.021084'
          description: Quotation price.
        timestamp:
          type: string
          format: date-time
          example: '2021-06-02T17:52:36.731Z'
          description: Last update or refresh price timestamp.
    marketData_Symbol:
      required:
        - id
        - baseCurrency
        - quoteCurrency
        - quantityIncrement
        - tickSize
        - feeCurrency
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Symbol code.
        baseCurrency:
          type: string
          nullable: true
          example: ETH
          description: Name (code) of the base currency.
        quoteCurrency:
          type: string
          nullable: true
          example: USDT
          description: Name (code) of the quote currency.
        quantityIncrement:
          type: string
          nullable: true
          example: '0.00001'
          description: Symbol quantity should be divided by this value with no remainder.
        tickSize:
          type: string
          nullable: true
          example: '0.01'
          description: Symbol price should be divided by this value with no remainder.
        takeLiquidityRate:
          type: string
          nullable: true
          example: '0.002'
          default: 0.002
          description: Default fee rate.
        provideLiquidityRate:
          type: string
          nullable: true
          example: '0.001'
          default: 0.001
          description: Default fee rate for the market making trades.
        feeCurrency:
          type: string
          nullable: true
          example: USDT
          description: Currency in which fees are determined.
        marginTrading:
          type: boolean
          description: Determines whether the margin trading is available.
        maxInitialLeverage:
          type: string
          nullable: true
          example: '100.00'
          description: >-
            The maximum leverage available to the user for margin trading. Shown
            only if `"margin_trading"` is `true`.
    marketData_Ticker:
      required:
        - symbol
        - ask
        - bid
        - high
        - last
        - low
        - open
        - timestamp
        - volume
        - volumeQuote
      type: object
      properties:
        symbol:
          type: string
          nullable: true
          description: Symbol code.
        ask:
          type: string
          nullable: true
          example: '0.050043'
          description: Best ask price.
        bid:
          type: string
          nullable: true
          example: '0.050042'
          description: Best bid price.
        last:
          type: string
          nullable: true
          example: '0.050042'
          description: Last trade price.
        low:
          type: string
          nullable: true
          example: '0.047052'
          description: The lowest trade price within 24 hours.
        high:
          type: string
          nullable: true
          example: '0.051679'
          description: The highest trade price within 24 hours.
        open:
          type: string
          nullable: true
          example: '0.047800'
          description: Last trade price 24 hours ago.
        volume:
          type: string
          nullable: true
          example: '36456.720'
          description: Total trading amount within 24 hours in base currency.
        volumeQuote:
          type: string
          nullable: true
          example: '1782.625000'
          description: Total trading amount within 24 hours in quote currency.
        timestamp:
          type: string
          format: date-time
          example: '2021-06-12T14:57:19.999Z'
          description: Last update or refresh ticker timestamp.
    marketData_Trades:
      type: array
      items:
        $ref: '#/components/schemas/marketData_Trade'
    marketData_Trade:
      required:
        - id
        - price
        - quantity
        - side
        - timestamp
      type: object
      properties:
        id:
          type: integer
          example: 782135488
          description: Trade identifier.
        price:
          type: string
          example: '9793.94'
          description: Trade price.
        quantity:
          type: string
          example: '0.21469'
          description: Trade quantity.
        side:
          type: string
          example: sell
          enum:
            - sell
            - buy
          description: Trade side.
        timestamp:
          type: string
          format: date-time
          example: '2021-06-24T12:54:41.972Z'
          description: Trade timestamp.
    marketData_Error:
      required:
        - error
      type: object
      properties:
        error:
          required:
            - code
            - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    wallet_SubAccountResponse:
      required:
        - id
        - email
        - status
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: User identifier.
        email:
          type: string
          description: User's email address.
        status:
          type: string
          enum:
            - new
            - active
            - disable
          description: |
            User account status:
              * *new*—account is created, but not confirmed by email;
              * *active*—account is fully functioning;
              * *disable*—account is disabled.
    wallet_SubAccTransfer:
      required:
        - subAccountId
        - currency
        - amount
        - type
      type: object
      properties:
        subAccountId:
          type: integer
          format: uint64
          description: Subaccount identifier.
        currency:
          type: string
          description: Currency code.
        amount:
          type: string
          description: The amount that will be transferred.
        type:
          type: string
          enum:
            - deposit
            - withdraw
          description: Transfer type.
    wallet_SubAccACLResponse:
      allOf:
        - properties:
            subAccountId:
              type: integer
              format: uint64
              description: Subaccount identifier.
        - $ref: '#/components/schemas/wallet_SubAccACLRequest'
        - required:
            - subAccountId
            - isPayoutEnabled
            - description
    wallet_SubAccACLRequest:
      type: object
      properties:
        isPayoutEnabled:
          type: boolean
          description: Permission to create payout.
        description:
          type: string
          description: Text description for the ACL setting.
    wallet_SubAccountBalanceResponse:
      required:
        - main
        - trading
      type: object
      properties:
        main:
          $ref: '#/components/schemas/wallet_BalanceResponse'
        trading:
          $ref: '#/components/schemas/wallet_BalanceResponse'
    wallet_BalanceResponse:
      required:
        - currency
        - available
        - reserved
      type: object
      properties:
        currency:
          type: string
          description: Currency code.
        available:
          type: string
          description: Amount available for withdrawals or transfers.
        reserved:
          type: string
          description: Amount reserved for incomplete transactions.
    wallet_CryptoAddress:
      required:
        - address
      type: object
      properties:
        address:
          type: string
          description: Wallet address.
        paymentId:
          type: string
          description: Payment identifier.
        publicKey:
          type: string
          description: Public key.
    wallet_AccountTransferInternalRequest:
      required:
        - currency
        - by
        - identifier
        - amount
      type: object
      properties:
        currency:
          type: string
          description: Currency code.
        by:
          type: string
          enum:
            - email
            - username
          description: Type of the beneficiary identifier.
        identifier:
          type: string
          description: Beneficiary identifier value. Either email or username.
        amount:
          type: string
          description: The amount that will be transferred.
    wallet_GetAccountEstimateWithdrawalLevelsResponse:
      required:
        - feeLevelId
        - comment
        - fee
        - isDefault
      type: object
      properties:
        feeLevelId:
          type: integer
          example: 5
          description: Fee level number.
        comment:
          type: string
          example: fast
          description: Textual description.
        fee:
          type: string
          example: '0.0005'
          description: Fee rate.
        isDefault:
          type: boolean
          description: An indication of whether the level is set by default.
    wallet_UserFeatures:
      required:
        - fiatAllowed
        - primeTrustAllowed
        - hasPrimeTrust
      type: object
      properties:
        fiatAllowed:
          type: boolean
          description: An indication of whether the wire transfers are allowed for a user.
        primeTrustAllowed:
          type: boolean
          description: >-
            An indication of whether the Prime Trust wire transfers are allowed
            for a user.
        hasPrimeTrust:
          type: boolean
          description: An indication of whether the user has a Prime Trust account.
    wallet_CryptoProvider:
      required:
        - providerID
        - providerName
        - methods
      type: object
      properties:
        providerID:
          type: integer
          format: uint64
          description: Provider identifier.
        providerName:
          type: string
          description: Provider name.
        methods:
          type: array
          items:
            $ref: '#/components/schemas/wallet_PaymentMethod'
    wallet_PaymentMethodCurrency:
      required:
        - code
        - displayName
      type: object
      properties:
        code:
          type: string
          description: Currency code.
        displayName:
          type: string
          description: Displayed currency name.
        networkCode:
          type: string
          description: Network code.
    wallet_TransactionLimit:
      required:
        - currencyCode
        - min
        - max
        - sourceCode
        - targetCode
        - sourceMin
        - sourceMax
      type: object
      properties:
        currencyCode:
          type: string
          description: Currency code of limits (fiat).
        min:
          type: string
          description: Target currency minimum amount.
        max:
          type: string
          description: Target currency maximum amount.
        sourceCode:
          type: string
          description: Source currency code.
        targetCode:
          type: string
          description: Target currency code.
        sourceMin:
          type: string
          description: Source currency minimum amount.
        sourceMax:
          type: string
          description: Source currency maximum amount.
        networkCode:
          type: string
          description: Network code.
    wallet_PricesResponse:
      required:
        - prices
        - spotPrice
      type: object
      properties:
        spotPrice:
          type: number
          example: '10268.74'
          description: The spot price.
        prices:
          type: array
          items:
            $ref: '#/components/schemas/wallet_Price'
    wallet_Price:
      required:
        - paymentMethodId
        - sourceAmount
        - targetCode
        - targetAmount
        - sourceCode
        - type
        - spotPriceFee
        - spotPriceIncludingFee
        - feeAmount
      type: object
      properties:
        paymentMethodId:
          type: integer
          format: uint64
          example: 6025
          description: Payment method identifier.
        type:
          type: string
          description: Payment method type.
        spotPriceFee:
          type: number
          description: The fee charged on the spot price.
        spotPriceIncludingFee:
          type: number
          description: The adjusted spot price including the fee.
        targetCode:
          type: string
          example: BTC
          description: Target currency code.
        targetAmount:
          type: number
          example: '1'
          description: Amount in the target currency.
        sourceCode:
          type: string
          example: USD
          description: Source currency code.
        sourceAmount:
          type: number
          example: '10472.06'
          description: Amount in the source currency.
        feeAmount:
          type: number
          description: The fees calculated on the fiat amount.
    wallet_Order:
      type: object
      required:
        - id
        - providerId
        - orderType
        - sourceCode
        - targetCode
        - walletAddress
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: uint64
          description: Order identifier.
        providerId:
          type: integer
          format: uint64
          description: Provider identifier.
        orderType:
          type: string
          description: Order type.
          example: buy
        sourceCode:
          type: string
          description: Source currency code.
        targetCode:
          type: string
          description: Target currency code.
        walletAddress:
          type: string
          description: >-
            The user will receive cryptocurrency from the crypto provider to
            this address.
        checkoutURL:
          type: string
          nullable: true
          description: Checkout URL.
        checkoutHTML:
          type: string
          nullable: true
          description: Checkout HTML.
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp.
        status:
          type: string
          description: Order status.
          enum:
            - initial
            - in_progress
            - completed
            - failed
            - expired
    wallet_Transaction:
      allOf:
        - required:
            - id
            - index
            - type
            - status
            - currency
            - amount
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              description: Transaction identifier.
            index:
              type: integer
              format: uint64
              description: Last update sequence identifier.
            type:
              type: string
              description: Transaction type.
              enum:
                - DEPOSIT
                - WITHDRAW
                - TRANSFER
                - SWAP
                - OTC
                - PRIMETRUST_DEPOSIT
                - PRIMETRUST_WITHDRAWAL
                - PRIMETRUST_TRANSFER
            subType:
              type: string
              description: Transaction subtype.
              enum:
                - UNCLASSIFIED
                - BLOCKCHAIN
                - AIRDROP
                - AFFILIATE
                - STAKING
                - BUY_CRYPTO
                - OFFCHAIN
                - FIAT
                - SUB_ACCOUNT
                - WALLET_TO_SPOT
                - SPOT_TO_WALLET
                - WALLET_TO_DERIVATIVES
                - DERIVATIVES_TO_WALLET
                - CHAIN_SWITCH_FROM
                - CHAIN_SWITCH_TO
                - INSTANT_EXCHANGE
            status:
              type: string
              description: Transaction status.
            currency:
              type: string
              description: Currency code.
            amount:
              type: string
              description: Amount of funds.
            fee:
              type: string
              description: Payment commission value.
            createdAt:
              type: string
              description: Date and time of the transaction creation.
            updatedAt:
              type: string
              description: Date and time of the last transaction update.
            hash:
              type: string
              description: Transaction blockchain hash.
            attemptHashes:
              type: array
              description: >-
                List of hashes of attempts to send a transaction to the
                blockchain.
              items:
                type: string
            address:
              type: string
              description: Address used by both blockchain and off-chain payouts.
            paymentId:
              type: string
              description: >-
                Payment identifier used by both blockchain and off-chain
                payouts.
            offchainId:
              type: string
              description: Transaction identifier of an external system.
            confirmations:
              type: integer
              nullable: true
              description: Current count of confirmations for transaction.
            publicComment:
              type: string
              description: A text comment for the transaction.
            errorCode:
              type: string
              enum:
                - INVALID_ADDRESS
                - INVALID_PAYMENT_ID
                - BAD_PRECISION
              description: Error reason.
            senders:
              type: array
              items:
                type: string
              description: A list of senders' blockchain addresses.
            commitRisk:
              type: object
              required:
                - score
                - rbf
                - lowFee
              properties:
                score:
                  type: integer
                  format: uint64
                  nullable: true
                  minimum: 0
                  maximum: 100
                  description: >
                    Risk score that decreases non-linearly when the transaction
                    gains confirmations.


                    ℹ️ Scores from 0 to 50 imply the transaction may be
                    considered committed (but it is not guaranteed) or it may
                    take at least half an hour otherwise.
                rbf:
                  type: boolean
                  nullable: true
                  description: >
                    Flag indicating whether the transaction did not gain a
                    sufficient number of confirmations and may be replaced by
                    another one with different fees.


                    ⚠️ This value indicates the transaction is complete and do
                    not affect the score.


                    ℹ️ `false` value along with a score above 50 gives a good
                    chance that the transaction is irreversible.
                lowFee:
                  type: boolean
                  nullable: true
                  description: >
                    Flag indicating whether the actual network fee is lower than
                    the estimated one.


                    ⚠️ This value indicates the difference between the estimated
                    fee and the actual paid fee and does not affect the score.
    wallet_WithdrawRequest:
      allOf:
        - required:
            - address
            - amount
            - currency
        - properties:
            currency:
              type: string
              description: Currency code.
            amount:
              type: number
              description: The amount that will be sent to the specified address.
            address:
              type: string
              description: Address identifier.
            paymentId:
              type: string
              description: >-
                An additional identifier for specific currencies (for example,
                "Memo").
            includeFee:
              type: boolean
              description: >-
                If `true`, the sender is willing to include fee expenses to the
                amount of operation, so the beneficiary will receive the sum
                reduced by fees.
              nullable: true
            autoCommit:
              type: boolean
              description: >-
                If `false`, then you should commit or rollback a transaction in
                an hour. After 1 hour, the transaction will automatically be
                rolled back.
              nullable: true
            useOffchain:
              type: string
              description: >
                Whether the withdrawal may be committed off-chain.

                If "required" is selected, then only off-chain transaction can
                be created.
              enum:
                - never
                - optionally
                - required
              default: never
            feeLevelId:
              type: integer
              description: Commission level (the level affects the speed of transactions).
            publicComment:
              type: string
              description: Text comment to transaction.
              maxLength: 255
            networkCode:
              type: string
              description: Network code.
    wallet_TransactionResult:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          example: d2ce578f-647d-4fa0-b1aa-4a27e5ee597b
          description: Transaction unique identifier as assigned by the exchange.
    wallet_Result:
      type: object
      required:
        - result
      properties:
        result:
          type: boolean
    wallet_TransferRequest:
      required:
        - amount
        - currency
        - type
      type: object
      properties:
        currency:
          type: string
          description: Currency code.
        amount:
          type: number
          description: The amount that will be transferred between accounts.
        type:
          type: string
          enum:
            - exchangeToBank
            - bankToExchange
          description: |
            Transfer type:
              * *exchangeToBank*—from the trading account to the main account;
              * *bankToExchange*—from the main account to the trading account.
    wallet_AddressResponse:
      required:
        - address
      type: object
      properties:
        address:
          type: string
          example: 3E8WKmTJzaTsBc4kvuEJVjPNtak6vQRcRv
          description: Address for deposits.
        paymentId:
          type: string
          description: >-
            An additional identifier for specific currencies (for example,
            "Memo").
        publicKey:
          type: string
          description: Public key.
        networkCode:
          type: string
          description: Network code.
        currency:
          type: string
          example: BTC
          description: Currency code.
    wallet_CheckOffchainRequest:
      required:
        - address
        - currency
      type: object
      properties:
        currency:
          type: string
          description: Currency code.
        address:
          type: string
          description: Address identifier.
        paymentId:
          type: string
          description: >-
            An additional identifier for specific currencies (for example,
            "Memo").
    wallet_TransferConvertRequest:
      required:
        - amount
        - fromCurrency
        - toCurrency
      type: object
      properties:
        fromCurrency:
          type: string
          description: Source currency code.
        toCurrency:
          type: string
          description: Target currency code.
        amount:
          type: number
          description: The amount that will be sent to the specified address.
    wallet_Error:
      required:
        - error
      type: object
      properties:
        error:
          required:
            - code
            - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_UserOrderInfo:
      required:
        - id
        - clientOrderId
        - symbol
        - side
        - status
        - type
        - timeInForce
        - quantity
        - postOnly
        - cumQuantity
        - createdAt
        - updatedAt
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Order identifier.
        clientOrderId:
          type: string
          description: Unique order identifier as assigned by the trader.
        symbol:
          type: string
          description: Symbol code.
        side:
          type: string
          enum:
            - sell
            - buy
          description: Trade side.
        status:
          type: string
          enum:
            - new
            - suspended
            - partiallyFilled
            - filled
            - canceled
            - rejected
            - expired
          description: |
            Order state:
              * *new*—an order is placed in the order book.
              * *suspended*—a `stopLimit`, `stopMarket`, `takeProfitLimit` or `takeProfitMarket` order is parked until it meets the conditions for placement in the order book.
              * *partiallyFilled*—an order is executed, but a part of its quantity is not filled yet.
              * *filled*—order quantity filled completely.
              * *canceled*—an order is canceled. It can either be done by a user through a cancel/replace request or by the system under specific circumstances.
              * *expired*—an order is deactivated after it no longer satisfies Time in Force (IOC, FOK) or Post Only requirements.
              * *rejected*—an order has been rejected.
        type:
          type: string
          enum:
            - market
            - limit
            - stopMarket
            - stopLimit
            - takeProfitLimit
            - takeProfitMarket
          description: Order type.
        timeInForce:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
            - Day
            - GTD
          description: >
            Order expiration mode:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is
            filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately.
            Any part of an IOC order that cannot be filled immediately will be
            canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and
            completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day
            (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified
            date.
        stopPrice:
          type: string
          description: >-
            The price level that triggers order activation. Specified if
            `"type"` is `stopLimit`, `stopMarket`, `takeProfitLimit`, or
            `takeProfitMarket`.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Specified if `"timeInForce"` is `GTD`.
        price:
          type: string
          description: Order price.
        quantity:
          type: string
          description: Order quantity.
        postOnly:
          type: boolean
          description: >
            A post-only order is an order that does not remove liquidity.


            If the post-only order would cause a match with a pre-existing order
            as a taker, then the order will be canceled
        closePosition:
          type: boolean
          description: |
            Flag indicating a stop market order must close a margin position
             when executed or be canceled otherwise.
        cumQuantity:
          type: string
          description: Executed order quantity.
        createdAt:
          type: string
          format: date-time
          description: Date of order's creation.
        updatedAt:
          type: string
          format: date-time
          description: Date of order's last update.
        tradesReport:
          type: array
          items:
            $ref: '#/components/schemas/trading_TradesReport'
    trading_TradesReport:
      required:
        - id
        - quantity
        - price
        - fee
        - timestamp
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Trade identifier.
        quantity:
          type: string
          description: Quantity of trade.
        price:
          type: string
          description: Trade price.
        fee:
          type: string
          description: Fee paid for trade.
        timestamp:
          type: string
          format: date-time
          description: Trade timestamp.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
    trading_NewOrderRequest:
      required:
        - symbol
        - side
        - quantity
      type: object
      properties:
        clientOrderId:
          type: string
          description: |
            Unique order identifier as assigned by the trader.
        symbol:
          type: string
          description: Symbol code.
        side:
          type: string
          enum:
            - sell
            - buy
          description: Trade side.
        type:
          type: string
          enum:
            - market
            - limit
            - stopMarket
            - stopLimit
            - takeProfitLimit
            - takeProfitMarket
          default: limit
          description: Order type.
        timeInForce:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
            - Day
            - GTD
          description: >
            Order expiration mode.


            Default:

            * `type` is `"market"`, `"stopMarket"`,
            `"takeProfitMarket"`—`"FOK"`;

            * `type` is `"limit"`, `"stopLimit"`, `"takeProfitLimit"`—`"GTC"`.


            Values:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is
            filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately.
            Any part of an IOC order that cannot be filled immediately will be
            canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and
            completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day
            (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified
            date.
        quantity:
          type: number
          description: Order quantity.
        price:
          type: number
          description: Order price.
        stopPrice:
          type: number
          description: >-
            The price level that triggers order activation. Required if `"type"`
            is `stopLimit`, `stopMarket`, `takeProfitLimit`, or
            `takeProfitMarket`.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Required if `"timeInForce"` is `GTD`.
        strictValidate:
          type: boolean
          description: >-
            Price and quantity will be checked for incrementation within the
            symbol’s tick size and quantity step.
        postOnly:
          type: boolean
          description: >
            A post-only order is an order that does not remove liquidity.

            If the post-only order would cause a match with a pre-existing order
            as a taker, then the order will be canceled
        closePosition:
          type: boolean
          default: false
          description: |
            Flag indicating a stop market order must close a margin position
             when executed or be canceled otherwise.

            Conditions: `quantity` is omitted.
        takeLiquidityMarkup:
          type: number
          description: Additional fee charged from a taker for high-risk operations.
        provideLiquidityMarkup:
          type: number
          description: Additional fee charged from a maker for high-risk operations.
    trading_ReplaceOrderRequest:
      required:
        - price
        - quantity
      type: object
      properties:
        quantity:
          type: number
          description: Order quantity.
        strictValidate:
          type: boolean
          description: >-
            Price and quantity will be checked for incrementation within the
            symbol’s tick size and quantity step.
        price:
          type: number
          description: Order price.
        requestClientId:
          type: string
          description: Unique request identifier.
    trading_UserMarginAccountInfo:
      required:
        - symbol
        - leverage
        - marginBalance
        - marginBalanceOrders
        - marginBalanceRequired
        - createdAt
        - updatedAt
      type: object
      properties:
        symbol:
          type: string
          description: >-
            Trading symbol, where base currency is the currency of funds
            reserved on the trading account for positions and quote currency is
            the currency of funds reserved on a margin account (e.g.,
            "BTCUSDT").
        leverage:
          type: string
          description: >-
            Margin leverage. The ratio of the trader's own funds to funds
            borrowed from the platform.
        marginBalance:
          type: string
          description: The total value of funds reserved for margin.
        marginBalanceOrders:
          type: string
          description: The value reserved for margin orders.
        marginBalanceRequired:
          type: string
          description: The value reserved for margin position close.
        createdAt:
          type: string
          format: date-time
          description: Account creation date and time.
        updatedAt:
          type: string
          format: date-time
          description: Account last update date and time.
        position:
          $ref: '#/components/schemas/trading_UserPositionInfo'
    trading_UserPositionInfo:
      required:
        - id
        - symbol
        - quantity
        - pnl
        - priceEntry
        - priceMarginCall
        - priceLiquidation
        - createdAt
        - updatedAt
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Position identifier.
        symbol:
          type: string
          description: Symbol code.
        quantity:
          type: string
          description: Position quantity.
        pnl:
          type: string
          description: Unrealized profit and loss.
        feeCumulative:
          type: string
          description: |
            Total amount of fees paid throughout the position lifetime until it
             is closed.

            Format: Decimal

            Values: `0` if a new position created

            ⚠️ This value does zero out after the position closes  and does not
             when it flips.
        priceEntry:
          type: string
          description: Average weighted price of position's open orders.
        priceMarginCall:
          type: string
          description: Margin call price.
        priceLiquidation:
          type: string
          description: Liquidation Price.
        createdAt:
          type: string
          format: date-time
          description: Position creation date and time.
        updatedAt:
          type: string
          format: date-time
          description: Position last update date and time.
    trading_PositionChangeRequest:
      type: object
      properties:
        marginBalance:
          type: number
          minimum: 0
          description: >-
            The total value of funds reserved for margin. Setting
            `"marginBalance"` to zero will close the margin account.
        strictValidate:
          type: boolean
          description: >-
            Price and quantity will be checked for incrementation within the
            symbol’s tick size and quantity step.
    trading_RestTradingBalance:
      required:
        - currency
        - available
        - reserved
      type: object
      properties:
        currency:
          type: string
          example: ETH
          description: Currency code.
        available:
          type: string
          example: '10.000000000'
          description: Amount available for trading or transfer to wallet.
        reserved:
          type: string
          example: '0.56'
          description: >-
            Total amount reserved for active orders and incomplete transfers to
            wallet.
    trading_TradeFee:
      required:
        - takeLiquidityRate
        - provideLiquidityRate
      type: object
      properties:
        takeLiquidityRate:
          type: string
          description: Take liquidity fee rate.
        provideLiquidityRate:
          type: string
          description: Provide liquidity fee rate.
    trading_HistoryOrder:
      required:
        - id
        - clientOrderId
        - symbol
        - side
        - status
        - type
        - timeInForce
        - quantity
        - cumQuantity
        - price
        - avgPrice
        - createdAt
        - updatedAt
        - margin_mode
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 828680665
          description: Unique order identifier as assigned by the exchange.
        clientOrderId:
          type: string
          example: f4307c6e507e49019907c917b6d7a084
          description: >-
            Unique order identifier as assigned by the trader. The order history
            may list several orders with the same `"clientOrderId"`.
        symbol:
          type: string
          example: ETHBTC
          description: Symbol code.
        side:
          type: string
          example: sell
          enum:
            - sell
            - buy
          description: Trade side.
        status:
          type: string
          example: partiallyFilled
          enum:
            - new
            - suspended
            - partiallyFilled
            - filled
            - canceled
            - expired
          description: >
            Order state:

            * *new*—an order is placed in the order book.

            * *suspended*—a `stopLimit`, `stopMarket`, `takeProfitLimit` or
            `takeProfitMarket` order is parked until it meets the conditions for
            placement in the order book.

            * *partiallyFilled*—an order is executed, but a part of its quantity
            is not filled yet.

            * *filled*—order quantity filled completely.

            * *canceled*—an order is canceled. It can either be done by a user
            through a cancel/replace request or by the system under specific
            circumstances.

            * *expired*—an order is deactivated after it no longer satisfies
            Time in Force (IOC, FOK) or Post Only requirements.

            * *rejected*—an order has been rejected.
        type:
          type: string
          example: limit
          enum:
            - limit
            - market
            - stopLimit
            - stopMarket
            - takeProfitLimit
            - takeProfitMarket
          description: Order type.
        timeInForce:
          type: string
          example: GTC
          enum:
            - GTC
            - IOC
            - FOK
            - Day
            - GTD
          description: >
            Order expiration mode.


            Values:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is
            filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately.
            Any part of an IOC order that cannot be filled immediately will be
            canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and
            completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day
            (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified
            date.
        quantity:
          type: string
          example: '13.942'
          description: Order quantity.
        displayQuantity:
          type: string
          example: '0'
          description: >-
            The visible part of the hidden order quantity. The only valid value
            is '0'.
        cumQuantity:
          type: string
          example: '5.240'
          description: Executed order quantity.
        price:
          type: string
          example: '0.011384'
          description: Order price.
        avgPrice:
          type: string
          description: Average price of executed lots.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Specified if `"timeInForce"` is `GTD`.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
        stopPrice:
          type: string
          example: '0.030540'
          description: >-
            The price level that triggers order activation. Specified if
            `"type"` is `stopLimit`, `stopMarket`, `takeProfitLimit`, or
            `takeProfitMarket`.
        createdAt:
          type: string
          format: date-time
          example: '2021-06-16T14:18:47.321Z'
          description: Date of order's creation.
        updatedAt:
          type: string
          format: date-time
          example: '2021-06-19T15:23:56.876Z'
          description: Date of order's last update.
        orderListId:
          type: string
          description: Order list identifier. Returned only for an order list request.
        contingencyType:
          type: string
          enum:
            - allOrNone
            - oneCancelOther
            - oneTriggerOther
            - oneTriggerOneCancelOther
          description: Order list type. Returned only for an order list request.
        margin_mode:
          type: string
          enum:
            - isolated
            - cross
          description: Margin mode.
        closePosition:
          type: boolean
          description: |
            Flag indicating a stop market order must close a margin position
             when executed or be canceled otherwise.
    trading_HistoryTrade:
      required:
        - id
        - orderId
        - clientOrderId
        - symbol
        - side
        - quantity
        - price
        - fee
        - timestamp
        - taker
        - margin_mode
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 9535486
          description: Trade unique identifier as assigned by the exchange.
        orderId:
          type: integer
          format: uint64
          example: 816088377
          description: Unique order identifier as assigned by the exchange.
        clientOrderId:
          type: string
          example: f8dbaab336d44d5ba3ff578098a68454
          description: Unique order identifier as assigned by the trader.
        symbol:
          type: string
          example: ETHBTC
          description: Symbol code.
        side:
          type: string
          example: sell
          enum:
            - sell
            - buy
          description: Trade side.
        quantity:
          type: string
          example: '5.457'
          description: Quantity of trade.
        price:
          type: string
          example: '0.012652'
          description: Trade price.
        fee:
          type: string
          example: '0.000097776600'
          description: Fee paid for trade.
        timestamp:
          type: string
          format: date-time
          example: '2022-05-12T12:45:37.888Z'
          description: Trade timestamp.
        taker:
          type: boolean
          description: Liquidity indicator.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
        pnl:
          type: string
          description: Realized profit produced by the trade.
        otc:
          type: boolean
          nullable: true
          description: >-
            Flag that indicated whether the trade was performed out the trading
            venue.
        liquidation:
          type: boolean
          nullable: true
          description: Flag that indicated whether the trade was a close trade.
        margin_mode:
          type: string
          enum:
            - isolated
            - cross
          description: Margin mode.
    trading_Error:
      required:
        - error
      type: object
      properties:
        error:
          required:
            - code
            - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
  securitySchemes:
    wallet_BasicAuth:
      type: http
      description: >-
        You should use public API key as username and secret API key as password
        to authorize.
      scheme: basic
    wallet_BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    trading_BasicAuth:
      type: http
      description: >-
        You should use public API key as username and secret API key as password
        to authorize.
      scheme: basic
    trading_BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
