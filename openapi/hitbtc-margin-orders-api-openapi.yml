openapi: 3.2.0
info:
  title: Hitbtc Margin Orders API
  version: ''
  description: 'Operations tagged Margin Orders across 4 of this provider''s published API definitions: hitbtc-api-v2-spec.yaml, hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml, hitbtc-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/2
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
- url: https://api.hitbtc.com/api/2
  description: Production; the served spec declares the relative server /api/2 and the docs at api.hitbtc.com name this host
tags:
- name: Margin Orders
paths:
  /margin/order:
    get:
      tags:
      - Margin Orders
      summary: Get all margin orders
      description: 'Returns a list of all margin orders.


        **Permission:** *TradingRead*'
      parameters:
      - $ref: '#/components/parameters/trading_symbolQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getMarginOrder
      x-operation-id-source: derived
    post:
      tags:
      - Margin Orders
      summary: Create a new margin order
      description: 'Creates a new margin order.


        **Permission:** *TradingTrade*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_NewOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: postMarginOrder
      x-operation-id-source: derived
    delete:
      tags:
      - Margin Orders
      summary: Cancel all margin orders
      description: 'Cancels all active margin orders.


        **Permission:** *TradingTrade*'
      parameters:
      - $ref: '#/components/parameters/trading_symbolQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: deleteMarginOrder
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /margin/order/{clientOrderId}:
    parameters:
    - $ref: '#/components/parameters/trading_clOrderIdPath'
    get:
      tags:
      - Margin Orders
      summary: Get active margin order
      description: 'Returns an active margin order by its `"clientOrderId"`.


        **Permission:** *TradingRead*'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getMarginOrderByClientOrderId
      x-operation-id-source: derived
    put:
      tags:
      - Margin Orders
      summary: Create a new margin order
      description: 'Creates a new margin order with specified `"clientOrderId"`.


        **Permission:** *TradingTrade*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_NewOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: putMarginOrderByClientOrderId
      x-operation-id-source: derived
    patch:
      tags:
      - Margin Orders
      summary: Replace margin order
      description: 'Replaces a margin order.


        **Permission:** *TradingTrade*'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_ReplaceOrderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: patchMarginOrderByClientOrderId
      x-operation-id-source: derived
    delete:
      tags:
      - Margin Orders
      summary: Cancel order
      description: 'Cancels a margin order with specified `"clientOrderId"`.


        **Permission:** *TradingTrade*'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_UserOrderInfo'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: deleteMarginOrderByClientOrderId
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /margin/order/{client_order_id}:
    parameters:
    - $ref: '#/components/parameters/trading_ClOrderIdPath'
    get:
      tags:
      - Margin Orders
      summary: Get a margin order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_MarginOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_OrderNotFound'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_SymbolExpired'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Orderbook, History, Trading balance


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getMarginOrderByClientOrderId
      x-operation-id-source: derived
    patch:
      tags:
      - Margin Orders
      summary: Replace a margin order
      description: 'Cancels the original order and places a new modified one.


        ℹ️ If a valid request is rejected, the original order is canceled without placing a new one.


        **Permission**: Place/cancel orders


        **IP limit**: 300/450'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_ReplaceOrderRequest_2'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/trading_ReplaceOrderRequest_2'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_MarginOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
                - $ref: '#/components/schemas/trading_OrderNotFound'
                - $ref: '#/components/schemas/trading_BadPrice'
                - $ref: '#/components/schemas/trading_QuantityNotNumber'
                - $ref: '#/components/schemas/trading_QuantityTooLow'
                - $ref: '#/components/schemas/trading_QuantityBad'
                - $ref: '#/components/schemas/trading_DuplicateClientOrderID'
                - $ref: '#/components/schemas/trading_ExceedsLimit'
                - $ref: '#/components/schemas/trading_FatFingerLimitExceeded'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_NotChanged'
                - $ref: '#/components/schemas/trading_PositionIsCloseOnly'
                - $ref: '#/components/schemas/trading_WorseLiquidationExisted'
                - $ref: '#/components/schemas/trading_CcNoMoney'
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_InvalidCancelRequestId'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
                - $ref: '#/components/schemas/trading_CcNoMoney'
                - $ref: '#/components/schemas/trading_NoAvailableMargin'
                - $ref: '#/components/schemas/trading_PositionBlocked'
                - $ref: '#/components/schemas/trading_PositionIsCloseOnly'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: patchMarginOrderByClientOrderId
      x-operation-id-source: derived
    delete:
      tags:
      - Margin Orders
      summary: Cancel a margin order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/trading_MarginOrder'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_OrderNotFound'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_InvalidCancelRequestId'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_MarginTradingIsDisabled'
                - $ref: '#/components/schemas/trading_CcNoMoney'
                - $ref: '#/components/schemas/trading_PositionNotOpened'
                - $ref: '#/components/schemas/trading_PositionBlocked'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Place/cancel orders


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: deleteMarginOrderByClientOrderId
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  parameters:
    trading_clOrderIdPath:
      name: clientOrderId
      in: path
      required: true
      schema:
        type: string
      description: Unique order identifier given by a trader or the system.
    trading_symbolQuery:
      name: symbol
      in: query
      schema:
        type: string
      description: Symbol code.
    trading_Symbols:
      name: symbol
      in: query
      schema:
        type: array
        nullable: true
        items:
          $ref: '#/components/schemas/trading_SymbolCommon'
        minItems: 1
      style: form
      explode: false
      description: Comma-separated symbol codes.
    trading_ClOrderIdPath:
      name: client_order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 32
        pattern: ^[a-zA-Z0-9_\-]{8,32}$
      description: Client-provided or system-generated identifier of the order.
      example: d8574207d9e3b16a4a5511753eeef175
  schemas:
    trading_Error:
      required:
      - error
      type: object
      properties:
        error:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_ReplaceOrderRequest:
      required:
      - price
      - quantity
      type: object
      properties:
        quantity:
          type: number
          description: Order quantity.
        strictValidate:
          type: boolean
          description: Price and quantity will be checked for incrementation within the symbol’s tick size and quantity step.
        price:
          type: number
          description: Order price.
        requestClientId:
          type: string
          description: Unique request identifier.
    trading_TradesReport:
      required:
      - id
      - quantity
      - price
      - fee
      - timestamp
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Trade identifier.
        quantity:
          type: string
          description: Quantity of trade.
        price:
          type: string
          description: Trade price.
        fee:
          type: string
          description: Fee paid for trade.
        timestamp:
          type: string
          format: date-time
          description: Trade timestamp.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
    trading_NewOrderRequest:
      required:
      - symbol
      - side
      - quantity
      type: object
      properties:
        clientOrderId:
          type: string
          description: 'Unique order identifier as assigned by the trader.

            '
        symbol:
          type: string
          description: Symbol code.
        side:
          type: string
          enum:
          - sell
          - buy
          description: Trade side.
        type:
          type: string
          enum:
          - market
          - limit
          - stopMarket
          - stopLimit
          - takeProfitLimit
          - takeProfitMarket
          default: limit
          description: Order type.
        timeInForce:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - Day
          - GTD
          description: 'Order expiration mode.


            Default:

            * `type` is `"market"`, `"stopMarket"`, `"takeProfitMarket"`—`"FOK"`;

            * `type` is `"limit"`, `"stopLimit"`, `"takeProfitLimit"`—`"GTC"`.


            Values:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified date.

            '
        quantity:
          type: number
          description: Order quantity.
        price:
          type: number
          description: Order price.
        stopPrice:
          type: number
          description: The price level that triggers order activation. Required if `"type"` is `stopLimit`, `stopMarket`, `takeProfitLimit`, or `takeProfitMarket`.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Required if `"timeInForce"` is `GTD`.
        strictValidate:
          type: boolean
          description: Price and quantity will be checked for incrementation within the symbol’s tick size and quantity step.
        postOnly:
          type: boolean
          description: 'A post-only order is an order that does not remove liquidity.

            If the post-only order would cause a match with a pre-existing order as a taker, then the order will be canceled

            '
        closePosition:
          type: boolean
          default: false
          description: "Flag indicating a stop market order must close a margin position\n when executed or be canceled otherwise.\n\nConditions: `quantity` is omitted.\n"
        takeLiquidityMarkup:
          type: number
          description: Additional fee charged from a taker for high-risk operations.
        provideLiquidityMarkup:
          type: number
          description: Additional fee charged from a maker for high-risk operations.
    trading_UserOrderInfo:
      required:
      - id
      - clientOrderId
      - symbol
      - side
      - status
      - type
      - timeInForce
      - quantity
      - postOnly
      - cumQuantity
      - createdAt
      - updatedAt
      type: object
      properties:
        id:
          type: integer
          format: uint64
          description: Order identifier.
        clientOrderId:
          type: string
          description: Unique order identifier as assigned by the trader.
        symbol:
          type: string
          description: Symbol code.
        side:
          type: string
          enum:
          - sell
          - buy
          description: Trade side.
        status:
          type: string
          enum:
          - new
          - suspended
          - partiallyFilled
          - filled
          - canceled
          - rejected
          - expired
          description: "Order state:\n  * *new*—an order is placed in the order book.\n  * *suspended*—a `stopLimit`, `stopMarket`, `takeProfitLimit` or `takeProfitMarket` order is parked until it meets the conditions for placement in the order book.\n  * *partiallyFilled*—an order is executed, but a part of its quantity is not filled yet.\n  * *filled*—order quantity filled completely.\n  * *canceled*—an order is canceled. It can either be done by a user through a cancel/replace request or by the system under specific circumstances.\n  * *expired*—an order is deactivated after it no longer satisfies Time in Force (IOC, FOK) or Post Only requirements.\n  * *rejected*—an order has been rejected.\n"
        type:
          type: string
          enum:
          - market
          - limit
          - stopMarket
          - stopLimit
          - takeProfitLimit
          - takeProfitMarket
          description: Order type.
        timeInForce:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - Day
          - GTD
          description: 'Order expiration mode:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified date.

            '
        stopPrice:
          type: string
          description: The price level that triggers order activation. Specified if `"type"` is `stopLimit`, `stopMarket`, `takeProfitLimit`, or `takeProfitMarket`.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Specified if `"timeInForce"` is `GTD`.
        price:
          type: string
          description: Order price.
        quantity:
          type: string
          description: Order quantity.
        postOnly:
          type: boolean
          description: 'A post-only order is an order that does not remove liquidity.


            If the post-only order would cause a match with a pre-existing order as a taker, then the order will be canceled

            '
        closePosition:
          type: boolean
          description: "Flag indicating a stop market order must close a margin position\n when executed or be canceled otherwise.\n"
        cumQuantity:
          type: string
          description: Executed order quantity.
        createdAt:
          type: string
          format: date-time
          description: Date of order's creation.
        updatedAt:
          type: string
          format: date-time
          description: Date of order's last update.
        tradesReport:
          type: array
          items:
            $ref: '#/components/schemas/trading_TradesReport'
    trading_MarginAuto:
      title: Auto margin management
      type: object
      properties:
        margin_auto:
          type: boolean
          description: "Flag indicating whether AMM (auto margin management) is enabled for\n the margin account or position the order belongs to.\n\nConditions: returned for margin orders only\n"
    trading_NewMarginOrder:
      allOf:
      - type: object
      - title: Margin order
        discriminator:
          propertyName: type
          mapping:
            limit: '#/components/schemas/trading_NewMarginLimitOrder'
            market: '#/components/schemas/trading_NewMarginMarketOrder'
            stopLimit: '#/components/schemas/trading_NewMarginStopLimitOrder'
            stopMarket: '#/components/schemas/trading_NewMarginStopMarketOrder'
            takeProfitLimit: '#/components/schemas/trading_NewMarginStopLimitOrder'
            takeProfitMarket: '#/components/schemas/trading_NewMarginStopMarketOrder'
        oneOf:
        - $ref: '#/components/schemas/trading_NewMarginLimitOrder'
        - $ref: '#/components/schemas/trading_NewMarginMarketOrder'
        - $ref: '#/components/schemas/trading_NewMarginStopLimitOrder'
        - $ref: '#/components/schemas/trading_NewMarginStopMarketOrder'
        - $ref: '#/components/schemas/trading_NewMarginStopLimitOrder'
        - $ref: '#/components/schemas/trading_NewMarginStopMarketOrder'
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Any of:

        * missing required parameters;

        * the maximum time window is exceeded.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_OrderNotFound:
      title: Order not found
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Canceled or replaced order has not been found, or the user has no active

        or parked orders.

        '
      example:
        error:
          code: 20002
          message: Order not found
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Trading on the requested market is not available.

        '
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_OrderBase:
      title: Order
      allOf:
      - $ref: '#/components/schemas/trading_OrderCommon'
      - type: object
        required:
        - post_only
        properties:
          post_only:
            type: boolean
            description: 'A post-only order is an order that does not remove liquidity.


              ⚠️ If the post-only order would cause a match with a

              pre-existing order as a taker, then the order will be canceled.

              '
