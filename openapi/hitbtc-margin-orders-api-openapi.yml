    trading_OrderRequestBase:
      title: Order request
      allOf:
      - $ref: '#/components/schemas/trading_StrictValidateRequest'
      - $ref: '#/components/schemas/trading_QuantityRequest'
      - type: object
        required:
        - side
        - symbol
        properties:
          client_order_id:
            type: string
            minLength: 8
            maxLength: 32
            pattern: ^[a-zA-Z0-9_\-]{8,32}$
            description: 'Client-provided identifier of an order.


              ⚠️ Uniqueness must be guaranteed until the last order with the same `client_order_id` becomes inactive (canceled, expired, or fully executed) and some time after that.


              ℹ️ If omitted, will be generated by the system.

              '
          symbol:
            type: string
            description: Symbol code.
            example: BTCUSDT
          side:
            type: string
            enum:
            - sell
            - buy
            description: Order side.
          type:
            type: string
            default: limit
            enum:
            - limit
            - market
            - stopLimit
            - stopMarket
            - takeProfitLimit
            - takeProfitMarket
            description: "Order type.\n\nConditions: required if `market`, `stopMarket`, `takeProfitMarket`\n\nValues:\n  * `limit`—an order that will be executed at or better than the specified price. The remainder, if any, is added to the order book or expired by terms of its Time-In-Force instruction;\n  * `market`—an order that will be executed at the \"best\" available market price. If the order depletes its price level, then leaves quantity is placed to the order book at this limit price;\n  * `stopLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);\n  * `stopMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);\n  * `takeProfitLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below);\n  * `takeProfitMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below).\n"
          time_in_force:
            type: string
            enum:
            - GTC
            - IOC
            - FOK
            - Day
            - GTD
            default: FOK
            description: "Order expiration mode.\n\nConditions: `post_only` omitted\n\nValues:\n  * `GTC` (\"Good-Till-Canceled\")—order will not be closed until it is filled;\n  * `IOC` (\"Immediate-Or-Cancel\")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled;\n  * `FOK` (\"Fill-Or-Kill\")—order must be executed immediately and completely or not executed at all;\n  * `Day`—keeps the order active until the end of the trading day (23:59 UTC+0);\n  * `GTD` (\"Good-Till-Date\")—order will be canceled on the specified date.\n"
          expire_time:
            type: string
            format: date-time
            description: 'Date and time of order expiration.


              Conditions: `time_in_force` is `"GTD"`

              '
          post_only:
            type: boolean
            description: 'A post-only order is an order that does not remove liquidity.


              Conditions: `time_in_force` omitted


              ⚠️ If the post-only order would cause a match with a pre-existing order as a taker, then the order will be canceled.

              '
            default: false
