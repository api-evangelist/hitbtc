openapi: 3.2.0
info:
  title: Hitbtc Orderbook API
  version: ''
  description: 'Operations tagged Orderbook across 2 of this provider''s published API definitions: hitbtc-api-v2-spec.yaml, hitbtc-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/2
- url: https://api.hitbtc.com/api/2
  description: Production; the served spec declares the relative server /api/2 and the docs at api.hitbtc.com name this host
tags:
- name: Orderbook
paths:
  /public/orderbook/{symbol}:
    get:
      tags:
      - Orderbook
      summary: Get order book by symbol
      description: The request returns an order book for a specific symbol.
      parameters:
      - $ref: '#/components/parameters/marketData_symbolPath'
      - name: limit
        in: query
        description: The number of items to return.
        schema:
          type: integer
          default: 100
      - name: volume
        in: query
        description: Desired volume for market depth search.
        schema:
          type: number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketData_Orderbook'
        '400':
          $ref: '#/components/responses/marketData_BadRequestError'
      security: []
      operationId: getPublicOrderbookBySymbol
      x-operation-id-source: derived
    servers:
    - url: /api/2
components:
  responses:
    marketData_BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/marketData_Error'
  schemas:
    marketData_Error:
      required:
      - error
      type: object
      properties:
        error:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    marketData_Orderbook:
      required:
      - symbol
      - timestamp
      - batchingTime
      - ask
      - bid
      type: object
      properties:
        symbol:
          type: string
          nullable: true
          description: Symbol code.
        timestamp:
          type: string
          format: date-time
          example: '2021-06-11T11:18:03.857366871Z'
          description: Order timestamp.
        batchingTime:
          type: string
          format: date-time
          description: Time the message was transmitted.
        ask:
          type: array
          items:
            type: array
            items:
              type: string
              example: '9777.5'
          description: Ask side array of levels.
        bid:
          type: array
          items:
            type: array
            items:
              type: string
              example: '9777.5'
          description: Bid side array of levels.
  parameters:
    marketData_symbolPath:
      name: symbol
      in: path
      required: true
      description: Symbol code.
      schema:
        type: string
  securitySchemes:
    wallet_BasicAuth:
      type: http
      description: You should use public API key as username and secret API key as password to authorize.
      scheme: basic
    wallet_BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    trading_BasicAuth:
      type: http
      description: You should use public API key as username and secret API key as password to authorize.
      scheme: basic
    trading_BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- hitbtc-api-v2-spec.yaml
- hitbtc-v2-openapi.yml
