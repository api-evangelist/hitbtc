        min:
          type: string
          example: '0.063403'
          description: The lowest value for the period.
        max:
          type: string
          example: '0.063782'
          description: The highest value for the period.
    marketData_Candle_2:
      allOf:
      - $ref: '#/components/schemas/marketData_VolumeBase'
      - $ref: '#/components/schemas/marketData_CandleBase'
    marketData_VolumeBase:
      title: Volume
      type: object
      required:
