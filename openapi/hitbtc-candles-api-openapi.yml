          close: '30289.45'
          min: '30269.59'
          max: '30370.84'
          volume: '1706.80119'
          volume_quote: '51792032.6885613'
    marketData_TimestampCommon:
      title: Timestamp
      oneOf:
      - title: ISO 8601
        type: string
        format: date-time
        description: 'Format: ISO 8601

          '
        example: '2024-03-22T15:04:05.590Z'
      - title: UNIX seconds
