openapi: 3.2.0
info:
  title: Hitbtc Futures Parameters API
  version: ''
  description: 'Operations tagged Futures Parameters across 2 of this provider''s published API definitions: hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
tags:
- name: Futures Parameters
paths:
  /futures/config:
    get:
      tags:
      - Futures Parameters
      summary: Get futures margin parameters
      description: 'Returns parameters applied to new positions.


        **Permission**: Orderbook, History, Trading balance


        **IP limit**: 20/30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - config
                properties:
                  config:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/trading_MarginParams'
                      - $ref: '#/components/schemas/trading_Contract'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getFuturesConfig
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  responses:
    trading_504:
      description: Gateway Timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_RequestTimeout'
    trading_401:
      description: Unauthorized
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/trading_UnauthorizedBasic'
            - $ref: '#/components/schemas/trading_UnauthorizedHS256'
            - $ref: '#/components/schemas/trading_UnauthorizedJWT'
            - $ref: '#/components/schemas/trading_BadFormat'
            - $ref: '#/components/schemas/trading_BadFormatHS256'
    trading_Error:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Error'
    trading_403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Forbidden'
    trading_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/trading_Internal'
  schemas:
    trading_Error:
      title: Error
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_MarginParams:
      title: Margin parameters
      type: object
      required:
      - symbol
      - margin_call_leverage_mul
      - liquidation_leverage_mul
      - max_initial_leverage
      - margin_mode
      - force_close_fee
      - enabled
      - active
      properties:
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        margin_call_leverage_mul:
          type: string
          description: Multiplier for calculating margin call leverage.
          example: '1.50'
        liquidation_leverage_mul:
          type: string
          description: Multiplier for calculating liquidation leverage.
          example: '2.00'
        max_initial_leverage:
          type: string
          description: Maximum leverage that the user can use for margin trading.
          example: '10.00'
        margin_mode:
          type: string
          enum:
          - Isolated
          - Cross
          description: Margin mode.
        force_close_fee:
          type: string
          description: Fee for the force closing of the position.
          example: '0.05'
        enabled:
          type: boolean
          description: Flag indicating whether the margin trading is available.
        active:
          type: boolean
          description: Flag indicating whether any positions comply with the parameters (including not yet opened).
        limit_base:
          type: string
          description: 'An absolute maximum that a position value can reach.


            Conditions: risk limits exist

            '
          example: '50000.00'
        limit_power:
          type: string
          description: 'Power which determines the influence of the leverage on the risk limit value.


            Conditions: risk limits exist

            '
          example: '2.2'
        unlimited_threshold:
          type: string
          description: 'Position leverage below which the risk limit is not calculated.


            Conditions: risk limits exist

            '
          example: '10.0'
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * missing required parameters;

        * the maximum time window is exceeded.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_UnauthorizedJWT:
      title: Unauthorized (Bearer)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid JWT.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: Unclassified internal error.
      example:
        error:
          code: 500
          message: Internal Server Error
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Trading on the requested market is not available.

        '
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_Contract:
      title: Contract
      example:
        symbol: BTCUSDT_PERP
    trading_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation;

        * invalid time window value;

        * invalid HMAC signature format;

        * invalid HMAC signature value.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_Forbidden:
      title: Forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: "Any of:\n* insufficient API key permissions;\n* provided IP address is not in the white list;\n* the user is not eligible for the given liquidity pool due to the\n  configuration.\n"
      example:
        error:
          code: 1003
          message: Action is forbidden for this API key
    trading_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_RequestTimeout:
      title: Request Timeout
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Operation was canceled.

        '
      example:
        error:
          code: 504
          message: Request Timeout
    trading_BadFormat:
      title: Bad format
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided parameters do not meet any supported authentication scheme.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
  securitySchemes:
    wallet_BasicAuth:
      type: http
      description: Provide a public key as the username and a secret key as the password.
      scheme: basic
    wallet_BearerAuth:
      type: http
      description: Provide a bearer token obtained from the authentication service.
      scheme: bearer
      bearerFormat: JWT
    trading_BasicAuth:
      type: http
      description: Provide a public key as the username and a secret key as the password.
      scheme: basic
    trading_BearerAuth:
      type: http
      description: Provide a bearer token obtained from the authentication service.
      scheme: bearer
      bearerFormat: JWT
x-refined-from:
- hitbtc-api-v3-spec.yaml
- hitbtc-openapi.yml
