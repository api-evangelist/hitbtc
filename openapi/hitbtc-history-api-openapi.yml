openapi: 3.2.0
info:
  title: Hitbtc History API
  version: ''
  description: 'Operations tagged History across 4 of this provider''s published API definitions: hitbtc-api-v2-spec.yaml, hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml, hitbtc-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/2
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
- url: https://api.hitbtc.com/api/2
  description: Production; the served spec declares the relative server /api/2 and the docs at api.hitbtc.com name this host
tags:
- name: History
paths:
  /history/order:
    get:
      tags:
      - History
      summary: Get the history of orders
      description: '**Permission:** *TradingRead*'
      parameters:
      - $ref: '#/components/parameters/trading_clientOrderIdQuery'
      - $ref: '#/components/parameters/trading_symbolQuery'
      - $ref: '#/components/parameters/trading_limitQuery'
      - $ref: '#/components/parameters/trading_offsetQuery'
      - $ref: '#/components/parameters/trading_fromQuery'
      - $ref: '#/components/parameters/trading_tillQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_HistoryOrder'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getHistoryOrder
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /history/order/{id}/trades:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
      description: Order identifier.
    get:
      tags:
      - History
      summary: Get user's trade history by order
      description: '**Permission:** *TradingRead*'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_HistoryTrade'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getHistoryOrderByIdTrades
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /history/trades:
    get:
      tags:
      - History
      summary: Get user's trade history
      description: '**Permission:** *TradingRead*'
      parameters:
      - $ref: '#/components/parameters/trading_limitQuery'
      - $ref: '#/components/parameters/trading_offsetQuery'
      - $ref: '#/components/parameters/trading_sortQuery'
      - $ref: '#/components/parameters/trading_symbolQuery'
      - name: from
        in: query
        schema:
          oneOf:
          - type: string
            format: date-time
          - type: integer
            format: uint64
        description: The earliest trade date or identifier.
      - name: till
        in: query
        schema:
          oneOf:
          - type: string
            format: date-time
          - type: integer
            format: uint64
        description: The latest trade date or identifier.
      - name: by
        in: query
        schema:
          type: string
          enum:
          - id
          - timestamp
          - ts
        description: The name of the field to order the results by.
      - name: margin
        in: query
        schema:
          type: string
          enum:
          - include
          - only
          - ignore
        description: 'Margin filter:

          * *include*—all trades.

          * *only*—margin trades only.

          * *ignore*—skip margin trades.

          '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_HistoryTrade'
        '400':
          $ref: '#/components/responses/trading_BadRequestError'
        '401':
          $ref: '#/components/responses/trading_UnauthorizedError'
        '403':
          $ref: '#/components/responses/trading_ForbiddenError'
        '500':
          $ref: '#/components/responses/trading_InternalServerError'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getHistoryTrades
      x-operation-id-source: derived
    servers:
    - url: /api/2
  /spot/history/order:
    get:
      tags:
      - History
      summary: Get orders history
      description: 'Returns all spot orders with trades for the last 24 hours.


        ⚠️ `order_client_id` is mutually exclusive with other parameters.


        **Permission**: Orderbook, History, Trading balance


        **IP limit**: 20/30'
      parameters:
      - $ref: '#/components/parameters/trading_ClOrderId'
      - $ref: '#/components/parameters/trading_Symbols'
      - $ref: '#/components/parameters/trading_Sort'
      - $ref: '#/components/parameters/trading_By'
      - $ref: '#/components/parameters/trading_From'
      - $ref: '#/components/parameters/trading_Till'
      - $ref: '#/components/parameters/trading_Limit'
      - $ref: '#/components/parameters/trading_Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_OrderHistory'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getSpotHistoryOrder
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /spot/history/trade:
    get:
      tags:
      - History
      summary: Get trades history
      description: 'Returns trades that filled user spot orders.


        **Permission**: Orderbook, History, Trading balance


        **IP limit**: 20/30'
      parameters:
      - $ref: '#/components/parameters/trading_OrderId'
      - $ref: '#/components/parameters/trading_Symbols'
      - $ref: '#/components/parameters/trading_Sort'
      - $ref: '#/components/parameters/trading_By'
      - $ref: '#/components/parameters/trading_From'
      - $ref: '#/components/parameters/trading_Till'
      - $ref: '#/components/parameters/trading_Limit'
      - $ref: '#/components/parameters/trading_Offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_Trade'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_SymbolNotFound'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: getSpotHistoryTrade
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  schemas:
    trading_Error:
      required:
      - error
      type: object
      properties:
        error:
          required:
          - code
          - message
          type: object
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_HistoryOrder:
      required:
      - id
      - clientOrderId
      - symbol
      - side
      - status
      - type
      - timeInForce
      - quantity
      - cumQuantity
      - price
      - avgPrice
      - createdAt
      - updatedAt
      - margin_mode
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 828680665
          description: Unique order identifier as assigned by the exchange.
        clientOrderId:
          type: string
          example: f4307c6e507e49019907c917b6d7a084
          description: Unique order identifier as assigned by the trader. The order history may list several orders with the same `"clientOrderId"`.
        symbol:
          type: string
          example: ETHBTC
          description: Symbol code.
        side:
          type: string
          example: sell
          enum:
          - sell
          - buy
          description: Trade side.
        status:
          type: string
          example: partiallyFilled
          enum:
          - new
          - suspended
          - partiallyFilled
          - filled
          - canceled
          - expired
          description: 'Order state:

            * *new*—an order is placed in the order book.

            * *suspended*—a `stopLimit`, `stopMarket`, `takeProfitLimit` or `takeProfitMarket` order is parked until it meets the conditions for placement in the order book.

            * *partiallyFilled*—an order is executed, but a part of its quantity is not filled yet.

            * *filled*—order quantity filled completely.

            * *canceled*—an order is canceled. It can either be done by a user through a cancel/replace request or by the system under specific circumstances.

            * *expired*—an order is deactivated after it no longer satisfies Time in Force (IOC, FOK) or Post Only requirements.

            * *rejected*—an order has been rejected.

            '
        type:
          type: string
          example: limit
          enum:
          - limit
          - market
          - stopLimit
          - stopMarket
          - takeProfitLimit
          - takeProfitMarket
          description: Order type.
        timeInForce:
          type: string
          example: GTC
          enum:
          - GTC
          - IOC
          - FOK
          - Day
          - GTD
          description: 'Order expiration mode.


            Values:

            * *GTC* ("Good-Till-Canceled")—order will not be closed until it is filled.

            * *IOC* ("Immediate-Or-Cancel")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled.

            * *FOK* ("Fill-Or-Kill")—order must be executed immediately and completely or not executed at all.

            * *Day*—keeps the order active until the end of the trading day (23:59 UTC+0).

            * *GTD* ("Good-Till-Date")—order will be canceled on the specified date.

            '
        quantity:
          type: string
          example: '13.942'
          description: Order quantity.
        displayQuantity:
          type: string
          example: '0'
          description: The visible part of the hidden order quantity. The only valid value is '0'.
        cumQuantity:
          type: string
          example: '5.240'
          description: Executed order quantity.
        price:
          type: string
          example: '0.011384'
          description: Order price.
        avgPrice:
          type: string
          description: Average price of executed lots.
        expireTime:
          type: string
          format: date-time
          description: Date of order expiration. Specified if `"timeInForce"` is `GTD`.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
        stopPrice:
          type: string
          example: '0.030540'
          description: The price level that triggers order activation. Specified if `"type"` is `stopLimit`, `stopMarket`, `takeProfitLimit`, or `takeProfitMarket`.
        createdAt:
          type: string
          format: date-time
          example: '2021-06-16T14:18:47.321Z'
          description: Date of order's creation.
        updatedAt:
          type: string
          format: date-time
          example: '2021-06-19T15:23:56.876Z'
          description: Date of order's last update.
        orderListId:
          type: string
          description: Order list identifier. Returned only for an order list request.
        contingencyType:
          type: string
          enum:
          - allOrNone
          - oneCancelOther
          - oneTriggerOther
          - oneTriggerOneCancelOther
          description: Order list type. Returned only for an order list request.
        margin_mode:
          type: string
          enum:
          - isolated
          - cross
          description: Margin mode.
        closePosition:
          type: boolean
          description: "Flag indicating a stop market order must close a margin position\n when executed or be canceled otherwise.\n"
    trading_HistoryTrade:
      required:
      - id
      - orderId
      - clientOrderId
      - symbol
      - side
      - quantity
      - price
      - fee
      - timestamp
      - taker
      - margin_mode
      type: object
      properties:
        id:
          type: integer
          format: uint64
          example: 9535486
          description: Trade unique identifier as assigned by the exchange.
        orderId:
          type: integer
          format: uint64
          example: 816088377
          description: Unique order identifier as assigned by the exchange.
        clientOrderId:
          type: string
          example: f8dbaab336d44d5ba3ff578098a68454
          description: Unique order identifier as assigned by the trader.
        symbol:
          type: string
          example: ETHBTC
          description: Symbol code.
        side:
          type: string
          example: sell
          enum:
          - sell
          - buy
          description: Trade side.
        quantity:
          type: string
          example: '5.457'
          description: Quantity of trade.
        price:
          type: string
          example: '0.012652'
          description: Trade price.
        fee:
          type: string
          example: '0.000097776600'
          description: Fee paid for trade.
        timestamp:
          type: string
          format: date-time
          example: '2022-05-12T12:45:37.888Z'
          description: Trade timestamp.
        taker:
          type: boolean
          description: Liquidity indicator.
        positionId:
          type: integer
          format: uint64
          description: Position identifier.
        pnl:
          type: string
          description: Realized profit produced by the trade.
        otc:
          type: boolean
          nullable: true
          description: Flag that indicated whether the trade was performed out the trading venue.
        liquidation:
          type: boolean
          nullable: true
          description: Flag that indicated whether the trade was a close trade.
        margin_mode:
          type: string
          enum:
          - isolated
          - cross
          description: Margin mode.
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Any of:

        * missing required parameters;

        * the maximum time window is exceeded.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_LimitOrderHistory:
      title: Limit orders
      allOf:
      - $ref: '#/components/schemas/trading_MarketOrderHistory'
      - $ref: '#/components/schemas/trading_Price'
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Trading on the requested market is not available.

        '
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_OrderHistory:
      allOf:
      - type: object
      - title: Order history
        discriminator:
          propertyName: type
          mapping:
            limit: '#/components/schemas/trading_LimitOrderHistory'
            market: '#/components/schemas/trading_MarketOrderHistory'
            stopLimit: '#/components/schemas/trading_StopLimitOrderHistory'
            stopMarket: '#/components/schemas/trading_StopMarketOrderHistory'
            takeProfitLimit: '#/components/schemas/trading_StopLimitOrderHistory'
            takeProfitMarket: '#/components/schemas/trading_StopMarketOrderHistory'
        oneOf:
        - $ref: '#/components/schemas/trading_LimitOrderHistory'
        - $ref: '#/components/schemas/trading_MarketOrderHistory'
        - $ref: '#/components/schemas/trading_StopLimitOrderHistory'
        - $ref: '#/components/schemas/trading_StopMarketOrderHistory'
        - $ref: '#/components/schemas/trading_StopLimitOrderHistory'
        - $ref: '#/components/schemas/trading_StopMarketOrderHistory'
    trading_SymbolCommon:
      title: Symbol
      type: string
      description: Symbol code.
    trading_StopMarketOrderHistory:
      title: Stop market orders
      allOf:
      - $ref: '#/components/schemas/trading_MarketOrderHistory'
      - $ref: '#/components/schemas/trading_StopPrice'
      - required:
        - stop_price
    trading_Error_2:
      title: Error
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_OrderTradesBase:
      title: Order trades
      type: object
      required:
      - id
      - quantity
      - price
      - fee
      - timestamp
      - taker
      description: The list of trades the order participated in.
      properties:
        id:
          type: integer
          format: uint64
          description: Trade identifier.
          example: 112263
        quantity:
          type: string
          description: Quantity of the trade.
          example: '5.457'
        price:
          type: string
          description: Trade price.
          example: '27001.99'
        fee:
          type: string
          description: Fee paid for trade.
          example: '0.000097776600'
        timestamp:
          type: string
          description: Date and time of the trade.
          example: '2024-03-22T17:01:05.092Z'
        taker:
          type: boolean
          description: Liquidity indicator.
    trading_UnauthorizedJWT:
      title: Unauthorized (Bearer)
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Invalid JWT.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: Unclassified internal error.
      example:
        error:
          code: 500
          message: Internal Server Error
    trading_SymbolNotFound:
      title: Symbol not found
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'The symbol featured in the request has not been found.

        '
      example:
        error:
          code: 2001
          message: Symbol not found
    trading_OrderListFields:
      title: Order list
      type: object
      properties:
        order_list_id:
          type: string
          description: 'Order list identifier.


            Conditions: order list

            '
          example: d8574207d9e3b16a4a5511753eeef175
        contingency_type:
          type: string
          enum:
          - allOrNone
          - oneCancelOther
          - oneTriggerOther
          - oneTriggerOneCancelOther
          description: "Order list type.\n\nConditions: order list\n\nValues:\n  * `allOrNone` (AON)—all orders in the set should be executed within a single transaction or become expired otherwise;\n  * `oneCancelOther` (OCO)—all orders in the set should be canceled if one of them was executed;\n  * `oneTriggerOther` (OTO)—execution of the first (primary) order on the list activates other (secondary) orders as independent of each other;\n  * `oneTriggerOneCancelOther` (OTOCO)—the execution of the first (primary) order on the list activates the other (secondary) orders as an OCO order list.\n"
    trading_OrderCommon:
      title: Order
      type: object
      required:
      - id
      - client_order_id
      - symbol
      - quantity
      - quantity_cumulative
      - time_in_force
      - side
      - status
      - type
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: uint64
          example: 828680665
          description: Unique order identifier as assigned by the exchange.
        client_order_id:
          type: string
          description: Client-provided or system-generated identifier of an order.
          example: d8574207d9e3b16a4a5511753eeef175
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        side:
          type: string
          enum:
          - sell
          - buy
          description: Order side.
        status:
          type: string
          enum:
          - new
          - suspended
          - partiallyFilled
          - filled
          - canceled
          - expired
          - rejected
          description: 'Order status.


            Values:

            * `new`—an order is placed in the order book;

            * `suspended`—a `stopLimit`, `stopMarket`, `takeProfitLimit` or `takeProfitMarket` order is parked until it meets the conditions for placement in the order book;

            * `partiallyFilled`—an order is executed, but a part of its quantity is not filled yet;

            * `filled`—order quantity filled completely;

            * `canceled`—an order is canceled. It can either be done by a user through a cancel/replace request or by the system under specific circumstances;

            * `expired`—an order is deactivated after it no longer satisfies Time in Force (IOC, FOK) or Post Only requirements;

            * `rejected`—an order has been rejected.

            '
        type:
          type: string
          enum:
          - limit
          - market
          - stopLimit
          - stopMarket
          - takeProfitLimit
          - takeProfitMarket
          description: 'Order type.


            Values:

            * `limit`—an order that will be executed at or better than the specified price. The remainder, if any, is added to the order book or expired by terms of its Time-In-Force instruction;

            * `market`—an order that will be executed at the "best" available market price. If the order depletes its price level, then leaves quantity is placed to the order book at this limit price;

            * `stopLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);

            * `stopMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);

            * `takeProfitLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below);

            * `takeProfitMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below).

            '
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - Day
          - GTD
          description: 'Order expiration mode.


            Values:

            * `GTC` ("Good-Till-Canceled")—order will not be closed until it is filled;

            * `IOC` ("Immediate-Or-Cancel")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled;

            * `FOK` ("Fill-Or-Kill")—order must be executed immediately and completely or not executed at all;

            * `Day`—keeps the order active until the end of the trading day (23:59 UTC+0);

            * `GTD` ("Good-Till-Date")—order will be canceled on the specified date.

            '
        quantity:
          type: string
          description: Order quantity.
          example: '13.942'
        quantity_cumulative:
          type: string
          description: Executed order quantity.
          example: '5.240'
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: 'Date of order expiration.


            Conditions: `time_in_force` is `"GTD"`

            '
          example: null
        created_at:
          type: string
          format: date-time
          description: Date of order creation.
          example: '2024-03-22T14:18:47.321Z'
        updated_at:
          type: string
          format: date-time
          description: Date of order last update.
          example: '2024-03-22T15:23:56.876Z'
        price_average:
          type: string
          description: 'Average price of executed order quantity.

            '
          example: '27001.99'
    trading_StopPrice:
      title: Stop price
      type: object
      properties:
        stop_price:
          type: string
          description: The price level that triggers order activation.
          example: '27003.99'
    trading_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error_2'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation;

        * invalid time window value;

        * invalid HMAC signature format;

        * invalid HMAC signature value.

        '
      example:
        error:
