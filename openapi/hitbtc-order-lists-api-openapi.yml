openapi: 3.2.0
info:
  title: Hitbtc Order Lists API
  version: ''
  description: 'Operations tagged Order Lists across 2 of this provider''s published API definitions: hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
tags:
- name: Order Lists
paths:
  /spot/order/list:
    post:
      tags:
      - Order Lists
      summary: Place an order list
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/trading_OrderListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/trading_OrderListRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/trading_Order'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_NotAvailable'
                - $ref: '#/components/schemas/trading_Validation'
                - $ref: '#/components/schemas/trading_BadSymbolsCombination'
                - $ref: '#/components/schemas/trading_BadOrderListSize'
                - $ref: '#/components/schemas/trading_BadFlagsCombination'
                - $ref: '#/components/schemas/trading_NotSupported'
                - $ref: '#/components/schemas/trading_InvalidPrice'
                - $ref: '#/components/schemas/trading_BadPrice'
                - $ref: '#/components/schemas/trading_QuantityNotNumber'
                - $ref: '#/components/schemas/trading_QuantityTooLow'
                - $ref: '#/components/schemas/trading_QuantityBad'
                - $ref: '#/components/schemas/trading_DuplicateClientOrderID'
                - $ref: '#/components/schemas/trading_ExceedsLimit'
                - $ref: '#/components/schemas/trading_FatFingerLimitExceeded'
                - $ref: '#/components/schemas/trading_ExchangeClosed'
                - $ref: '#/components/schemas/trading_TooLateToEnter'
                - $ref: '#/components/schemas/trading_SymbolExpired'
                - $ref: '#/components/schemas/trading_InsufficientFunds'
                - $ref: '#/components/schemas/trading_BadTimeInForce'
                - $ref: '#/components/schemas/trading_BadType'
                - $ref: '#/components/schemas/trading_BadDisplayQuantity'
        '401':
          $ref: '#/components/responses/trading_401'
        '403':
          $ref: '#/components/responses/trading_403'
        '406':
          description: Not Acceptable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/trading_SymbolExpired'
        '500':
          $ref: '#/components/responses/trading_500'
        '504':
          $ref: '#/components/responses/trading_504'
        default:
          $ref: '#/components/responses/trading_Error'
      description: '**Permission**: Place/cancel orders


        **IP limit**: 300/450'
      security:
      - trading_BasicAuth: []
      - trading_BearerAuth: []
      operationId: postSpotOrderList
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  schemas:
    trading_LimitOrder:
      title: Limit order
      allOf:
      - $ref: '#/components/schemas/trading_MarketOrder'
      - $ref: '#/components/schemas/trading_Price'
    trading_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * missing required parameters;

        * the maximum time window is exceeded.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_BadOrderListSize:
      title: Bad order list size
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'The number of order in the order list violates the conditions for its

        contingency type.

        '
      example:
        error:
          code: 2017
          message: Bad order list size
    trading_QuantityTooLow:
      title: Quantity too low
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Quantity is less or equal to zero or the quantity increment.

        '
      example:
        error:
          code: 2011
          message: Quantity too low
    trading_BadSymbolsCombination:
      title: Bad symbols combination
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Orders in the order list are on symbols that are unacceptable in

        combination for the given type.


        Any of:

        * for `allOrNone`—all symbols must be different;

        * for `oneTriggerOneCancelOther`—all symbols must be the same.

        '
      example:
        error:
          code: 2016
          message: Bad symbols combination
    trading_Order:
      allOf:
      - type: object
      - title: Order
        discriminator:
          propertyName: type
          mapping:
            limit: '#/components/schemas/trading_LimitOrder'
            market: '#/components/schemas/trading_MarketOrder'
            stopLimit: '#/components/schemas/trading_StopLimitOrder'
            stopMarket: '#/components/schemas/trading_StopMarketOrder'
            takeProfitLimit: '#/components/schemas/trading_StopLimitOrder'
            takeProfitMarket: '#/components/schemas/trading_StopMarketOrder'
        oneOf:
        - $ref: '#/components/schemas/trading_LimitOrder'
        - $ref: '#/components/schemas/trading_MarketOrder'
        - $ref: '#/components/schemas/trading_StopLimitOrder'
        - $ref: '#/components/schemas/trading_StopMarketOrder'
        - $ref: '#/components/schemas/trading_StopLimitOrder'
        - $ref: '#/components/schemas/trading_StopMarketOrder'
    trading_NotAvailable:
      title: Not available
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Trading on the requested market is not available.

        '
      example:
        error:
          code: 20044
          message: Trading operation not allowed
    trading_OrderBase:
      title: Order
      allOf:
      - $ref: '#/components/schemas/trading_OrderCommon'
      - type: object
        required:
        - post_only
        properties:
          post_only:
            type: boolean
            description: 'A post-only order is an order that does not remove liquidity.


              ⚠️ If the post-only order would cause a match with a

              pre-existing order as a taker, then the order will be canceled.

              '
    trading_LimitOrderRequest:
      title: Limit order
      allOf:
      - $ref: '#/components/schemas/trading_OrderRequestBase'
      - $ref: '#/components/schemas/trading_MarkupRateRequest'
      - $ref: '#/components/schemas/trading_HiddenOrderFields'
      - $ref: '#/components/schemas/trading_PriceRequest'
      - $ref: '#/components/schemas/trading_LimitDefaultTIF'
    trading_FatFingerLimitExceeded:
      title: Fat finger limit exceeded
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Fat finger limit is exceeded.


        If a replace request is rejected, it cancels the original order without

        placing a new one.

        '
      example:
        error:
          code: 20045
          message: Fat finger limit exceeded
          description: Check that the funds are sufficient, given commissions
    trading_StrictValidateRequest:
      title: Strict validate
      type: object
      properties:
        strict_validate:
          type: boolean
          description: Price and quantity will be checked for incrementation within the symbol tick size and quantity step (see the symbol `tick_size` and `quantity_increment`).
          default: false
    trading_QuantityRequest:
      title: Quantity
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: string
          exclusiveMinimum: 0
          description: Order quantity.
          example: 2.37
    trading_LimitDefaultTIF:
      title: Time-in-Force
      type: object
      properties:
        time_in_force:
          default: GTC
    trading_StopLimitOrderRequest:
      title: Stop limit order
      allOf:
      - $ref: '#/components/schemas/trading_LimitOrderRequest'
      - $ref: '#/components/schemas/trading_StopPriceRequest'
      - $ref: '#/components/schemas/trading_HiddenOrderFields'
      - $ref: '#/components/schemas/trading_LimitDefaultTIF'
      - required:
        - stop_price
    trading_DuplicateClientOrderID:
      title: Duplicate client order Id
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided client order identifier is user in an active order or has been

        used lately.

        '
      example:
        error:
          code: 20008
          message: Duplicate clientOrderId
    trading_MarketOrder:
      title: Market order
      allOf:
      - $ref: '#/components/schemas/trading_OrderBase'
      - $ref: '#/components/schemas/trading_OrderTrades'
      - $ref: '#/components/schemas/trading_OrderListFields'
    trading_ExchangeClosed:
      title: Exchange closed
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Exchange is temporary closed.

        '
      example:
        error:
          code: 20010
          message: Exchange temporary closed
    trading_StopLimitOrder:
      title: Stop limit order
      allOf:
      - $ref: '#/components/schemas/trading_LimitOrder'
      - $ref: '#/components/schemas/trading_HiddenOrderFields'
      - $ref: '#/components/schemas/trading_StopPrice'
      - required:
        - stop_price
    trading_BadType:
      title: Bad order type
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided order type is invalid.

        '
      example:
        error:
          code: 20049
          message: Bad type
    trading_ExceedsLimit:
      title: Exceeds limit
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Available funds on the exchange balance are not sufficient.

        '
      example:
        error:
          code: 20001
          message: Insufficient funds
          description: Check that the funds are sufficient, given commissions
    trading_NotSupported:
      title: Not supported
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * hidden orders are not supported for the given symbol;

        * the hidden quantity is not equal to zero.

        '
      example:
        error:
          code: 2015
          message: symbol code not supported
    trading_QuantityNotNumber:
      title: Quantity not number
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid quantity value.


        Any of:

        * quantity is not a decimal with a dot as the separator;

        * maximum bit depth is exceeded.

        '
      example:
        error:
          code: 2010
          message: Quantity not a valid number
    trading_Error:
      title: Error
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              format: int
            message:
              type: string
            description:
              type: string
    trading_OrderTradesBase:
      title: Order trades
      type: object
      required:
      - id
      - quantity
      - price
      - fee
      - timestamp
      - taker
      description: The list of trades the order participated in.
      properties:
        id:
          type: integer
          format: uint64
          description: Trade identifier.
          example: 112263
        quantity:
          type: string
          description: Quantity of the trade.
          example: '5.457'
        price:
          type: string
          description: Trade price.
          example: '27001.99'
        fee:
          type: string
          description: Fee paid for trade.
          example: '0.000097776600'
        timestamp:
          type: string
          description: Date and time of the trade.
          example: '2024-03-22T17:01:05.092Z'
        taker:
          type: boolean
          description: Liquidity indicator.
    trading_UnauthorizedJWT:
      title: Unauthorized (Bearer)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid JWT.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_StopMarketOrder:
      title: Stop market order
      allOf:
      - $ref: '#/components/schemas/trading_MarketOrder'
      - $ref: '#/components/schemas/trading_StopPrice'
      - required:
        - stop_price
    trading_PriceRequest:
      title: Price
      type: object
      required:
      - price
      properties:
        price:
          type: number
          exclusiveMinimum: 0
          description: Order price.
          example: 27001.99
    trading_InsufficientFunds:
      title: Insufficient funds
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: ''
      example:
        error:
          code: 20004
          message: Insufficient funds
    trading_OrderListId:
      title: Order list ID
      type: object
      properties:
        order_list_id:
          type: string
          minLength: 8
          maxLength: 32
          pattern: ^[a-zA-Z0-9_\-]{8,32}$
          description: "Client-provided identifier of the order list.\n\nConditions:\n  * if omitted, will be generated by the system;\n  * equal to `client_order_id` of the first order in the list.\n\n⚠️ Uniqueness must be guaranteed until the last order with the same `client_order_id` becomes inactive (canceled, expired, or fully executed) and some time after that.\n"
          example: d8574207d9e3b16a4a5511753eeef175
    trading_BadDisplayQuantity:
      title: Bad display quantity
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: '`display_quantity` in a hidden order is other than 0.

        '
      example:
        error:
          code: 2013
          message: Bad display quantity
    trading_Internal:
      title: Internal Server Error
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: Unclassified internal error.
      example:
        error:
          code: 500
          message: Internal Server Error
    trading_OrderCommon:
      title: Order
      type: object
      required:
      - id
      - client_order_id
      - symbol
      - quantity
      - quantity_cumulative
      - time_in_force
      - side
      - status
      - type
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: uint64
          example: 828680665
          description: Unique order identifier as assigned by the exchange.
        client_order_id:
          type: string
          description: Client-provided or system-generated identifier of an order.
          example: d8574207d9e3b16a4a5511753eeef175
        symbol:
          type: string
          description: Symbol code.
          example: BTCUSDT
        side:
          type: string
          enum:
          - sell
          - buy
          description: Order side.
        status:
          type: string
          enum:
          - new
          - suspended
          - partiallyFilled
          - filled
          - canceled
          - expired
          - rejected
          description: 'Order status.


            Values:

            * `new`—an order is placed in the order book;

            * `suspended`—a `stopLimit`, `stopMarket`, `takeProfitLimit` or `takeProfitMarket` order is parked until it meets the conditions for placement in the order book;

            * `partiallyFilled`—an order is executed, but a part of its quantity is not filled yet;

            * `filled`—order quantity filled completely;

            * `canceled`—an order is canceled. It can either be done by a user through a cancel/replace request or by the system under specific circumstances;

            * `expired`—an order is deactivated after it no longer satisfies Time in Force (IOC, FOK) or Post Only requirements;

            * `rejected`—an order has been rejected.

            '
        type:
          type: string
          enum:
          - limit
          - market
          - stopLimit
          - stopMarket
          - takeProfitLimit
          - takeProfitMarket
          description: 'Order type.


            Values:

            * `limit`—an order that will be executed at or better than the specified price. The remainder, if any, is added to the order book or expired by terms of its Time-In-Force instruction;

            * `market`—an order that will be executed at the "best" available market price. If the order depletes its price level, then leaves quantity is placed to the order book at this limit price;

            * `stopLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);

            * `stopMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—falls below, for buy orders—rises above);

            * `takeProfitLimit`—a limit order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below);

            * `takeProfitMarket`—a market order that remains inactive until the market crosses a specified stop price (for sell orders—rises above, for buy orders—falls below).

            '
        time_in_force:
          type: string
          enum:
          - GTC
          - IOC
          - FOK
          - Day
          - GTD
          description: 'Order expiration mode.


            Values:

            * `GTC` ("Good-Till-Canceled")—order will not be closed until it is filled;

            * `IOC` ("Immediate-Or-Cancel")—order must be executed immediately. Any part of an IOC order that cannot be filled immediately will be canceled;

            * `FOK` ("Fill-Or-Kill")—order must be executed immediately and completely or not executed at all;

            * `Day`—keeps the order active until the end of the trading day (23:59 UTC+0);

            * `GTD` ("Good-Till-Date")—order will be canceled on the specified date.

            '
        quantity:
          type: string
          description: Order quantity.
          example: '13.942'
        quantity_cumulative:
          type: string
          description: Executed order quantity.
          example: '5.240'
        expire_time:
          type: string
          format: date-time
          nullable: true
          description: 'Date of order expiration.


            Conditions: `time_in_force` is `"GTD"`

            '
          example: null
        created_at:
          type: string
          format: date-time
          description: Date of order creation.
          example: '2024-03-22T14:18:47.321Z'
        updated_at:
          type: string
          format: date-time
          description: Date of order last update.
          example: '2024-03-22T15:23:56.876Z'
        price_average:
          type: string
          description: 'Average price of executed order quantity.

            '
          example: '27001.99'
    trading_TooLateToEnter:
      title: Too late to enter
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'The order met its expiration time before it might be processed.

        '
      example:
        error:
          code: 20080
          message: Internal order execution deadline exceeded
    trading_Forbidden:
      title: Forbidden
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: "Any of:\n* insufficient API key permissions;\n* provided IP address is not in the white list;\n* the user is not eligible for the given liquidity pool due to the\n  configuration.\n"
      example:
        error:
          code: 1003
          message: Action is forbidden for this API key
    trading_QuantityBad:
      title: Bad quantity
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid quantity format.

        '
      example:
        error:
          code: 2012
          message: Bad quantity
    trading_InvalidPrice:
      title: Invalid price
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Invalid price value.


        Any of:

        * price is not a decimal with a dot as the separator;

        * maximum bit depth is exceeded;

        * price is less or equal to zero.

        '
      example:
        error:
          code: 2020
          message: Price is not a valid decimal
    trading_UnauthorizedHS256:
      title: Unauthorized (HS256)
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Any of:

        * invalid API key;

        * user is not allowed to perform the requested operation;

        * invalid time window value;

        * invalid HMAC signature format;

        * invalid HMAC signature value.

        '
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    trading_MarkupRateRequest:
      title: Markup rate
      type: object
      properties:
        take_rate:
          type: number
          minimum: 0
          maximum: 0.1
          multipleOf: 1.0e-06
          description: Markup taker fee rate applied to the order volume.
          example: 0.001
        make_rate:
          type: number
          minimum: 0
          maximum: 0.1
          multipleOf: 1.0e-06
          description: Markup maker fee rate applied to the order volume.
          example: 0.001
    trading_OrderTrades:
      title: Order trades
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/trading_OrderTradesBase'
    trading_OrderListRequest:
      title: Order list request
      allOf:
      - $ref: '#/components/schemas/trading_OrderListId'
      - type: object
        required:
        - contingency_type
        - orders
        properties:
          contingency_type:
            type: string
            enum:
            - allOrNone
            - oneCancelOther
            - oneTriggerOther
            - oneTriggerOneCancelOther
            description: "Order list type.\n\nValues:\n  * `allOrNone` (AON)—all orders in the set should be executed within a single transaction or become expired otherwise;\n  * `oneCancelOther` (OCO)—all orders in the set should be canceled if one of them was executed;\n  * `oneTriggerOther` (OTO)—execution of the first (primary) order on the list activates other (secondary) orders as independent of each other;\n  * `oneTriggerOneCancelOther` (OTOCO)—the execution of the first (primary) order on the list activates the other (secondary) orders as an OCO order list.\n"
          orders:
            type: array
            items:
              $ref: '#/components/schemas/trading_OrderRequest'
              minItems: 2
              maxItems: 3
            description: 'Orders in the order list.


              ⚠️ There must be 2 or 3 orders for `allOrNone`/`oneCancelOther`/`oneTriggerOther` and 3—for `oneTriggerOneCancelOther`. Placing any other number of orders will result in an error.

              '
    trading_StopPrice:
      title: Stop price
      type: object
      properties:
        stop_price:
          type: string
          description: The price level that triggers order activation.
          example: '27003.99'
    trading_StopPriceRequest:
      title: Stop price
      type: object
      properties:
        stop_price:
          type: number
          exclusiveMinimum: 0
          description: The price level that triggers order activation.
          example: 27003.99
    trading_RequestTimeout:
      title: Request Timeout
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Operation was canceled.

        '
      example:
        error:
          code: 504
          message: Request Timeout
    trading_HiddenOrderFields:
      title: Hidden order
      type: object
      properties:
        display_quantity:
          type: string
          enum:
          - '0'
          description: 'The visible part of the hidden order quantity.


            Conditions: `time_in_force` is `GTC`, `Day`, `GTD`

            '
    trading_Price:
      title: Price
      type: object
      required:
      - price
      properties:
        price:
          type: string
          pattern: ^\d+\.?\d*$
          description: Order price.
          example: '27001.99'
    trading_BadFormat:
      title: Bad format
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided parameters do not meet any supported authentication scheme.

        '
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    trading_OrderListFields:
      title: Order list
      type: object
      properties:
        order_list_id:
          type: string
          description: 'Order list identifier.


            Conditions: order list

            '
          example: d8574207d9e3b16a4a5511753eeef175
        contingency_type:
          type: string
          enum:
          - allOrNone
          - oneCancelOther
          - oneTriggerOther
          - oneTriggerOneCancelOther
          description: "Order list type.\n\nConditions: order list\n\nValues:\n  * `allOrNone` (AON)—all orders in the set should be executed within a single transaction or become expired otherwise;\n  * `oneCancelOther` (OCO)—all orders in the set should be canceled if one of them was executed;\n  * `oneTriggerOther` (OTO)—execution of the first (primary) order on the list activates other (secondary) orders as independent of each other;\n  * `oneTriggerOneCancelOther` (OTOCO)—the execution of the first (primary) order on the list activates the other (secondary) orders as an OCO order list.\n"
    trading_BadTimeInForce:
      title: Bad Time-In-Force
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Provided Time-In-Force instruction is invalid or the combination of the

        instruction and the order type is not allowed.

        '
      example:
        error:
          code: 20048
          message: Bad time in force
    trading_SymbolExpired:
      title: Symbol expired
      schema:
        $ref: '#/components/schemas/trading_Error'
      type: object
      description: 'Trades on the given symbol are suspended.

        '
      example:
        error:
          code: 20046
          message: Exchange symbol is expired
    trading_OrderRequest:
      allOf:
      - type: object
      - title: Order request
        discriminator:
          propertyName: type
          mapping:
            limit: '#/components/schemas/trading_LimitOrderRequest'
