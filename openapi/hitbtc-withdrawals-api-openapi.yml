openapi: 3.2.0
info:
  title: Hitbtc Withdrawals API
  version: ''
  description: 'Operations tagged Withdrawals across 2 of this provider''s published API definitions: hitbtc-api-v3-spec.yaml, hitbtc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/3
- url: https://api.hitbtc.com/api/3
  description: Production; the served spec declares the relative server /api/3 and the docs at api.hitbtc.com name this host
- url: https://api.demo.hitbtc.com/api/3
  description: Demo Environment (Sandbox), per api.hitbtc.com docs
tags:
- name: Withdrawals
paths:
  /wallet/internal/withdraw:
    post:
      tags:
      - Withdrawals
      summary: Commit an internal withdrawal
      description: 'Creates and commits an off-chain withdrawal from the wallet of one exchange user to the wallet of another exchange user.


        ⚠️ Apart from available balance, the amount of a withdrawal must exceed the sum of:

        * fees;

        * the total amount reserved on all wallets;

        * the total amount reserved on all exchange accounts;

        * pending amounts of concurrent withdrawals.


        ⚠️ An operation may fail due to the following reasons:

        * the user cannot perform this type of operation based on:

        * temporary account limitations;

        * no active 2FA.

        * it does not pass pre-AML checks.


        ⚠️ Created but not committed withdrawal will reserve pending amount on the sender wallet affecting the balance remaining for other withdrawals.


        ⚠️ Successful response to the request does not necessarily mean the resulting transaction got executed immediately. It has to be processed first and may eventually be rolled back or fail.


        ℹ️ Call `GET /public/currency/{currency}` and check `payout_enabled` to determine if withdrawals are allowed for the currency.


        ℹ️ Call `GET /wallet/transactions/{id}` to check out the status of resulting transaction.


        **Permission**: Withdraw cryptocurrencies


        **IP limit**: 10/10


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_InternalWithdrawalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_InternalWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/wallet_TransactionID'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_NotAllowed'
                - $ref: '#/components/schemas/wallet_PayoutInvalidPaymentID'
                - $ref: '#/components/schemas/wallet_PayoutOffchainUnavailable'
                - $ref: '#/components/schemas/wallet_PayoutBlacklisted'
                - $ref: '#/components/schemas/wallet_PayoutAmountLocked'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutDisabled'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_UserNotFound'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postWalletInternalWithdraw
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /wallet/crypto/check-offchain-available:
    post:
      tags:
      - Withdrawals
      summary: Check off chain available
      description: 'Determines whether the off-chain withdrawals are allowed to the given deposit address.


        **Permission**: Payment information


        **IP limit**: 10/10


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_OffChainRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_OffChainRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postWalletCryptoCheckOffchainAvailable
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /wallet/crypto/withdraw:
    post:
      tags:
      - Withdrawals
      summary: Create a withdrawal
      description: 'Creates a withdrawal transaction, and, depending on the operation scheme:

        * **one-phase**—the transaction is committed automatically;

        * **two-phase**—the transaction remains in `"PENDING"` state until the user commits or rolls it back.


        ⚠️ Depending on the `use_offchain` parameter, a withdrawal may be processed off chain.


        ⚠️ Depending on the `use_offchain` parameter, a withdrawal may be processed off chain.


        ⚠️ The platform charges fees for execution of a withdrawal unless it is processed off chain. Fees amount is displayed in the transaction history.


        ⚠️ Apart from available balance, the amount of a withdrawal must exceed the sum of:

        * fees;

        * the total amount reserved on all wallets;

        * the total amount reserved on all exchange accounts.


        ⚠️ An operation may fail due to the following reasons:

        * the user cannot perform this type of operation based on:

        * temporary account limitations;

        * no active 2FA.

        * it does not pass pre-AML checks.


        ⚠️ Created but not committed withdrawal will reserve pending amount on the sender wallet affecting the balance remaining for other withdrawals.


        ℹ️ Call `GET /public/currency/{currency}` and check `payout_enabled` to determine if withdrawals are allowed for the currency.


        ℹ️ Call `GET /wallet/crypto/fee/estimate` to check whether off-chain transaction are allowed for the given target address.


        ℹ️ Call `GET /wallet/transactions/{id}` to check out the resulting transaction details.


        ℹ️ Call `PUT /wallet/crypto/withdraw/{id}` to commit the transaction.


        ℹ️ Call `DELETE /wallet/crypto/withdraw/{id}` to roll back the transaction.


        **Permission**: Withdraw cryptocurrencies


        **IP limit**: 10/10


        **Account limit**: 20/30'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/wallet_WithdrawalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/wallet_WithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    $ref: '#/components/schemas/wallet_TransactionID'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_NotAllowed'
                - $ref: '#/components/schemas/wallet_PayoutInvalidAddress'
                - $ref: '#/components/schemas/wallet_PayoutInvalidPaymentID'
                - $ref: '#/components/schemas/wallet_PayoutBlacklisted'
                - $ref: '#/components/schemas/wallet_PayoutOffchainUnavailable'
                - $ref: '#/components/schemas/wallet_PayoutAmountLocked'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutDisabled'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_UserNotFound'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: postWalletCryptoWithdraw
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /wallet/crypto/withdraw/{id}:
    parameters:
    - $ref: '#/components/parameters/wallet_TransactionIdPathReq'
    put:
      tags:
      - Withdrawals
      summary: Commit a withdrawal
      description: 'ℹ️ Get `id` parameter value from the response to a `POST /wallet/crypto/withdraw` call.


        **Permission**: Withdraw cryptocurrencies


        **IP limit**: 10/10


        **Account limit**: 20/30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_PayoutOffchainUnavailable'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_PayoutNotFound'
                - $ref: '#/components/schemas/wallet_PayoutCommitted'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_UserNotFound'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: putWalletCryptoWithdrawById
      x-operation-id-source: derived
    delete:
      tags:
      - Withdrawals
      summary: Roll back a withdrawal
      description: 'ℹ️ Get `id` parameter value from the response to a `POST /wallet/crypto/withdraw` call.


        **Permission**: Withdraw cryptocurrencies


        **IP limit**: 10/10


        **Account limit**: 20/30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_LowAmount'
                - $ref: '#/components/schemas/wallet_CurrencyNotFound'
                - $ref: '#/components/schemas/wallet_NotAllowed'
                - $ref: '#/components/schemas/wallet_PayoutInvalidPaymentID'
                - $ref: '#/components/schemas/wallet_PayoutOffchainUnavailable'
                - $ref: '#/components/schemas/wallet_PayoutBlacklisted'
                - $ref: '#/components/schemas/wallet_PayoutAmountLocked'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_UserNotFound'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: deleteWalletCryptoWithdrawById
      x-operation-id-source: derived
    servers:
    - url: /api/3
  /wallet/crypto/withdraw/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/wallet_TransactionIdPathReq'
    put:
      tags:
      - Withdrawals
      summary: Cancel a withdrawal
      description: 'Attempts to cancel a withdrawal. Cancellation availability depends on the current transaction processing stage.


        ℹ️ Get `id` parameter value from the response to a `POST /wallet/crypto/withdraw` call.


        **Permission**: Withdraw cryptocurrencies


        **IP limit**: 10/10


        **Account limit**: 20/30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_Result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/wallet_Validation'
                - $ref: '#/components/schemas/wallet_TransactionNotFound'
                - $ref: '#/components/schemas/wallet_NotAllowed'
        '401':
          $ref: '#/components/responses/wallet_401'
        '403':
          $ref: '#/components/responses/wallet_403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet_UserNotFound'
        '408':
          $ref: '#/components/responses/wallet_408'
        '429':
          $ref: '#/components/responses/wallet_429'
        '500':
          $ref: '#/components/responses/wallet_500'
        '502':
          $ref: '#/components/responses/wallet_502'
        '503':
          $ref: '#/components/responses/wallet_503'
        '504':
          $ref: '#/components/responses/wallet_504'
        default:
          $ref: '#/components/responses/wallet_Error'
      security:
      - wallet_BearerAuth: []
      - wallet_BasicAuth: []
      operationId: putWalletCryptoWithdrawByIdCancel
      x-operation-id-source: derived
    servers:
    - url: /api/3
components:
  schemas:
    wallet_PaymentID:
      title: Payment ID
      type: object
      properties:
        payment_id:
          type: string
          pattern: ^[\w@\-.:<>]+$
          description: An additional recipient identifier (for example, "Memo") required for specific currencies.
    wallet_NotEnoughPermissions:
      title: Not enough permissions
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1007
          message: Not enough permissions
    wallet_TransactionNotFound:
      title: Transaction not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Any of:\n  * a transaction has failed to create;\n  * the requested transaction is not found.\n"
      example:
        error:
          code: 20004
          message: Transaction not found
          description: ''
    wallet_InternalWithdrawalRequest:
      allOf:
      - type: object
      - title: Internal withdrawal request
        discriminator:
          propertyName: by
          mapping:
            email: '#/components/schemas/wallet_InternalWithdrawalRequestEmail'
            username: '#/components/schemas/wallet_InternalWithdrawalRequestUsername'
            external_id: '#/components/schemas/wallet_InternalWithdrawalRequestExternalID'
            wallet_id: '#/components/schemas/wallet_InternalWithdrawalRequestWalletID'
        oneOf:
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestEmail'
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestUsername'
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestExternalID'
        - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestWalletID'
    wallet_CurrencyNotFound:
      title: Currency not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Currency is not found.\n\nAny of:\n  * requested network is not found;\n  * requested currency is not found;\n  * no currency provided while the network is specified;\n  * requested network is disabled;\n  * operations relating to the request are disabled for the currency;\n  * currencies featured in an operation are not found.\n"
      example:
        error:
          code: 2002
          message: Currency not found
    wallet_InternalWithdrawalRequestByEnum:
      title: Withdrawal targets
      type: string
      enum:
      - email
      - username
      - external_id
    wallet_ShouldUpgradePermission:
      title: Should upgrade permission
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Current permission scope in the authentication service is insufficient.
      example:
        error:
          code: 1006
          message: Action unavailable, please upgrade scopes
    wallet_BadFormatHS256:
      title: Bad format (HS256)
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Any of:\n  * missing required parameters;\n  * the maximum of the time window is exceeded.\n"
      example:
        error:
          code: 1004
          message: Unsupported authorization method
    wallet_PublicComment:
      title: Public comment
      type: object
      properties:
        public_comment:
          type: string
          maxLength: 255
          pattern: ^[\w@\-\.:<>]+( [\w@\-\.:<>]+)*$
          description: 'Custom text comment for external use.


            ℹ️ The specified value will be displayed in the transaction history and may help in identification of the transaction.


            ℹ️ Avoid the following characters: `&`, `''`, `<`, `>`, `"`.

            '
          example: Lorem ipsum dolor sit amet consectetur adipiscing elit...
    wallet_TransactionID:
      title: Transaction ID
      type: string
      format: uuid
      description: Transaction UUID.
      example: 27fa7f14-ca49-42fd-834a-4ce630d069d2
    wallet_PayoutInvalidPaymentID:
      title: Invalid payment ID
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Any of:\n  * an internal transfer recipient did not complete the registration;\n  * recipient payment identifier is of an invalid format.\n"
      example:
        error:
          code: 20012
          message: Payout payment address is invalid
    wallet_AuthInvalid:
      title: Invalid authorization
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Invalid JWT.
      example:
        error:
          code: 1005
          message: Invalid authorization
    wallet_Address:
      title: Deposit address
      type: object
      properties:
        address:
          $ref: '#/components/schemas/wallet_AddressCommon'
    wallet_TooManyRequests:
      title: Too Many Requests
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Rate limits are exceeded.
      example:
        error:
          code: 429
          message: Too many requests
    wallet_LowAmount:
      title: Low amount
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Operation amount is too low.\n\nAny of:\n  * provided amount is lesser than the currency precision (bit depth);\n  * fees are included in the final amount, and the amount is lesser than fees.\n"
      example:
        error:
          code: 10001
          message: Validation error
          description: Amount too low
    wallet_AmountCommon:
      title: Amount
      type: string
      description: 'The amount of the operation.


        Format: currency precision


        Values: > 0


        ℹ️ Call `GET /public/currency/{currency}` to get the currency precision.

        '
      example: '2.37'
    wallet_Result:
      title: Result
      type: object
      required:
      - result
      properties:
        result:
          type: boolean
    wallet_PayoutInvalidAddress:
      title: Invalid payout address
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Receiver deposit address has an invalid format.
      example:
        error:
          code: 20011
          message: Payout address is invalid
    wallet_AddressCommon:
      title: Deposit address
      type: string
      pattern: ^([\w@\-.:<>]+|[0-9A-Z]{4}( ?[0-9A-Z]{4}){8}|(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?)$
      description: Deposit crypto address.
      example: 3A3MR43kUvahSAJtTsxzE8mcTz3VfL9upi
    wallet_PayoutCommitted:
      title: Payout committed
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Transaction associated with the operation was complete before being committed or rolled back.
      example:
        error:
          code: 20006
          message: Payout already committed
    wallet_Validation:
      title: Validation
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Any of:\n  * invalid JSON payload;\n  * invalid form payload;\n  * invalid payload format;\n  * invalid parameter value;\n  * invalid parameter format;\n  * specified parameters are mutually exclusive;\n  * a required parameter is missing;\n  * the value of a parameter is invalid;\n  * provided value is not unique;\n  * in an update request, no parameters provided.\n"
      example:
        error:
          code: 10001
          message: Validation error
    wallet_UnauthorizedBasic:
      title: Unauthorized (Basic)
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: "Any of:\n  * invalid API key;\n  * user is not allowed to perform the requested operation.\n"
      example:
        error:
          code: 1002
          message: Authorization is required or has been failed
    wallet_Amount:
      title: Amount
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/wallet_AmountCommon'
    wallet_InternalWithdrawalRequestWalletID:
      title: Wallet ID
      allOf:
      - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
      - type: object
        required:
        - identifier
        properties:
          identifier:
            type: string
            minLength: 5
            maxLength: 60
            pattern: ^[a-z0-9].$
            description: Target user wallet ID (without a domain).
            example: johndoe
    wallet_GatewayTimeout:
      title: Gateway Timeout
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: Gateway timeout.
      example:
        error:
          code: 22008
          message: Gateway timeout. Please, try again later.
    wallet_Currency:
      title: Currency
      properties:
        currency:
          $ref: '#/components/schemas/wallet_CurrencyCommon'
    wallet_InternalWithdrawalRequestBase:
      title: Withdrawal request
      allOf:
      - $ref: '#/components/schemas/wallet_Currency'
      - $ref: '#/components/schemas/wallet_Amount'
      - $ref: '#/components/schemas/wallet_PublicComment'
      - type: object
        required:
        - currency
        - by
        - amount
        properties:
          by:
            allOf:
            - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestByEnum'
            description: Type of the target user identifier.
    wallet_InternalWithdrawalRequestEmail:
      title: Email
      allOf:
      - $ref: '#/components/schemas/wallet_InternalWithdrawalRequestBase'
      - type: object
        required:
        - identifier
        properties:
          identifier:
            type: string
            format: email
            description: Target user email.
            example: johndoe@example.com
    wallet_PayoutNotFound:
      title: Payout not found
      schema:
        $ref: '#/components/schemas/wallet_Error'
      type: object
      description: The requested withdrawal is not found.
      example:
